<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山真海胃 You are what you eat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jade:      '#95d3c3',
            ink:       '#2C2623',
            clay:      '#C04A3B',
            crimson:   '#85291b',
            sand:      '#c8b88a',
            amber:     '#D98A5B',
            forest:    '#4A6B5D',
            muted:     '#c8b88a',
            parchment: '#201d12',
            stroke:    '#3a3020',
            paper:     '#252016',
            night:     '#1b1200',
            cream:     '#f5e0bb',
            mist:      '#a8c5bf',
            blush:     '#ffb4a7',
            deep:      '#120c00',
          },
          fontFamily: {
            sans: ['Inter','Noto Sans TC','ui-sans-serif','system-ui','sans-serif'],
            serif: ['Noto Serif TC','serif'],
            mono: ['JetBrains Mono','ui-monospace','SFMono-Regular','monospace'],
          },
          boxShadow: { card: '0 8px 30px rgba(135,123,115,0.08)' }
        }
      }
    }
  </script>
  <style>
    :root {
      --jade:     #95d3c3;
      --ink:      #2C2623;
      --clay:     #C04A3B;
      --crimson:  #85291b;
      --sand:     #c8b88a;
      --amber:    #D98A5B;
      --forest:   #4A6B5D;
      --muted:    #c8b88a;
      --parchment:#201d12;
      --stroke:   #3a3020;
      --paper:    #252016;
      --night:    #1b1200;
      --cream:    #f5e0bb;
      --mist:     #a8c5bf;
      --blush:    #ffb4a7;
      --deep:     #120c00;
      --r:        5px;
    }
    @media (min-width: 768px) { html { overflow-y: scroll; } }
    body { background-color: var(--night); color: var(--cream); font-family: 'Noto Serif TC', serif; overflow-x: hidden; }
    ::selection { background-color: var(--clay); color: white; }
    .paper-texture {
      background-image: radial-gradient(#877B73 0.5px, transparent 0.5px);
      background-size: 24px 24px;
      opacity: 0.05;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .seal {
      display: inline-block;
      border: 2px solid var(--clay);
      color: var(--clay);
      padding: 2px 4px;
      font-size: 10px;
      font-weight: 900;
      transform: rotate(-8deg);
      margin-left: 8px;
      border-radius: 2px;
      font-family: 'Noto Serif TC', serif;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    /* Dark-theme overrides: force white/light utility classes to dark equivalents */
    .bg-white { background-color: #252016 !important; }
    .text-ink  { color: #f5e0bb !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-slow { animation: spin 15s linear infinite; border-top: 4px solid var(--clay); border-radius: 9999px; position: absolute; inset: 0; opacity: 0.6; }
    .spin-loading { animation: spin 2s linear infinite; display: inline-block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes fadeSlideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeSlideIn 0.3s ease-out; }
    @keyframes onboardFadeIn { from{opacity:0} to{opacity:1} }
    .onboard-in { animation: onboardFadeIn 1s ease-out; }
    @keyframes onboardSlideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
    .onboard-text-in { animation: onboardSlideUp 0.8s ease-out 0.5s both; }
    .onboard-btn-in { animation: onboardSlideUp 0.8s ease-out 0.9s both; }
    @keyframes floatGlow { 0%,100%{transform:translateY(0);filter:brightness(1)} 50%{transform:translateY(-6px);filter:brightness(1.2)} }
    .float-glow { animation: floatGlow 3s ease-in-out infinite; }
    @keyframes fadeOut { from{opacity:1} to{opacity:0} }
    .fade-out { animation: fadeOut 0.6s ease-out forwards; }
    @keyframes modalSlideUp { from{opacity:0;transform:translateY(30px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal-up { animation: modalSlideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes sheetSlideUp { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
    .sheet-up { animation: sheetSlideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    /* 凝練食緒／記錄選擇：神聖淡入、白光、呼吸感 */
    @keyframes recordVeilIn { from{ opacity:0 } to{ opacity:1 } }
    .record-overlay-veil { animation: recordVeilIn 0.7s ease-out both; }
    @keyframes recordModalSacredIn {
      0%   { opacity:0; transform:translateY(14px); filter:brightness(1.35) blur(2px); }
      35%  { opacity:0.72; filter:brightness(1.12) blur(0); }
      100% { opacity:1; transform:translateY(0); filter:brightness(1) blur(0); }
    }
    .record-modal-sacred {
      animation: recordModalSacredIn 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    @keyframes recordSacredGlow {
      0%, 100% { opacity:0.28; }
      50%      { opacity:0.62; }
    }
    .record-sacred-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      border-radius: inherit;
      background:
        radial-gradient(ellipse 90% 55% at 50% -5%, rgba(255, 252, 245, 0.22) 0%, transparent 58%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 248, 235, 0.08) 0%, transparent 55%);
      animation: recordSacredGlow 5.5s ease-in-out 0.85s infinite;
    }
    @keyframes recordFabGlow {
      0%, 100% { box-shadow: 0 4px 20px rgba(133,41,27,0.45), 0 0 0 rgba(255,248,235,0); }
      50%      { box-shadow: 0 4px 24px rgba(133,41,27,0.5), 0 0 18px rgba(255,248,235,0.35); }
    }
    .record-fab-btn {
      transition: opacity 0.4s ease, box-shadow 0.4s ease;
      animation: recordFabGlow 3.5s ease-in-out infinite;
    }
    .record-fab-btn:active { opacity: 0.88; animation: none; }
    @keyframes hatchReveal {
      0%   { opacity:0; transform:scale(0.88); filter:brightness(1.5) blur(8px); }
      40%  { opacity:1; transform:scale(1.02); filter:brightness(1.15) blur(0); }
      100% { opacity:1; transform:scale(1); filter:brightness(1) blur(0); }
    }
    @keyframes hatchAuraPulse {
      0%, 100% { opacity:0.35; transform:scale(1); }
      50%      { opacity:0.75; transform:scale(1.08); }
    }
    .hatch-celebration-img { animation: hatchReveal 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .hatch-celebration-aura { animation: hatchAuraPulse 3s ease-in-out 0.5s infinite; }
    @keyframes recordSacredFlash {
      0%   { opacity:0; transform:scale(0.99); }
      18%  { opacity:0.38; transform:scale(1); }
      38%  { opacity:0.26; }
      58%  { opacity:0.14; }
      78%  { opacity:0.05; }
      100% { opacity:0; transform:scale(1.01); }
    }
    .record-sacred-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.32) 0%, transparent 68%);
      animation: recordSacredFlash 2.4s cubic-bezier(0.33, 0, 0.2, 1) forwards;
    }
    .result-modal-backdrop { background: rgba(0,0,0,0.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    @media (max-width: 639px) {
      .result-modal-backdrop { backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    .progress-bar { animation: progressBar 1s ease-out forwards; }
    .hover-scale { transition: transform 0.2s; }
    .hover-scale:hover { transform: scale(1.02); }
    .hover-scale:active { transform: scale(0.98); }
    @keyframes slide-up-fade { from{opacity:0;transform:translateY(20px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes result-sheet-up { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
    .result-modal-sheet {
      max-height: min(92dvh, 720px);
      animation: result-sheet-up 0.38s cubic-bezier(0.2, 0.85, 0.25, 1) both;
    }
    @media (min-width: 640px) {
      .result-modal-sheet { animation: slide-up-fade 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    }
    .result-modal-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .result-modal-footer {
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    }
    @keyframes aura-breathe { 0%,100%{opacity:0.25} 50%{opacity:0.9} }
    @keyframes mist-dissipate { 0%{opacity:1;transform:scale(1);filter:blur(0px)} 60%{opacity:0.6;transform:scale(1.15);filter:blur(6px)} 100%{opacity:0;transform:scale(1.35);filter:blur(16px)} }
    /* 水墨煙霧：淡墨晕染、留白，勿厚霧 */
    @keyframes creatureMistDrift {
      0%, 100% { opacity: 0.42; transform: translate(0, 0); }
      50% { opacity: 0.52; transform: translate(2%, -1.5%); }
    }
    @keyframes creatureMistWisp {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.38; }
    }
    .creature-mist-veil {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 130% 32% at 28% 45%, rgba(72, 62, 48, 0.22) 0%, transparent 78%),
        radial-gradient(ellipse 110% 28% at 72% 52%, rgba(58, 50, 40, 0.16) 0%, transparent 75%),
        radial-gradient(ellipse 90% 22% at 48% 68%, rgba(42, 36, 28, 0.12) 0%, transparent 80%);
      animation: creatureMistDrift 14s ease-in-out infinite;
      mix-blend-mode: multiply;
    }
    .creature-mist-veil--alt {
      animation-duration: 18s;
      animation-direction: reverse;
      opacity: 0.65;
      mix-blend-mode: normal;
      background:
        radial-gradient(ellipse 100% 18% at 18% 38%, rgba(110, 98, 78, 0.1) 0%, transparent 82%),
        radial-gradient(ellipse 85% 16% at 82% 48%, rgba(88, 78, 62, 0.08) 0%, transparent 80%);
    }
    .creature-mist-wisp {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 32%;
      pointer-events: none;
      background: linear-gradient(to top, rgba(32, 26, 18, 0.28) 0%, transparent 88%);
      animation: creatureMistWisp 10s ease-in-out infinite;
    }
    /* 彈窗大圖：未孵化時輕暈墨、若隱若現（圖鑑小圖保持清晰） */
    .creature-detail-portrait--veiled img {
      filter: blur(9px) brightness(0.88) saturate(0.82) contrast(0.95);
      transform: scale(1.04);
    }
    @keyframes creatureLockGlow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(212, 168, 67, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(212, 168, 67, 0.45)); }
    }
    .creature-mist-lock-seal {
      animation: creatureLockGlow 3.2s ease-in-out infinite;
    }
    @keyframes red-flash { 0%{opacity:0} 25%{opacity:1} 75%{opacity:0.8} 100%{opacity:0} }
    @keyframes gold-border-pulse { 0%,100%{opacity:0.25} 50%{opacity:1} }
    @keyframes merit-bounce { 0%{transform:scale(0) rotate(-10deg);opacity:0} 60%{transform:scale(1.2) rotate(3deg);opacity:1} 80%{transform:scale(0.92) rotate(-2deg)} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes merit-shimmer { 0%,100%{text-shadow:0 0 6px rgba(255,215,0,0.5)} 50%{text-shadow:0 0 16px rgba(255,215,0,0.9),0 0 32px rgba(255,215,0,0.4)} }
    @keyframes shichen-in { from{opacity:0;transform:translateX(12px)} to{opacity:1;transform:translateX(0)} }
    .shichen-content { animation: shichen-in 0.28s cubic-bezier(0.2,0.8,0.2,1) both; }
    .fortune-card { position:relative; width:100%; max-width:300px; margin:0 auto; animation:slide-up-fade 0.5s 0.2s cubic-bezier(0.2,0.8,0.2,1) both; }
    .fortune-card::before { content:''; position:absolute; inset:-3px; border-radius:12px; background:linear-gradient(45deg,#2a2108,#d4a843,#5a3e08,#d4a843,#2a2108); z-index:-1; animation:aura-breathe 3.5s 1.4s ease-in-out infinite; }
    .merit-badge { animation:merit-bounce 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.6s both, merit-shimmer 2s ease-in-out 2.2s infinite; }
    .spectral-slider { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; outline:none; cursor:pointer; }
    .spectral-slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,0.95); border:2px solid rgba(255,255,255,0.35); box-shadow:0 2px 8px rgba(0,0,0,0.5),0 0 0 3px rgba(255,255,255,0.08); cursor:pointer; }
    .spectral-slider::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,0.95); border:none; box-shadow:0 2px 8px rgba(0,0,0,0.5); cursor:pointer; }
    .inject-btn { transition: box-shadow 0.3s, background 0.3s; }
    .inject-btn:hover:not(:disabled) { box-shadow: 0 0 32px rgba(212,168,67,0.2), 0 4px 24px rgba(0,0,0,0.4); }
    .inject-btn:active:not(:disabled) { transform: scale(0.98); }
    .record-modal-sacred .inject-btn:active:not(:disabled) { transform: none; opacity: 0.88; }

    /* ── 凝煉特效（送出中） ── */
    .inject-btn.is-charging {
      box-shadow:
        0 0 28px rgba(212,168,67,0.45),
        0 0 56px rgba(212,168,67,0.22),
        0 6px 28px rgba(0,0,0,0.55);
      animation: chargeBreathe 2.4s ease-in-out infinite;
    }
    @keyframes chargeBreathe {
      0%, 100% { filter: brightness(1) saturate(1); }
      50%      { filter: brightness(1.18) saturate(1.18); }
    }
    /* 旋轉的金色流光邊框（conic-gradient） */
    .charge-border {
      position: absolute; inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      padding: 1.5px;
      background:
        conic-gradient(from 0deg,
          transparent 0deg,
          rgba(212,168,67,0.0) 30deg,
          rgba(212,168,67,0.85) 110deg,
          rgba(255,235,180,1) 150deg,
          rgba(212,168,67,0.85) 190deg,
          rgba(212,168,67,0.0) 270deg,
          transparent 360deg);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
              mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      animation: chargeBorderSpin 2.6s linear infinite;
      opacity: 0.95;
    }
    @keyframes chargeBorderSpin { to { transform: rotate(360deg); } }
    /* 內部能量呼吸 */
    .charge-halo {
      position: absolute; inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 80% at 50% 120%, rgba(212,168,67,0.55) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% -10%, rgba(255,235,180,0.35) 0%, transparent 60%);
      animation: chargeHaloPulse 1.6s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    @keyframes chargeHaloPulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }
    /* 三環同心金光（取代單一太極） */
    .charge-orb {
      position: relative;
      width: 26px; height: 26px;
      display: inline-block;
      flex-shrink: 0;
    }
    .charge-orb .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
    }
    .charge-orb .ring-outer {
      border-top-color: rgba(245,224,187,0.95);
      border-right-color: rgba(212,168,67,0.5);
      box-shadow: 0 0 14px rgba(212,168,67,0.55), inset 0 0 6px rgba(212,168,67,0.25);
      animation: chargeSpin 1.6s linear infinite;
    }
    .charge-orb .ring-mid {
      inset: 5px;
      border-top-color: rgba(255,232,170,0.9);
      border-left-color: rgba(212,168,67,0.55);
      animation: chargeSpin 1.05s linear infinite reverse;
      opacity: 0.92;
    }
    .charge-orb .ring-core {
      inset: 9px;
      border-top-color: rgba(255,250,230,1);
      border-bottom-color: rgba(212,168,67,0.6);
      animation: chargeSpin 0.7s linear infinite;
      opacity: 0.85;
    }
    .charge-orb .ring-dot {
      position: absolute; left: 50%; top: 50%;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,245,210,1);
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px 2px rgba(212,168,67,0.95), 0 0 18px 4px rgba(212,168,67,0.5);
      animation: chargeDotPulse 1.2s ease-in-out infinite;
    }
    @keyframes chargeSpin { to { transform: rotate(360deg); } }
    @keyframes chargeDotPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(0.7); opacity: 0.85; }
      50%      { transform: translate(-50%,-50%) scale(1.35); opacity: 1; }
    }
    /* 從底部上升的靈氣粒子 */
    .charge-sparks {
      position: absolute; inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }
    .charge-sparks .spark {
      position: absolute; bottom: 0;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,240,200,1);
      box-shadow: 0 0 6px 1px rgba(212,168,67,0.95), 0 0 12px 2px rgba(212,168,67,0.4);
      opacity: 0;
      animation: chargeSparkRise 2.2s ease-out infinite;
    }
    .charge-sparks .spark:nth-child(1) { left: 8%;  animation-delay: 0.0s; }
    .charge-sparks .spark:nth-child(2) { left: 22%; animation-delay: 0.6s; }
    .charge-sparks .spark:nth-child(3) { left: 38%; animation-delay: 1.1s; width:2px; height:2px; }
    .charge-sparks .spark:nth-child(4) { left: 54%; animation-delay: 0.3s; }
    .charge-sparks .spark:nth-child(5) { left: 68%; animation-delay: 1.4s; width:2px; height:2px; }
    .charge-sparks .spark:nth-child(6) { left: 82%; animation-delay: 0.9s; }
    .charge-sparks .spark:nth-child(7) { left: 94%; animation-delay: 1.7s; width:2px; height:2px; }
    @keyframes chargeSparkRise {
      0%   { opacity: 0; transform: translateY(0) scale(0.45); }
      15%  { opacity: 1; }
      80%  { opacity: 0.55; }
      100% { opacity: 0; transform: translateY(-46px) scale(0.55); }
    }
    /* 流光金字 */
    .charge-label {
      position: relative;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.4em;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(90deg,
        rgba(212,168,67,0.7) 0%,
        rgba(255,245,210,1) 50%,
        rgba(212,168,67,0.7) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: chargeTextShimmer 2.6s linear infinite;
      text-shadow: 0 0 12px rgba(212,168,67,0.0);
    }
    @keyframes chargeTextShimmer {
      0%   { background-position: 220% 0; }
      100% { background-position: -220% 0; }
    }
    /* 點點點呼吸 */
    .charge-label::after {
      content: '⋯';
      margin-left: 4px;
      letter-spacing: 0.1em;
      animation: chargeDots 1.4s steps(4, end) infinite;
      opacity: 0.85;
    }
    @keyframes chargeDots {
      0%   { opacity: 0.2; }
      50%  { opacity: 1; }
      100% { opacity: 0.2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .inject-btn.is-charging,
      .charge-border, .charge-halo, .charge-sparks .spark,
      .charge-orb .ring, .charge-orb .ring-dot,
      .charge-label, .charge-label::after { animation: none !important; }
    }

    /* ── 全螢幕凝煉儀式（送出中覆蓋層） ── */
    .charge-veil {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: chargeVeilIn 0.55s cubic-bezier(0.22, 0.85, 0.25, 1) both;
      isolation: isolate;
    }
    @keyframes chargeVeilIn {
      from { opacity: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); }
      to   { opacity: 1; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    }
    /* 退場：整層淡出但「光球綻放擴散」，與 FortuneDecreeModal 的金光 cross-fade */
    .charge-veil.exiting {
      pointer-events: none;
      z-index: 105;
      animation: chargeVeilOut 0.7s cubic-bezier(0.4, 0, 0.6, 1) both;
    }
    @keyframes chargeVeilOut {
      0%   { opacity: 1; }
      60%  { opacity: 0.55; }
      100% { opacity: 0; }
    }
    .charge-veil.exiting .charge-veil-orb {
      animation: chargeOrbBloom 0.7s cubic-bezier(0.22, 0.85, 0.25, 1) both !important;
    }
    @keyframes chargeOrbBloom {
      0%   { transform: scale(1); opacity: 1; filter: blur(0); }
      55%  { transform: scale(1.6); opacity: 0.85; filter: blur(2px); }
      100% { transform: scale(2.4); opacity: 0; filter: blur(10px); }
    }
    .charge-veil.exiting .charge-veil-aura {
      animation: chargeAuraBloom 0.7s cubic-bezier(0.3, 0.7, 0.3, 1) both !important;
    }
    @keyframes chargeAuraBloom {
      0%   { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .charge-veil.exiting .charge-veil-rays {
      animation: chargeRaysBloom 0.7s cubic-bezier(0.3, 0.7, 0.3, 1) both !important;
    }
    @keyframes chargeRaysBloom {
      0%   { transform: scale(1) rotate(0deg); opacity: 0.6; }
      100% { transform: scale(1.45) rotate(60deg); opacity: 0; }
    }
    .charge-veil.exiting .charge-veil-text,
    .charge-veil.exiting .charge-veil-corner,
    .charge-veil.exiting .charge-veil-particles {
      animation: chargeFadeOut 0.35s ease-out both !important;
    }
    @keyframes chargeFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
    .charge-veil::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(60, 38, 8, 0.78) 0%, rgba(15, 8, 0, 0.92) 60%, rgba(0,0,0,0.96) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: -2;
    }
    /* 中央能量光暈（呼吸 + 旋轉） */
    .charge-veil-aura {
      position: absolute;
      width: min(80vmin, 720px);
      height: min(80vmin, 720px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 230, 170, 0.35) 0%, rgba(212,168,67,0.25) 20%, transparent 55%);
      filter: blur(8px);
      animation: chargeVeilAuraBreathe 4s ease-in-out infinite;
      z-index: -1;
    }
    @keyframes chargeVeilAuraBreathe {
      0%, 100% { transform: scale(0.92); opacity: 0.65; }
      50%      { transform: scale(1.08); opacity: 1; }
    }
    /* 四方光束（從中心向外的金色射線） */
    .charge-veil-rays {
      position: absolute;
      width: min(120vmin, 1200px);
      height: min(120vmin, 1200px);
      background:
        conic-gradient(from 0deg,
          transparent 0deg,
          rgba(212,168,67,0.10) 12deg,
          transparent 24deg,
          transparent 86deg,
          rgba(212,168,67,0.06) 92deg,
          transparent 104deg,
          transparent 176deg,
          rgba(212,168,67,0.10) 188deg,
          transparent 200deg,
          transparent 266deg,
          rgba(212,168,67,0.06) 272deg,
          transparent 284deg,
          transparent 360deg);
      animation: chargeVeilRaysSpin 16s linear infinite;
      mask: radial-gradient(circle at 50% 50%, black 0%, black 8%, transparent 75%);
      -webkit-mask: radial-gradient(circle at 50% 50%, black 0%, black 8%, transparent 75%);
      z-index: -1;
    }
    @keyframes chargeVeilRaysSpin { to { transform: rotate(360deg); } }
    /* 大型同心金光（取代小 orb） */
    .charge-veil-orb {
      position: relative;
      width: clamp(140px, 36vmin, 220px);
      height: clamp(140px, 36vmin, 220px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .charge-veil-orb .v-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
    }
    .charge-veil-orb .v-ring-12 {
      inset: -6%;
      border: none;
      background:
        repeating-conic-gradient(
          rgba(212,168,67,0.85) 0deg 1.2deg,
          transparent 1.2deg 30deg
        );
      -webkit-mask: radial-gradient(circle, transparent 47%, black 49%, black 51%, transparent 53%);
              mask: radial-gradient(circle, transparent 47%, black 49%, black 51%, transparent 53%);
      animation: chargeSpin 22s linear infinite;
      opacity: 0.85;
    }
    .charge-veil-orb .v-ring-1 {
      border-top-color: rgba(245, 224, 187, 0.95);
      border-right-color: rgba(212,168,67,0.55);
      box-shadow:
        0 0 24px rgba(212,168,67,0.55),
        inset 0 0 18px rgba(212,168,67,0.28);
      animation: chargeSpin 4.5s linear infinite;
    }
    .charge-veil-orb .v-ring-2 {
      inset: 10%;
      border-top-color: rgba(255, 235, 180, 0.9);
      border-left-color: rgba(212,168,67,0.65);
      animation: chargeSpin 3s linear infinite reverse;
      opacity: 0.95;
    }
    .charge-veil-orb .v-ring-3 {
      inset: 22%;
      border-top-color: rgba(255, 248, 220, 1);
      border-bottom-color: rgba(212,168,67,0.7);
      animation: chargeSpin 1.8s linear infinite;
      opacity: 0.92;
    }
    .charge-veil-orb .v-ring-4 {
      inset: 34%;
      border: 1px dashed rgba(212,168,67,0.65);
      animation: chargeSpin 7s linear infinite reverse;
      opacity: 0.85;
    }
    .charge-veil-orb .v-core {
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 250, 230, 1) 0%, rgba(255, 220, 140, 0.9) 45%, rgba(212,168,67,0.2) 80%, transparent 100%);
      box-shadow:
        0 0 24px 8px rgba(255, 220, 140, 0.55),
        0 0 48px 16px rgba(212,168,67,0.35);
      animation: chargeCoreBreathe 2.2s ease-in-out infinite;
    }
    @keyframes chargeCoreBreathe {
      0%, 100% { transform: scale(0.85); opacity: 0.9; }
      50%      { transform: scale(1.15); opacity: 1; }
    }
    /* 全螢幕粒子（從底部隨機上升） */
    .charge-veil-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .charge-veil-particles .p {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 240, 200, 1);
      box-shadow: 0 0 8px 2px rgba(212,168,67,0.95), 0 0 18px 4px rgba(212,168,67,0.4);
      opacity: 0;
      animation: chargeVeilParticleRise 5.5s linear infinite;
    }
    .charge-veil-particles .p:nth-child(1)  { left:  4%; animation-delay: 0.0s; }
    .charge-veil-particles .p:nth-child(2)  { left: 11%; animation-delay: 0.7s; width:3px; height:3px; }
    .charge-veil-particles .p:nth-child(3)  { left: 18%; animation-delay: 2.1s; }
    .charge-veil-particles .p:nth-child(4)  { left: 26%; animation-delay: 1.2s; width:2px; height:2px; }
    .charge-veil-particles .p:nth-child(5)  { left: 33%; animation-delay: 3.4s; }
    .charge-veil-particles .p:nth-child(6)  { left: 41%; animation-delay: 0.4s; width:3px; height:3px; }
    .charge-veil-particles .p:nth-child(7)  { left: 49%; animation-delay: 2.6s; width:5px; height:5px; }
    .charge-veil-particles .p:nth-child(8)  { left: 57%; animation-delay: 1.7s; }
    .charge-veil-particles .p:nth-child(9)  { left: 65%; animation-delay: 4.1s; width:2px; height:2px; }
    .charge-veil-particles .p:nth-child(10) { left: 72%; animation-delay: 0.9s; width:3px; height:3px; }
    .charge-veil-particles .p:nth-child(11) { left: 80%; animation-delay: 3.0s; }
    .charge-veil-particles .p:nth-child(12) { left: 87%; animation-delay: 1.5s; width:2px; height:2px; }
    .charge-veil-particles .p:nth-child(13) { left: 94%; animation-delay: 4.6s; width:3px; height:3px; }
    .charge-veil-particles .p:nth-child(14) { left: 38%; animation-delay: 5.0s; width:2px; height:2px; }
    .charge-veil-particles .p:nth-child(15) { left: 60%; animation-delay: 3.7s; width:2px; height:2px; }
    .charge-veil-particles .p:nth-child(16) { left: 76%; animation-delay: 2.4s; width:3px; height:3px; }
    @keyframes chargeVeilParticleRise {
      0%   { transform: translateY(0) scale(0.4); opacity: 0; }
      8%   { opacity: 0.9; }
      55%  { opacity: 0.85; transform: translateY(-55vh) scale(1); }
      100% { transform: translateY(-110vh) scale(0.4); opacity: 0; }
    }
    /* 文字 */
    .charge-veil-text {
      position: relative;
      margin-top: clamp(16px, 4vmin, 28px);
      text-align: center;
      animation: chargeTextFadeIn 0.8s 0.2s ease-out both;
    }
    @keyframes chargeTextFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .charge-veil-text .v-title {
      font-family: 'Noto Serif TC', serif;
      font-weight: 900;
      font-size: clamp(22px, 5vmin, 34px);
      letter-spacing: 0.45em;
      padding-left: 0.45em;
      background: linear-gradient(90deg,
        rgba(212,168,67,0.7) 0%,
        rgba(255,245,210,1) 50%,
        rgba(212,168,67,0.7) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: chargeTextShimmer 3.2s linear infinite;
      margin: 0;
    }
    .charge-veil-text .v-sub {
      margin: 12px 0 0;
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(11px, 1.6vmin, 13px);
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      color: rgba(212,168,67,0.75);
      animation: chargeDots 1.6s steps(4, end) infinite;
    }
    /* 中央內容容器 */
    .charge-veil-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    /* 角落金色裝飾 */
    .charge-veil-corner {
      position: absolute;
      width: clamp(40px, 8vmin, 64px);
      height: clamp(40px, 8vmin, 64px);
      border: 1.5px solid rgba(212,168,67,0.55);
      pointer-events: none;
      opacity: 0;
      animation: chargeCornerIn 0.6s 0.15s cubic-bezier(0.22, 0.85, 0.25, 1) both,
                 chargeCornerGlow 3.6s ease-in-out 0.8s infinite;
    }
    .charge-veil-corner.tl { top: clamp(16px, 4vmin, 32px); left: clamp(16px, 4vmin, 32px); border-right: none; border-bottom: none; }
    .charge-veil-corner.tr { top: clamp(16px, 4vmin, 32px); right: clamp(16px, 4vmin, 32px); border-left: none; border-bottom: none; }
    .charge-veil-corner.bl { bottom: clamp(16px, 4vmin, 32px); left: clamp(16px, 4vmin, 32px); border-right: none; border-top: none; }
    .charge-veil-corner.br { bottom: clamp(16px, 4vmin, 32px); right: clamp(16px, 4vmin, 32px); border-left: none; border-top: none; }
    @keyframes chargeCornerIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes chargeCornerGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(212,168,67,0.3); }
      50%      { box-shadow: 0 0 18px rgba(212,168,67,0.65); }
    }
    @media (prefers-reduced-motion: reduce) {
      .charge-veil, .charge-veil-aura, .charge-veil-rays,
      .charge-veil-orb .v-ring, .charge-veil-orb .v-core,
      .charge-veil-particles .p, .charge-veil-text .v-title, .charge-veil-text .v-sub,
      .charge-veil-corner { animation: none !important; }
      .charge-veil::before { backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    }

    /* ── 詩籤揭曉（金光凝聚 → 透出詩籤，連續無斷點） ── */
    .decree-reveal-root {
      isolation: isolate;
    }
    .decree-reveal-backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(40, 24, 6, 0.85) 0%, rgba(0, 0, 0, 0.92) 70%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: decreeBackdropIn 0.6s ease-out both;
    }
    @keyframes decreeBackdropIn {
      from { opacity: 0.55; }
      to   { opacity: 1; }
    }
    /* 中央金色光暈：延續 charging veil 的金光，慢慢呼吸 */
    .decree-halo {
      position: absolute;
      width: min(92vmin, 720px);
      height: min(92vmin, 720px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255, 240, 200, 0.55) 0%,
          rgba(212, 168, 67, 0.35) 22%,
          rgba(140, 90, 30, 0.18) 48%,
          transparent 72%);
      filter: blur(10px);
      pointer-events: none;
      animation: decreeHaloIn 1.2s cubic-bezier(0.22, 0.85, 0.25, 1) both,
                 decreeHaloBreathe 4.5s ease-in-out 1.2s infinite;
      z-index: 1;
    }
    @keyframes decreeHaloIn {
      0%   { opacity: 0.85; transform: scale(0.9); filter: blur(8px); }
      35%  { opacity: 1;    transform: scale(1.1); filter: blur(8px); }
      100% { opacity: 0.85; transform: scale(1);   filter: blur(10px); }
    }
    @keyframes decreeHaloBreathe {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50%      { opacity: 0.9; transform: scale(1.03); }
    }
    /* 旋轉光束，像極光緩慢盤旋 */
    .decree-rays {
      position: absolute;
      width: min(140vmin, 1100px);
      height: min(140vmin, 1100px);
      background:
        conic-gradient(from 0deg,
          transparent 0deg,
          rgba(212, 168, 67, 0.08) 14deg,
          transparent 28deg,
          transparent 88deg,
          rgba(255, 235, 180, 0.05) 92deg,
          transparent 96deg,
          transparent 178deg,
          rgba(212, 168, 67, 0.08) 192deg,
          transparent 206deg,
          transparent 268deg,
          rgba(255, 235, 180, 0.05) 272deg,
          transparent 276deg,
          transparent 360deg);
      mask: radial-gradient(circle at 50% 50%, black 0%, black 12%, transparent 70%);
      -webkit-mask: radial-gradient(circle at 50% 50%, black 0%, black 12%, transparent 70%);
      animation: decreeRaysIn 1.2s ease-out both,
                 decreeRaysSpin 28s linear 1.2s infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes decreeRaysIn {
      from { opacity: 0; transform: scale(0.5) rotate(0deg); }
      to   { opacity: 1; transform: scale(1) rotate(8deg); }
    }
    @keyframes decreeRaysSpin {
      from { transform: rotate(8deg); }
      to   { transform: rotate(368deg); }
    }
    /* 上升的金色靈氣粒子 */
    .decree-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }
    .decree-particles .dp {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 240, 200, 1);
      box-shadow: 0 0 6px 1.5px rgba(212, 168, 67, 0.85), 0 0 14px 3px rgba(212, 168, 67, 0.35);
      opacity: 0;
      animation: decreeParticleRise 6s linear infinite;
    }
    .decree-particles .dp:nth-child(1)  { left:  6%; animation-delay: 0.0s; }
    .decree-particles .dp:nth-child(2)  { left: 14%; animation-delay: 1.4s; width: 2px; height: 2px; }
    .decree-particles .dp:nth-child(3)  { left: 23%; animation-delay: 2.7s; }
    .decree-particles .dp:nth-child(4)  { left: 32%; animation-delay: 0.9s; width: 2px; height: 2px; }
    .decree-particles .dp:nth-child(5)  { left: 41%; animation-delay: 3.5s; }
    .decree-particles .dp:nth-child(6)  { left: 50%; animation-delay: 1.7s; width: 4px; height: 4px; }
    .decree-particles .dp:nth-child(7)  { left: 59%; animation-delay: 4.2s; width: 2px; height: 2px; }
    .decree-particles .dp:nth-child(8)  { left: 68%; animation-delay: 0.5s; }
    .decree-particles .dp:nth-child(9)  { left: 77%; animation-delay: 2.1s; width: 2px; height: 2px; }
    .decree-particles .dp:nth-child(10) { left: 86%; animation-delay: 3.8s; }
    .decree-particles .dp:nth-child(11) { left: 94%; animation-delay: 1.2s; width: 2px; height: 2px; }
    @keyframes decreeParticleRise {
      0%   { transform: translateY(0) scale(0.5); opacity: 0; }
      10%  { opacity: 0.9; }
      55%  { opacity: 0.8; transform: translateY(-55vh) scale(1); }
      100% { transform: translateY(-110vh) scale(0.4); opacity: 0; }
    }
    /* 詩籤舞台容器 */
    .decree-stage {
      position: relative;
      z-index: 3;
      width: min(92vw, 340px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* 詩籤包裝：從金光中浮現（scale + blur + glow 同步收斂） */
    .decree-paper-wrap {
      width: 100%;
      position: relative;
      animation: decreePaperEmerge 1.45s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both;
      will-change: opacity, transform, filter;
    }
    @keyframes decreePaperEmerge {
      0% {
        opacity: 0;
        transform: scale(0.72);
        filter: brightness(1.6) blur(12px);
      }
      35% {
        opacity: 0.6;
        transform: scale(0.92);
        filter: brightness(1.32) blur(6px);
      }
      60% {
        opacity: 0.92;
        transform: scale(1.015);
        filter: brightness(1.12) blur(1.5px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1) blur(0);
      }
    }
    /* 詩籤後方的金色背光：與詩籤同步呼吸 */
    .decree-paper-wrap::before {
      content: '';
      position: absolute;
      inset: -32px;
      border-radius: 24px;
      background: radial-gradient(ellipse at 50% 50%,
        rgba(255, 240, 200, 0.45) 0%,
        rgba(212, 168, 67, 0.28) 35%,
        transparent 75%);
      filter: blur(14px);
      pointer-events: none;
      z-index: -1;
      animation: decreePaperHaloIn 1.45s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s both,
                 decreePaperHaloBreathe 4s ease-in-out 1.7s infinite;
    }
    @keyframes decreePaperHaloIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes decreePaperHaloBreathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    .decree-paper-wrap .fortune-card {
      margin: 0 auto;
      animation: none;
    }
    .decree-paper-wrap .fortune-card::before {
      animation: aura-breathe 3.5s 1.2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .decree-halo, .decree-rays, .decree-particles .dp,
      .decree-paper-wrap, .decree-paper-wrap::before {
        animation: none !important;
      }
      .decree-paper-wrap { opacity: 1; transform: none; filter: none; }
      .decree-paper-wrap::before { opacity: 0.7; }
    }
    /* 中式朱紅框（凝練食緒彈窗） */
    .cn-red-frame-modal {
      border: 2px solid #9e2a2b !important;
      box-shadow:
        inset 0 0 0 1px #d4503c,
        inset 0 0 0 3px rgba(37, 29, 18, 0.92),
        0 8px 32px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      box-sizing: border-box;
    }
    .cn-red-frame-modal > .cn-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #d4503c;
      border-style: solid;
      pointer-events: none;
      z-index: 30;
    }
    .cn-corner-tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .cn-corner-tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .cn-corner-bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .cn-corner-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }
    .body-feeling-spectrum-hint {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(176, 167, 161, 0.9);
      margin: 0 2px 10px;
    }
    .body-feeling-spectrum-hint span:last-child { text-align: right; }
    .body-feeling-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .body-feeling-card:active { transform: scale(0.98); }
    @media (min-width: 768px) {
      .body-feeling-grid-3x2 { gap: 12px; }
    }
    /* 選中態：低調的金色描邊，淡淡的暖色 tint */
    .body-feeling-card { position: relative; }
    .body-feeling-card.is-selected {
      background: rgba(217, 138, 91, 0.06) !important;
      border-color: rgba(217, 138, 91, 0.7) !important;
      color: var(--cream) !important;
      box-shadow:
        0 0 0 1px rgba(217, 138, 91, 0.25),
        inset 0 0 14px rgba(217, 138, 91, 0.05);
    }
    .body-feeling-card.is-selected .bf-hint {
      color: rgba(245, 224, 187, 0.75) !important;
    }
    .creature-detail-sheet {
      animation: result-sheet-up 0.32s cubic-bezier(0.2, 0.85, 0.25, 1) both;
    }
    @media (min-width: 640px) {

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ── AI 經 Vercel API（OPENAI_API_KEY 設在 Vercel 環境變數，勿寫在前端）──

    // ── Constants ──
    const MBEI_TYPES = {
      MNHR: { code:'MNHR', name:'玄武 (The Guardian)', creature:'玄武', description:'北方守護神，龜蛇一體，象徵沉穩與長久守護。以心緒安定為飲食核心，規律攝取原型而厚實的食物，透過固定節奏承接較高飽足感。魂、野、煞、曆並行，像以三餐築起一座安定的玄甲。', insight:'以情緒安定為軸，規律吃厚實原型食，用飲食秩序穩住內在。', emoji:'🐢' },
      MNHV: { code:'MNHV', name:'麒麟 (The Sacred Beast)', creature:'麒麟', description:'仁義瑞獸，象徵祥和與心緒修復。進食多受情緒牽引，時間較隨性，偏向原型而豐盛的食物，身體感受也較厚重。魂、野、煞、幻交織，像一場由心情召喚的盛宴。', insight:'情緒牽引下隨性享用豐盛原型食，療癒感強，也帶來厚重飽足。', emoji:'🦒' },
      MNLR: { code:'MNLR', name:'白澤 (The Wise Seer)', creature:'白澤', description:'崑崙山上的全知聖獸，通達萬物、辟除邪氣。以心緒穩定為起點，規律攝取清淡原型食物，身體負擔低而節律清明。魂、野、靈、曆成形，是最清澈有序的食緒型格。', insight:'規律吃清淡原型食，心緒清明、身體輕盈，節律穩定。', emoji:'🦄' },
      MNLV: { code:'MNLV', name:'九尾 (The Spirit Fox)', creature:'九尾', description:'青丘靈狐，九尾象徵變化與流動。飲食跟隨心情起伏，時間不固定，偏向自然清淡、低負擔的原型食物。魂、野、靈、幻流轉，像一縷隨心而行的輕煙。', insight:'跟著心緒流動，隨性吃清淡原型食，輕盈而富變化。', emoji:'🦊' },
      MPHR: { code:'MPHR', name:'金烏 (The Sun-Bird)', creature:'金烏', description:'三足神鳥，司掌日輪與熱能。以情緒能量為食緒起點，進食節奏規律，偏向加工或精緻補給，身體負擔較高。魂、煉、煞、曆聚成火輪，規律之中仍有厚重熱度。', insight:'規律攝取精緻加工補給，情緒能量充足，也累積較厚重的身體負擔。', emoji:'🦅' },
      MPHV: { code:'MPHV', name:'饕餮 (The Devourer)', creature:'饕餮', description:'傳說中的吞食之獸，象徵強烈慾念與即時填補。情緒驅動明顯，進食時間流動不定，常偏向加工且高負擔的食物。魂、煉、煞、幻相互推動，如一股難以停歇的食緒漩渦。', insight:'情緒驅動下隨性吃加工重食，滿足感強，身體負擔也明顯。', emoji:'👺' },
      MPLR: { code:'MPLR', name:'織女 (The Weaver)', creature:'織女', description:'天帝之女，在銀河邊編織雲彩霓裳。以情緒秩序感為飲食核心，規律選擇精緻加工但低負擔的食物，讓心緒與節奏保持細密穩定。魂、煉、靈、曆如絲線交織，形成輕盈而有序的食緒紋理。', insight:'規律吃精緻低負擔食物，用飲食秩序維持心緒穩定。', emoji:'🧵' },
      MPLV: { code:'MPLV', name:'夢貘 (The Dream Eater)', creature:'夢貘', description:'吞夢之獸，游走於夜色與心緒之間。進食多由情緒牽引，時間較流動，偏向加工但低負擔的食物或簡便補給。魂、煉、靈、幻交錯，像在虛實之間尋找一口安撫。', insight:'情緒牽引下隨性吃低負擔加工食，在流動節奏中安撫心緒。', emoji:'🐘' },
      BNHR: { code:'BNHR', name:'當康 (The Harvest Boar)', creature:'當康', description:'其鳴自叫，見則豐收，象徵大地的充盈力量。以身體需求為主，規律攝取原型而紮實的食物，帶來明顯飽足與厚重能量。魄、野、煞、曆凝成豐收之相，重在穩定補給。', insight:'以身體需求為先，規律吃紮實原型食，獲得厚實而穩定的補給。', emoji:'🐗' },
      BNHV: { code:'BNHV', name:'朱厭 (The War Omen)', creature:'朱厭', description:'猿身紅足，象徵衝勢與爆發。以身體需求為主，進食時間較隨性，偏向原型而份量感明顯的食物，帶來較高身體負荷。魄、野、煞、幻並起，像一陣不定時湧現的赤色能量。', insight:'隨身體需求流動，隨性吃厚實原型食，力量感強但負擔也高。', emoji:'🐒' },
      BNLR: { code:'BNLR', name:'夔 (The Thunder Beast)', creature:'夔', description:'東海獨足神牛，出入伴風雨雷鳴。以身體機能為起點，規律攝取清淡原型食物，身體負擔低而節律穩定。魄、野、靈、曆如雷聲有序，清明而有力。', insight:'以身體機能為先，規律攝取清淡原型食，節律穩定如雷。', emoji:'🐃' },
      BNLV: { code:'BNLV', name:'夫諸 (The Water Deer)', creature:'夫諸', description:'白鹿四角，象徵清流與柔和感知。以身體需求為主，進食時間較隨性，偏向自然清淡、低負擔的原型食物。魄、野、靈、幻像水流轉向，順著身體訊號前行。', insight:'跟隨身體訊號，隨性吃清淡原型食，清透而流動。', emoji:'🦌' },
      BPHR: { code:'BPHR', name:'混沌 (The Primal Chaos)', creature:'混沌', description:'天地未開時的混沌之象，厚重而難分。以身體需求為主，進食節奏規律，偏向加工或精緻而負擔較高的食物。魄、煉、煞、曆形成穩定但濃厚的食緒結構。', insight:'規律吃加工厚重食物，補給穩定，但身體負擔偏高。', emoji:'🌀' },
      BPHV: { code:'BPHV', name:'魃 (The Drought Bringer)', creature:'魃', description:'旱氣之神，象徵乾烈與消耗。以身體需求為主，進食時間較隨性，偏向加工而高負擔的食物，使食緒呈現焦燥厚重之感。魄、煉、煞、幻聚成不定時升起的燥熱。', insight:'身體需求驅動下隨性吃加工重食，補給快速，負擔也較明顯。', emoji:'🏜️' },
      BPLR: { code:'BPLR', name:'精衛 (The Persistent Bird)', creature:'精衛', description:'銜木填海之鳥，象徵持續與定力。以身體需求為主，規律攝取加工但低負擔的食物或簡便補給，讓節奏保持穩定。魄、煉、靈、曆如反覆銜石，輕量而持續。', insight:'以身體需求為先，規律吃低負擔加工食，節奏穩定而持續。', emoji:'🐦' },
      BPLV: { code:'BPLV', name:'影 (The Shadow Runner)', creature:'影', description:'依附光而行的影魅，形態流動不定。以身體需求為主，進食時間較隨性，偏向加工但低負擔的簡便食物。魄、煉、靈、幻使食緒輕快而不定，像掠過地面的影。', insight:'跟隨身體需求，隨性吃低負擔加工食，輕快但節奏不固定。', emoji:'👤' },
    };

    const CREATURE_IMG = {
      MNHR:'openspec/asset/png/7.png',  MNHV:'openspec/asset/png/8.png',
      MNLR:'openspec/asset/png/3.png',  MNLV:'openspec/asset/png/4.png',
      MPHR:'openspec/asset/png/2.png',  MPHV:'openspec/asset/png/1.png',
      MPLR:'openspec/asset/png/5.png',  MPLV:'openspec/asset/png/6.png',
      BNHR:'openspec/asset/png/11.png', BNHV:'openspec/asset/png/13.png',
      BNLR:'openspec/asset/png/16.png', BNLV:'openspec/asset/png/15.png',
      BPHR:'openspec/asset/png/12.png', BPHV:'openspec/asset/png/10.png',
      BPLR:'openspec/asset/png/14.png', BPLV:'openspec/asset/png/9.png',
    };
    const BEGIN_AVATAR_IMG = 'openspec/asset/png/begin1.png';
    const BELL_AUDIO_SRC = 'openspec/changes/bell.mp3';
    const BACKGROUND_MUSIC_SRC = 'openspec/changes/archive/2026-05-16-dark-theme-ui-unification/backgroundmusic.mp3';

    function HatchPortrait({ hatchState, style, className }) {
      const hatched = hatchState?.avatarType;
      const src = hatched ? CREATURE_IMG[hatched.code] : BEGIN_AVATAR_IMG;
      const alt = hatched ? hatched.creature : '靈獸待孵化';
      return (
        <img
          src={src}
          alt={alt}
          className={className}
          style={{ width:'100%', height:'100%', objectFit:'contain', display:'block', ...style }}
        />
      );
    }

    // hLevel 是舊版身體反應強度：0=極輕盈 1=舒適 2=略沉 3=沉重 4=強烈不適；新版 bodyTier 則維持左差右好。
    /** 上三下三，由左至右：意猶未盡 → 平衡 → 身體反應 */
    const BODY_FEELING_OPTIONS = [
      { label:'意猶未盡', emoji:'🥢', hint:'肚子還空空的', n:false, hLevel:0, group:'unsatisfied' },
      { label:'清爽有神', emoji:'🌿', hint:'精神好、沒負擔', n:true,  hLevel:0, group:'balance' },
      { label:'舒服飽足', emoji:'🥰', hint:'份量剛好很滿意', n:false, hLevel:1, group:'balance' },
      { label:'碳水倒流', emoji:'💤', hint:'眼皮沉重、想睡覺', n:false, hLevel:2, group:'react' },
      { label:'油膩發脹', emoji:'🥴', hint:'肚子太撐、油膩感', n:false, hLevel:3, group:'react' },
      { label:'腸胃作怪', emoji:'😣', hint:'胃痛發脹不舒服', n:false, hLevel:4, group:'react' },
    ];
    const BODY_FEELING_LEGACY = {
      '輕盈自在': '清爽有神', '活力充沛': '清爽有神', '清爽無負擔': '清爽有神',
      '暖心飽足': '舒服飽足', '舒服滿足': '舒服飽足',
      '尚未滿足': '意猶未盡',
      '吃飽想睡': '碳水倒流', '昏沉想睡': '碳水倒流', '昏沉腦鈍': '碳水倒流',
      '頭重腦慢': '油膩發脹', '頭昏腦脹': '油膩發脹',
      '腸胃不適': '腸胃作怪', '腸胃不舒服': '腸胃作怪',
    };
    const normalizeBodyFeeling = (label) => {
      if (!label) return null;
      if (BODY_FEELING_OPTIONS.some((o) => o.label === label)) return label;
      return BODY_FEELING_LEGACY[label] || null;
    };
    /** 拉桿 0～100 五等分 → tier 1～5（UI 自由拖曳，分析用五大類） */
    const quintileTierFromPct = (pct) => {
      const p = Math.max(0, Math.min(100, Math.round(Number(pct) || 0)));
      if (p <= 20) return 1;
      if (p <= 40) return 2;
      if (p <= 60) return 3;
      if (p <= 80) return 4;
      return 5;
    };
    const tierCenterPct = (tier) => ({ 1: 10, 2: 30, 3: 50, 4: 70, 5: 90 })[tier] ?? 50;

    const MOOD_TIER_META = {
      1: { label: '很糟', score: 1 },
      2: { label: '不太好', score: 2 },
      3: { label: '普通', score: 3 },
      4: { label: '還不錯', score: 4 },
      5: { label: '很爽', score: 5 },
    };
    const BODY_TIER_META = {
      1: { label: '很不舒服', hlScore: 50 },
      2: { label: '偏不舒服', hlScore: 35 },
      3: { label: '普通', hlScore: 15 },
      4: { label: '偏舒服', hlScore: -10 },
      5: { label: '很舒服', hlScore: -40 },
    };

    const moodPctToTier = (pct) => quintileTierFromPct(pct);
    const moodPctToMeta = (pct) => MOOD_TIER_META[moodPctToTier(pct)] || MOOD_TIER_META[3];
    const bodyPctToTier = (pct) => quintileTierFromPct(pct);
    const bodyPctToMeta = (pct) => BODY_TIER_META[bodyPctToTier(pct)] || BODY_TIER_META[3];
    const bodyComfortToLabel = (pct) => bodyPctToTier(pct);
    const parseBodyTier = (value) => {
      if (typeof value === 'number' && value >= 1 && value <= 5) return Math.round(value);
      const m = String(value || '').match(/(?:第\s*)?([1-5])(?:\s*\/\s*5|\s*類)?$/);
      return m ? Number(m[1]) : null;
    };
    const bodyFeelingToComfort = (value) => {
      const tier = parseBodyTier(value);
      if (tier) return tierCenterPct(tier);
      const n = normalizeBodyFeeling(value);
      const legacyTier = { '腸胃作怪': 1, '油膩發脹': 2, '碳水倒流': 3, '舒服飽足': 4, '意猶未盡': 4, '清爽有神': 5 };
      return legacyTier[n] ? tierCenterPct(legacyTier[n]) : null;
    };
    const bodyTierDisplay = (tier) => {
      const t = parseBodyTier(tier);
      return t ? `第 ${t}/5 類` : '';
    };
    const bodyTierLabel = (tier) => {
      const t = parseBodyTier(tier);
      return t ? BODY_TIER_META[t]?.label || '' : '';
    };
    const formatRecordBodyFeeling = (record) => bodyTierLabel(record?.bodyTier ?? record?.bodyFeeling) || record?.bodyFeeling || '';
    const MOTIVATION_OPTIONS = [
      { label:'情緒驅動', emoji:'💭', desc:'需要安慰、獎勵、排解情緒', mbei:'M' },
      { label:'身體需要', emoji:'💪', desc:'真的餓、補充體力、維持機能', mbei:'B' },
    ];
    const MOOD_SCORE_LABELS = {1:'很糟', 2:'不太好', 3:'普通', 4:'還不錯', 5:'很爽'};
    const legacyMoodToPct = (mood) => {
      if (typeof mood === 'number' && mood >= 1 && mood <= 5) return tierCenterPct(mood);
      const idx = Object.entries(MOOD_SCORE_LABELS).find(([, l]) => l === mood);
      return idx ? tierCenterPct(Number(idx[0])) : null;
    };
    const feelingsFromForm = (fd) => {
      const moodPct = typeof fd.moodSlider === 'number' ? fd.moodSlider : legacyMoodToPct(fd.mood);
      const bodyPct = typeof fd.bodyComfort === 'number' ? fd.bodyComfort : bodyFeelingToComfort(fd.bodyFeeling);
      const moodMeta = moodPct != null ? moodPctToMeta(moodPct) : null;
      const bodyMeta = bodyPct != null ? bodyPctToMeta(bodyPct) : null;
      return {
        moodSlider: moodPct,
        moodTier: moodMeta ? moodPctToTier(moodPct) : null,
        mood: moodMeta ? moodMeta.label : (typeof fd.mood === 'number' ? MOOD_SCORE_LABELS[fd.mood] : fd.mood),
        moodScore: moodMeta ? moodMeta.score : (typeof fd.mood === 'number' ? fd.mood : null),
        bodyComfort: bodyPct,
        bodyTier: bodyMeta ? bodyPctToTier(bodyPct) : null,
        bodyFeeling: bodyMeta ? bodyPctToTier(bodyPct) : parseBodyTier(fd.bodyFeeling),
        bodyLabel: bodyMeta ? bodyMeta.label : fd.bodyFeeling,
      };
    };
    const EARTHLY_BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const getEarthlyBranch = (timeStr) => {
      const h = parseInt((timeStr || '12:00').split(':')[0]);
      return h === 23 ? '子' : EARTHLY_BRANCHES[Math.floor((h + 1) / 2)];
    };
    const MBEI_AXES = [
      { key: 'MB', neg: 'B', pos: 'M', negLabel: '魄', posLabel: '魂' },
      { key: 'NP', neg: 'P', pos: 'N', negLabel: '煉', posLabel: '野' },
      { key: 'HL', neg: 'L', pos: 'H', negLabel: '靈', posLabel: '煞' },
      { key: 'RV', neg: 'R', pos: 'V', negLabel: '曆', posLabel: '幻' },
    ];
    const clampMbeiScore = (n) => Math.max(-50, Math.min(50, Math.round(Number(n) || 0)));
    const parseMoodToNumber = (mood) => {
      if (typeof mood === 'number') return mood;
      const map = { '很糟': 1, '不太好': 2, '普通': 3, '還不錯': 4, '很爽': 5 };
      return map[mood] ?? 3;
    };
    const calcMeritFromContext = (context) => {
      const t = (context || '').trim();
      if (!t) return 1;
      if (t.length >= 60) return 3;
      if (t.length >= 15) return 2;
      return 1;
    };
    const meritPointLabel = (n) => `+${n} 功德`;
    const mbeiCodeFromScores = (scores) => {
      if (!scores) return null;
      return MBEI_AXES.map(({ key, neg, pos }) => (clampMbeiScore(scores[key]) >= 0 ? pos : neg)).join('');
    };
    const scoresFromMbeiCode = (code) => {
      const c = String(code || 'MPLR').padEnd(4, 'M').slice(0, 4);
      const def = 28;
      const out = {};
      MBEI_AXES.forEach(({ key, neg, pos }, i) => {
        out[key] = c[i] === pos ? def : c[i] === neg ? -def : 0;
      });
      return out;
    };
    const normalizeMbeiScores = (raw) => {
      const out = {};
      MBEI_AXES.forEach(({ key }) => { out[key] = clampMbeiScore(raw?.[key]); });
      return out;
    };
    const EMOTION_CONTEXT_RE = /壓力|加班|失戀|孤單|犒賞|解饞|難過|想哭|焦慮|煩躁|空虛|寂寞|報復|紓壓|紓解|療癒|安慰|情緒|崩潰|委屈|煩|累|倦|爆吃|暴食|心情|煩悶|煩心/;
    const HL_BASE_SCORE = {
      '清爽有神': -40, '意猶未盡': -20, '舒服飽足': 0, '碳水倒流': 25, '油膩發脹': 45, '腸胃作怪': 50,
      '輕盈自在': -40, '活力充沛': -40, '清爽無負擔': -40, '暖心飽足': 0, '舒服滿足': 0,
      '尚未滿足': -20, '吃飽想睡': 25, '昏沉想睡': 25, '昏沉腦鈍': 25, '頭重腦慢': 45, '頭昏腦脹': 45, '腸胃不適': 50, '腸胃不舒服': 50,
    };
    const parseMealMinutes = (mealTime) => {
      const p = String(mealTime || '12:00').split(':');
      const h = parseInt(p[0], 10);
      const m = parseInt(p[1] || '0', 10);
      return (Number.isNaN(h) ? 12 : h) * 60 + (Number.isNaN(m) ? 0 : m);
    };
    const inMealTimeRange = (t, sh, sm, eh, em) => {
      const start = sh * 60 + sm;
      let end = eh * 60 + em;
      if (end <= start) return t >= start || t < end;
      return t >= start && t < end;
    };
    const hasEmotionalContext = (ctx) => {
      const t = (ctx || '').trim();
      return t.length > 0 && EMOTION_CONTEXT_RE.test(t);

          if (width > IMAGE_MAX_EDGE || height > IMAGE_MAX_EDGE) {
            if (width >= height) { height = Math.round(height * IMAGE_MAX_EDGE / width); width = IMAGE_MAX_EDGE; }
            else { width = Math.round(width * IMAGE_MAX_EDGE / height); height = IMAGE_MAX_EDGE; }

          const canvas = document.createElement('canvas');
          canvas.width = width;

          const base64 = dataUrl.split(',')[1];

    /** 紀錄表單用連續拉桿（心情 / 身體舒服度） */
    function RecordFeelingSlider({ value, onChange, min, max, step = 1, leftLabel, rightLabel, hint, activeLabel, accent = 'jade' }) {
      const serif = "'Noto Serif TC',serif";
      const ready = value != null && value !== '';
      const num = ready ? Number(value) : (min + max) / 2;
      const pct = ((num - min) / (max - min)) * 100;
      const trackColor = accent === 'amber' ? 'var(--amber)' : 'var(--jade)';
      const trackGlow = accent === 'amber' ? 'rgba(217,138,91,0.35)' : 'rgba(149,211,195,0.35)';
      return (
        <div className="record-feeling-slider" style={{ padding:'4px 2px 0' }}>
          {hint && (
            <p style={{ fontSize:12, color:'var(--mist)', margin:'0 0 12px', fontFamily:serif, lineHeight:1.6 }}>{hint}</p>
          )}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10, gap:12 }}>
            <span style={{ fontSize:13, fontWeight:800, color: ready && pct < 45 ? trackColor : 'var(--mist)', fontFamily:serif, transition:'color 0.2s' }}>{leftLabel}</span>
            <span style={{ fontSize:13, fontWeight:800, color: ready && pct > 55 ? trackColor : 'var(--mist)', fontFamily:serif, transition:'color 0.2s' }}>{rightLabel}</span>
          </div>

            <div style={{
              position:'absolute', left:0, top:0, bottom:0, width:`${pct}%`, borderRadius:4,
              background: ready ? `linear-gradient(90deg, ${trackGlow}, ${trackColor})` : 'rgba(149,211,195,0.15)',
              transition:'width 0.25s ease, background 0.25s ease',
            }} />
            <input
              type="range"
              min={min}
              max={max}
              step={step}
              value={num}
              onChange={(e) => onChange(parseFloat(e.target.value))}
              className="record-feeling-range"
              style={{ position:'absolute', inset:0, width:'100%', margin:0, height:8, opacity:0, cursor:'pointer' }}
              aria-valuenow={num}
            />
            <div style={{
              position:'absolute', top:'50%', left:`${pct}%`, width:18, height:18, borderRadius:'50%',
              transform:'translate(-50%,-50%)', pointerEvents:'none',
              background: ready ? trackColor : 'rgba(149,211,195,0.45)',
              boxShadow: ready ? `0 0 12px ${trackGlow}` : 'none',
              transition:'left 0.25s ease, background 0.25s ease',
            }} />

          {activeLabel && (
            <p style={{ textAlign:'center', fontSize:13, color: ready ? 'var(--ink)' : 'var(--mist)', fontFamily:serif, fontWeight:700, margin:0, minHeight:20 }}>
              {ready ? activeLabel : '\u00A0'}

          )}
        </div>
      );

    const MBEI_AXIS_TITLES = { MB: '能量來源', NP: '食源性', HL: '身體負荷', RV: '規律節奏' };
    const MBEI_LETTER_CN = {
      M: { char: '魂', hint: '以情入食', eng: 'Mood' },
      B: { char: '魄', hint: '以身入食', eng: 'Body' },
      N: { char: '野', hint: '原野自然', eng: 'Natural' },
      P: { char: '煉', hint: '精緻煉化', eng: 'Processed' },
      L: { char: '靈', hint: '輕盈通透', eng: 'Light' },
      H: { char: '煞', hint: '厚實飽足', eng: 'Heavy' },
      R: { char: '曆', hint: '守時規律', eng: 'Rhythm' },
      V: { char: '幻', hint: '隨心流動', eng: 'Volatile' },
    };
    const parseMbeiCodeProfile = (code) => {
      const c = String(code || 'MPLR').padEnd(4, 'M').slice(0, 4);
      return MBEI_AXES.map((axis, i) => {
        const letter = c[i];
        const cn = MBEI_LETTER_CN[letter] || { char: letter, hint: '' };
        return {
          axisKey: axis.key,
          axisTitle: MBEI_AXIS_TITLES[axis.key] || axis.key,
          letter,
          char: cn.char,
          hint: cn.hint,
        };
      });
    };
    /** 例：MNHR → 魂野煞曆 */
    const mbeiCodeToChinese = (code) => parseMbeiCodeProfile(code).map((p) => p.char).join('');

    function CreatureMbeiProfile({ code, compact, variant }) {

              color:'rgba(149,211,195,0.45)', letterSpacing:'0.2em',
              padding:'4px 0', marginLeft:2,

          </div>
        );

      if (compact) {
        return (
          <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>

              <span key={p.axisKey} style={{ fontFamily:serif, fontWeight:900, fontSize:20, color:'var(--jade)', letterSpacing:'0.08em', lineHeight:1 }} title={`${p.axisTitle} · ${p.hint}`}>
                {p.char}
              </span>
            ))}
            <span title={code} style={{ fontSize:11, color:'rgba(149,211,195,0.45)', fontFamily:serif, fontWeight:700, letterSpacing:'0.2em' }}>{mbeiCodeToChinese(code)}</span>

            {profile.map((p) => (
              <div key={p.axisKey} style={{ textAlign:'center', padding:'8px 4px', borderRadius:6, background:'rgba(149,211,195,0.06)', border:'1px solid rgba(149,211,195,0.1)' }}>

                <p style={{ fontSize:26, fontWeight:900, color:'var(--jade)', margin:'0 0 2px', fontFamily:serif, lineHeight:1.1 }}>{p.char}</p>
                <p style={{ fontSize:10, color:'var(--sand)', margin:0, fontFamily:serif, opacity:0.85 }}>{p.hint}</p>
              </div>

          <p title={code} style={{ fontSize:11, color:'rgba(149,211,195,0.4)', fontFamily:serif, fontWeight:700, letterSpacing:'0.22em', textAlign:'center', margin:'8px 0 0' }}>{mbeiCodeToChinese(code)}</p>

    function MealTimeField({ value, onChange }) {
      const parts = String(value || '12:00').split(':');
      const hh = (parts[0] || '12').padStart(2, '0').slice(0, 2);
      const mm = (parts[1] || '00').padStart(2, '0').slice(0, 2);
      const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
      const minutes = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
      const selectCls = 'w-full min-w-0 rounded-[1.5rem] border-2 border-stroke bg-white px-3 py-3 md:px-4 md:py-4 text-base md:text-lg font-semibold text-ink focus:outline-none focus:border-ink/30';
      const setHour = (h) => onChange(`${h}:${mm}`);
      const setMinute = (m) => onChange(`${hh}:${m}`);
      return (
        <div className="meal-time-row">
          <select value={hh} onChange={e => setHour(e.target.value)} className={selectCls} aria-label="小時">
            {hours.map(h => <option key={h} value={h}>{h} 時</option>)}
          </select>
          <span className="meal-time-sep" aria-hidden="true">:</span>
          <select value={mm} onChange={e => setMinute(e.target.value)} className={selectCls} aria-label="分鐘">
            {minutes.map(m => <option key={m} value={m}>{m} 分</option>)}
          </select>
        </div>
      );
    }

    /** 全螢幕凝煉儀式覆蓋層：送出後等待 AI 回應期間顯示 */
    function ChargingVeil({ active, label = '凝煉食緒', subLabel = '靈氣注入孵化池' }) {
      const [mounted, setMounted] = React.useState(active);
      const [exiting, setExiting] = React.useState(false);
      React.useEffect(() => {
        if (active) {
          setMounted(true);
          setExiting(false);
          return undefined;
        }
        if (!mounted) return undefined;
        setExiting(true);
        const t = setTimeout(() => {
          setMounted(false);
          setExiting(false);
        }, 700);
        return () => clearTimeout(t);
      }, [active, mounted]);
      if (!mounted) return null;
      const particles = Array.from({ length: 16 });
      return (
        <div className={`charge-veil${exiting ? ' exiting' : ''}`} role="status" aria-live="polite" aria-label={label}>
          <span className="charge-veil-corner tl" aria-hidden="true" />

    const posterXmlEscape = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

    const wrapPosterText = (text, maxChars = 15, maxLines = 3) => {
      const src = String(text || '').replace(/[「」]/g, '').trim();
      if (!src) return [];
      const out = [];
      for (let i = 0; i < src.length && out.length < maxLines; i += maxChars) {
        let line = src.slice(i, i + maxChars);
        if (i + maxChars < src.length && out.length === maxLines - 1) line = `${line.slice(0, Math.max(1, maxChars - 1))}…`;
        out.push(line);
      }
      return out;
    };

    const assetToDataUrl = async (src) => {
      const url = new URL(src, window.location.href).href;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('角色圖載入失敗');
      const blob = await res.blob();
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    };

    const canvasToCompressedJpeg = async (canvas, maxBytes = 950 * 1024) => {
      const qualities = [0.86, 0.8, 0.74, 0.68, 0.6];
      let lastBlob = null;
      for (const q of qualities) {
        const blob = await new Promise((resolve, reject) => canvas.toBlob((b) => b ? resolve(b) : reject(new Error('圖片輸出失敗')), 'image/jpeg', q));
        lastBlob = blob;
        if (blob.size <= maxBytes) return blob;
      }
      return lastBlob;
    };

    const shareOrDownloadPosterBlob = async (blob, filename) => {
      const file = new File([blob], filename, { type:'image/jpeg' });
      if (navigator.share && navigator.canShare?.({ files:[file] })) {
        try {
          await navigator.share({
            title:'食緒曆靈獸顯形',
            text:'我在食緒曆孵化出自己的食緒靈獸',
            files:[file],
          });
          return;
        } catch (err) {
          if (err?.name === 'AbortError') return;
        }
      }
      downloadBlob(blob, filename);
    };

    const downloadBlob = (blob, filename) => {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    };

    const renderPosterSvgToJpeg = async (svg) => {
      const svgBlob = new Blob([svg], { type:'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      try {
        const img = await new Promise((resolve, reject) => {
          const node = new Image();
          node.onload = () => resolve(node);
          node.onerror = () => reject(new Error('分享卡產生失敗'));
          node.src = svgUrl;
        });
        const canvas = document.createElement('canvas');
        canvas.width = 720;
        canvas.height = 1280;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#100900';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return await canvasToCompressedJpeg(canvas);
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    };

    function AlmanacView({ records }) {
      const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const today = new Date();
      const todayStr = toStr(today);
      const [expanded, setExpanded] = useState(false);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [weekOffset, setWeekOffset] = useState(0);
      const [expandedRecordId, setExpandedRecordId] = useState(null);
      const [viewMonth, setViewMonth] = useState(new Date(today.getFullYear(), today.getMonth(), 1));

      // date → records[] map
      const byDate = useMemo(() => {
        const m = {};
        records.forEach(r => { if (!m[r.date]) m[r.date] = []; m[r.date].push(r); });
        return m;
      }, [records]);

      // week days (Sun–Sat) offset from this week
      const weekDays = useMemo(() => {
        const base = new Date(today);
        base.setDate(today.getDate() - today.getDay() + weekOffset * 7);
        return Array.from({length:7}, (_,i) => { const d = new Date(base); d.setDate(base.getDate()+i); return d; });
      }, [weekOffset]);

      // month grid
      const monthData = useMemo(() => {
        const y = viewMonth.getFullYear(), mo = viewMonth.getMonth();
        return { y, mo, firstDay: new Date(y,mo,1).getDay(), total: new Date(y,mo+1,0).getDate() };
      }, [viewMonth]);

      const fmtDate = s => { const [y,m,d] = s.split('-'); return `${parseInt(m)}月${parseInt(d)}日`; };
      const dayNames = ['日','一','二','三','四','五','六'];
      const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

      const DayCell = ({ date, large }) => {
        const ds = toStr(date);
        const recs = byDate[ds] || [];
        const isToday = ds === todayStr;
        const isSel = ds === selectedDate;
        const dots = recs.slice(0,3).map(r => r.mbeiCode?.[1]==='N' ? 'bg-forest' : 'bg-clay');
        return (
          <button onClick={() => setSelectedDate(ds)}
            className={cn('relative flex flex-col items-center justify-center rounded-2xl transition-all',
              large ? 'py-5' : 'aspect-square',
              isSel ? 'bg-ink shadow-lg' : isToday ? 'ring-2 ring-inset ring-clay/40 hover:bg-parchment' : 'hover:bg-parchment')}>
            <span className={cn('font-black leading-none', large ? 'text-3xl' : 'text-sm', isSel ? 'text-white' : 'text-ink')}>
              {date.getDate()}
            </span>
            <div className={cn('flex gap-0.5 mt-1', large ? 'h-2' : 'h-1.5')}>
              {dots.map((c,i) => <div key={i} className={cn('rounded-full',c, large ? 'w-2 h-2' : 'w-1.5 h-1.5')} />)}
            </div>
          </button>
        );
      };

      const selectedRecords = byDate[selectedDate] || [];
      const isToday = selectedDate === todayStr;

      return (
        <div className="space-y-8 fade-in">
          <header className="flex justify-between items-center">
            <div className="space-y-1">
              <h2 className="text-4xl font-serif font-black text-jade tracking-tighter">食緒曆卡</h2>
            </div>
          </header>

          {/* ── Calendar card ── */}
          <div className="bg-white rounded-[5px] shadow-card border border-stroke overflow-hidden">
            {/* top bar */}
            <div className="flex items-center justify-between px-5 py-3 border-b border-parchment">
              <div className="flex items-center gap-1">
                {expanded ? (
                  <>
                    <button onClick={() => setViewMonth(new Date(monthData.y, monthData.mo-1, 1))}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronLeftIcon size={14} />
                    </button>
                    <span className="font-black text-ink font-serif text-sm px-1">
                      {monthData.y}年 {monthNames[monthData.mo]}
                    </span>
                    <button onClick={() => setViewMonth(new Date(monthData.y, monthData.mo+1, 1))}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronRightIcon size={14} />
                    </button>
                  </>
                ) : (
                  <>
                    <button onClick={() => setWeekOffset(w => w-1)}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronLeftIcon size={14} />
                    </button>
                    <span className="font-black text-ink font-serif text-sm px-1">
                      {today.getFullYear()}年 {monthNames[today.getMonth()]}
                    </span>
                    <button onClick={() => setWeekOffset(w => w+1)}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronRightIcon size={14} />
                    </button>
                  </>
                )}
              </div>
              <button onClick={() => setExpanded(e => !e)}
                className="text-[10px] font-black text-muted bg-parchment border border-stroke/60 px-3 py-1 rounded-full hover:border-ink/20 transition-colors tracking-widest">
                {expanded ? '收起' : '展開月曆'}

            </div>

            {/* day name headers */}
            <div className="grid grid-cols-7 border-b border-parchment/60">
              {dayNames.map(d => <div key={d} className="text-[10px] text-muted font-black py-2 text-center tracking-widest">{d}</div>)}

            {!expanded ? (
              /* ── Week view (enlarged) ── */

                {Array.from({length: monthData.firstDay}).map((_,i) => <div key={`e${i}`} />)}

          {/* ── Selected day records ── */}
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-black flex items-center gap-2 uppercase tracking-[0.2em] text-muted">
                <CalendarIcon size={16} className="text-amber" />
