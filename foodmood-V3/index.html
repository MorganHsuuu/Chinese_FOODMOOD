  <style>
    :root {

    @keyframes fadeOut { from{opacity:1} to{opacity:0} }

    @keyframes merit-shimmer { 0%,100%{text-shadow:0 0 6px rgba(255,215,0,0.5)} 50%{text-shadow:0 0 16px rgba(255,215,0,0.9),0 0 32px rgba(255,215,0,0.4)} }

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ── AI 經 Vercel API（OPENAI_API_KEY 設在 Vercel 環境變數，勿寫在前端）──

    // ── Constants ──
    const MBEI_TYPES = {
      MNHR: { code:'MNHR', name:'玄武 (The Guardian)', creature:'玄武', description:'北方守護神，龜蛇一體，象徵沉穩與長壽。作息規律如鐵，偏好紮實厚重的原型肉食燉品，以飲食秩序建立內在安定感。氣場沉穩磐石，是最懂用三餐錨定生命節奏的存在。', insight:'規律吃紮實原型肉食，以飲食秩序錨定內在穩定。', emoji:'🐢' },
      MNHV: { code:'MNHV', name:'麒麟 (The Sacred Beast)', creature:'麒麟', description:'仁義瑞獸，不履生蟲，不折生草，自帶療癒之光。飲食完全由情緒主導，心情好或疲憊時會隨性大啖豐盛原型珍饈。一餐的生理負擔雖重，卻能帶來極大的靈魂修復。', insight:'情緒驅動，隨性享用豐盛原型大餐，大吃一頓就是最好的療癒。', emoji:'🦒' },
      MNLR: { code:'MNLR', name:'白澤 (The Wise Seer)', creature:'白澤', description:'崑崙山上的全知聖獸，渾身雪白，通達萬物，能辟除一切邪氣。全圖鑑最健康平衡的存在。準時在胃經最旺之時攝取純淨原型食物，身輕心清，是最懂現代生活避險的均衡大師。', insight:'準時吃清淡原型食物，神魂清澈，圖鑑中最健康的均衡大師。', emoji:'🦄' },
      MNLV: { code:'MNLV', name:'九尾 (The Spirit Fox)', creature:'九尾', description:'青丘之山的幻化之狐，九尾象徵無盡靈動與魅惑。靠心情決定三餐，不拘時間，隨性攝取自然花果與輕盈原型食物。身輕如雲，飲食節奏與性格一樣飄忽難測，極具靈性。', insight:'靠心情決定三餐，隨性吃自然輕食，飄忽靈動難以捉摸。', emoji:'🦊' },
      MPHR: { code:'MPHR', name:'金烏 (The Sun-Bird)', creature:'金烏', description:'三足神鳥，司掌太陽之精，每日規律從東方升起。為維持高強度的情緒與工作能量，有極度規律的飲食習慣，卻依賴精緻加工甜食與高能量食品作為「火精補給」，日積月累，體內陽煞過旺。', insight:'規律依賴精緻加工食品補充能量，循天時但陽煞積聚。', emoji:'🦅' },
      MPHV: { code:'MPHV', name:'饕餮 (The Devourer)', creature:'饕餮', description:'傳說中羊身人面的貪食凶獸，能吞噬萬物。極度焦慮或情緒空虛時，發起補償性暴食，在無規律的時間吞噬大量高負擔加工食品，以填補心靈黑洞。濁煞極重，出沒無常。', insight:'焦慮空虛時暴食加工重食，以無盡吞噬填補心靈黑洞。', emoji:'👺' },
      MPLR: { code:'MPLR', name:'織女 (The Weaver)', creature:'織女', description:'天帝之女，在銀河邊日夜編織雲彩霓裳，工法細膩且極度規律。對飲食有美學堅持，定時定量，偏好精緻但低負擔的輕盈加工膳食（分子料理、精緻沙拉、無糖燕麥）。透過飲食的秩序感維持情緒的細膩穩定。', insight:'定時吃精緻輕盈加工食，以飲食的秩序感維持情緒穩定。', emoji:'🧵' },
      MPLV: { code:'MPLV', name:'夢貘 (The Dream Eater)', creature:'夢貘', description:'深夜出沒、以人類夢境為食的幻獸，能將惡夢吃盡。沒有固定進食時鐘，常在深夜因情緒波動攝取代餐、微糖手搖或功能性果凍，游離於飽腹感與精神幻覺之間，以咀嚼安撫情緒。', insight:'深夜情緒波動下的代餐族，在虛實之間咀嚼孤獨。', emoji:'🐘' },
      BNHR: { code:'BNHR', name:'當康 (The Harvest Boar)', creature:'當康', description:'其鳴自叫，見則天下大豐收，象徵大地的豐饒與力量。極度重視正餐規律，習慣攝取大量紮實的原型在地糧食、根莖類與大塊肉類。攝取量大，常有沉重的飽足感，但肉體機能強健充沛。', insight:'規律大量吃原型紮實食物，強健如豐收，常有飽重的大地能量。', emoji:'🐗' },
      BNHV: { code:'BNHV', name:'朱厭 (The War Omen)', creature:'朱厭', description:'猿身紅足，見則大兵，象徵爆發性的力量與衝突。追求純粹的肌肉爆發力，進食時間完全隨性，常在運動前後大量攝取原型蛋白質（烤肉、原型牛排）。力量強大，但體內火煞過旺，常處發炎臨界。', insight:'隨性暴攝原型蛋白質，爆發力強大但火煞旺盛、易發炎。', emoji:'🐒' },
      BNLR: { code:'BNLR', name:'夔 (The Thunder Beast)', creature:'夔', description:'東海獨足神牛，出入必伴風雨雷鳴，氣息強大。純粹的自然功能主義者，為了維持肉體機能，嚴格堅守原野清淡之食，作息如雷打不動，順應天時。身體素質極高，但飲食生活毫無社交樂趣。', insight:'規律吃清淡原型食，身強氣壯，但孤傲冷冽，無社交飲食。', emoji:'🐃' },
      BNLV: { code:'BNLV', name:'夫諸 (The Water Deer)', creature:'夫諸', description:'白鹿四角，帶來水靈清滌、化解燥熱的溫柔神獸。完全聽從身體直覺，不被生理時鐘框架。口渴就喝清泉，餓了就隨性攝取原野草木瓜果。體質清透如洗，性情隨遇而安，生理循環極佳。', insight:'完全聽從直覺吃清淡原型食，體質清透、隨遇而安。', emoji:'🦌' },
      BPHR: { code:'BPHR', name:'混沌 (The Primal Chaos)', creature:'混沌', description:'其狀如黃囊無面目，象徵天地未開時的混沌沉重。三餐雖然定時，但極度偏好沉重的高碳水精緻澱粉與加工肉品。雖進食有時，但肉身缺乏流動性，如沒有孔竅的混沌，難以有效代謝清化。', insight:'定時吃重澱粉加工食，肉身混濁、缺乏孔竅，難以有效代謝。', emoji:'🌀' },
      BPHV: { code:'BPHV', name:'魃 (The Drought Bringer)', creature:'魃', description:'黃帝之女，所居之處天大旱，寸草不生。將食物視為單純燃料，因忙碌或隨性，高頻攝取超商微波食品、高鈉乾糧與炸物。體內水分逐漸枯竭，濁氣淤塞，生理代謝嚴重紊亂。', insight:'以食物為燃料，高頻吃加工焦炸食，體內枯竭、代謝紊亂。', emoji:'🏜️' },
      BPLR: { code:'BPLR', name:'精衛 (The Persistent Bird)', creature:'精衛', description:'日夜銜西山木石以湮東海的堅毅之鳥，意志不達目的不罷休。典型的嚴格健身減脂族，為了達成特定生理目標，以非人意志力規律攝取極低負擔的人工煉化補給（雞胸肉、乳清蛋白）。堅毅，但飲食生活極度枯燥。', insight:'規律吃低負擔人工補給，意志堅毅如銜石填海，但生活極度枯燥。', emoji:'🐦' },
      BPLV: { code:'BPLV', name:'影 (The Shadow Runner)', creature:'影', description:'依附光而生、隨風而動的無形之魅，沒有固定形態。飲食只是「為了活著而應付」，沒有固定用餐時間，常隨手抓超商麵包或代餐棒應付。雖無重油重鹹負擔，但缺乏真食物滋養，生理存在感極其薄弱。', insight:'隨手抓加工輕食應付過活，「為活著而吃」的邊緣存在。', emoji:'👤' },
    };

    const CREATURE_IMG = {
      MNHR:'openspec/asset/png/7.png',  MNHV:'openspec/asset/png/8.png',
      MNLR:'openspec/asset/png/3.png',  MNLV:'openspec/asset/png/4.png',
      MPHR:'openspec/asset/png/2.png',  MPHV:'openspec/asset/png/1.png',
      MPLR:'openspec/asset/png/5.png',  MPLV:'openspec/asset/png/6.png',
      BNHR:'openspec/asset/png/11.png', BNHV:'openspec/asset/png/13.png',
      BNLR:'openspec/asset/png/12.png', BNLV:'openspec/asset/png/15.png',
      BPHR:'openspec/asset/png/16.png', BPHV:'openspec/asset/png/10.png',
      BPLR:'openspec/asset/png/14.png', BPLV:'openspec/asset/png/9.png',
    };

    // hLevel: 0=極輕盈 1=舒適 2=略沉 3=沉重 4=強烈不適
    const BODY_FEELING_OPTIONS = [
      { label:'輕盈自在', emoji:'🌿', n:true,  hLevel:0 },
      { label:'活力充沛', emoji:'⚡', n:true,  hLevel:0 },
      { label:'暖心飽足', emoji:'🥰', n:false, hLevel:1 },
      { label:'昏沉想睡', emoji:'💤', n:false, hLevel:2 },
      { label:'頭昏腦脹', emoji:'🌀', n:false, hLevel:3 },
      { label:'腸胃不適', emoji:'😣', n:false, hLevel:4 },
    ];
    const BODY_FEELING_DESC = ['身體極輕盈，能量充沛', '身體舒適，無明顯負擔', '身體略沉，有些倦意', '明顯沉重，腦袋混沌', '強烈不適，消化困難'];
    const MOTIVATION_OPTIONS = [
      { label:'情緒驅動', emoji:'💭', desc:'需要安慰、獎勵、排解情緒', mbei:'M' },
      { label:'身體需要', emoji:'💪', desc:'真的餓、補充體力、維持機能', mbei:'B' },
    ];
    const MOOD_SCORE_LABELS = {1:'很糟', 2:'不太好', 3:'普通', 4:'還不錯', 5:'很爽'};
    const EARTHLY_BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const getEarthlyBranch = (timeStr) => {
      const h = parseInt((timeStr || '12:00').split(':')[0]);
      return h === 23 ? '子' : EARTHLY_BRANCHES[Math.floor((h + 1) / 2)];
    };
    const MBEI_AXES = [
      { key: 'MB', neg: 'B', pos: 'M', negLabel: '魄', posLabel: '魂' },
      { key: 'NP', neg: 'P', pos: 'N', negLabel: '煉', posLabel: '野' },
      { key: 'HL', neg: 'L', pos: 'H', negLabel: '靈', posLabel: '煞' },
      { key: 'RV', neg: 'R', pos: 'V', negLabel: '曆', posLabel: '幻' },

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > IMAGE_MAX_EDGE || height > IMAGE_MAX_EDGE) {
            if (width >= height) { height = Math.round(height * IMAGE_MAX_EDGE / width); width = IMAGE_MAX_EDGE; }
            else { width = Math.round(width * IMAGE_MAX_EDGE / height); height = IMAGE_MAX_EDGE; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', IMAGE_JPEG_QUALITY);
          const base64 = dataUrl.split(',')[1];
          const sizeKB = Math.round((base64.length * 3) / 4 / 1024);
          resolve({ base64, mimeType: 'image/jpeg', previewUrl: dataUrl, sizeKB });
        };
        img.onerror = () => reject(new Error('無法讀取圖片'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('無法讀取檔案'));
      reader.readAsDataURL(file);

            onTouchStart={e => { shichenTouchX.current = e.touches[0].clientX; }}
            onTouchEnd={e => {
              const dx = e.changedTouches[0].clientX - shichenTouchX.current;
              if (Math.abs(dx) > 40) setShichenIdx((shichenIdx + (dx < 0 ? 1 : -1) + 12) % 12);
            }}>
            {/* 標題列 */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'white', letterSpacing:'0.1em' }}>
                  {shichen.branch}時{shichen.keyword}
                </span>
                <span style={{ fontSize:9, fontWeight:900, color:'var(--clay)', border:'1px solid rgba(192,74,59,0.6)', borderRadius:2, padding:'2px 7px', letterSpacing:'0.15em' }}>養生</span>
              </div>
              <div style={{ display:'flex', gap:4 }}>
                <button onClick={() => setShichenIdx((shichenIdx - 1 + 12) % 12)}
                  style={{ width:36, height:36, borderRadius:'50%', background:'rgba(149,211,195,0.15)', border:'1.5px solid rgba(149,211,195,0.4)', color:'var(--jade)', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s ease', fontWeight:700 }}>‹</button>
                <button onClick={() => setShichenIdx((shichenIdx + 1) % 12)}
                  style={{ width:36, height:36, borderRadius:'50%', background:'rgba(149,211,195,0.15)', border:'1.5px solid rgba(149,211,195,0.4)', color:'var(--jade)', fontSize:18, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s ease', fontWeight:700 }}>›</button>
              </div>
            </div>
            {/* 切換時顯示動畫內容 */}
            <div key={shichenIdx} className="shichen-content">
              {/* 時間 */}
              <p style={{ fontSize:13, color:'var(--amber)', letterSpacing:'0.15em', marginBottom:12, fontFamily:"'JetBrains Mono',monospace" }}>{shichen.time}</p>
              {/* 建議文字 */}
              <p style={{ fontSize:16, color:'var(--sand)', lineHeight:2, margin:0 }}>
                {shichen.meridian}當令，{shichen.advice}
              </p>
            </div>
            {/* 12地支索引 */}
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:20, gap:2 }}>
              {['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'].map((branch, i) => (
                <div key={i} onClick={() => setShichenIdx(i)}
                  style={{ flex:1, textAlign:'center', cursor:'pointer', fontSize: i === shichenIdx ? 11 : 10,
                    fontWeight: i === shichenIdx ? 900 : 400,
                    color: i === shichenIdx ? 'var(--amber)' : 'rgba(200,184,138,0.3)',
                    letterSpacing:0, transition:'all 0.2s ease',
                    paddingBottom:4, borderBottom: i === shichenIdx ? '1.5px solid var(--amber)' : '1px solid rgba(200,184,138,0.12)' }}>
                  {branch}
                </div>
              ))}
            </div>
          </section>

          {/* 型格卡（已解鎖時顯示） */}
          {isUnlocked && (
            <section style={card}>
              <div style={{ display:'flex', gap:20, alignItems:'center' }}>
                <div style={{ width:72, height:90, borderRadius:5, overflow:'hidden', border:'1px solid rgba(149,211,195,0.2)', flexShrink:0 }}>
                  <img src={CREATURE_IMG[latestType.code]} alt={latestType.creature} style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }} />
                </div>
                <div style={{ flex:1 }}>
                  <p style={{ fontSize:13, color:'var(--mist)', letterSpacing:'0.15em', marginBottom:6, fontWeight:500 }}>已照見 · 型格</p>
                  <div style={{ display:'inline-block', background:'rgba(149,211,195,0.08)', border:'1px solid rgba(149,211,195,0.15)', borderRadius:10, padding:'2px 10px', fontSize:13, color:'var(--sand)', marginBottom:8, fontWeight:500 }}>{latestType.creature}</div>
                  <h3 style={{ fontSize:20, fontFamily:"'Noto Serif TC', serif", fontWeight:900, color:'var(--jade)', letterSpacing:'0.05em', margin:'0 0 10px' }}>{latestType.code}｜{latestType.name}</h3>
                  <p style={{ fontSize:15, color:'var(--sand)', lineHeight:1.8, borderLeft:'3px solid rgba(217,138,91,0.5)', paddingLeft:12 }}>「{latestType.insight}」</p>
                </div>
              </div>
            </section>
          )}

          {/* 下排：今日時間軸 + 詩簽收藏 */}
          {(() => {
            const _t = new Date(); const todayStr = `${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,'0')}-${String(_t.getDate()).padStart(2,'0')}`;
            const todayRecords = records.filter(r => r.date === todayStr);
            const fortuneRecords = records.filter(r => r.fortune).slice(0, 3);
            const moodColor = { '平靜':'var(--jade)', '有精神':'var(--mist)', '焦慮':'var(--blush)', '煩躁':'var(--blush)', '空虛':'var(--sand)', '被安撫':'var(--amber)' };
            return (
              <div style={{ display:'grid', gridTemplateColumns:'1fr', gap:16 }}>
                {/* 今日時間軸 */}
                <section style={card}>
                  <p style={{ fontSize:13, color:'var(--mist)', letterSpacing:'0.2em', marginBottom:20, fontWeight:500 }}>今日食緒軌跡</p>
                  {todayRecords.length === 0 ? (
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'20px 0', textAlign:'center' }}>
                      <span style={{ fontSize:28 }}>🍽</span>
                      <p style={{ fontSize:15, color:'var(--sand)', margin:0 }}>今日尚無記錄</p>
                      <p style={{ fontSize:13, color:'var(--mist)', margin:0 }}>記下第一餐，開始覺察</p>
                    </div>
                  ) : (
                    <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
                      {todayRecords.map((r, i) => (
                        <div key={r.id} style={{ display:'flex', gap:14, alignItems:'stretch' }}>
                          {/* 時間軸線 */}
                          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0, width:48 }}>
                            <span style={{ fontSize:11, color:'var(--mist)', fontFamily:"'JetBrains Mono', monospace", lineHeight:1, paddingTop:12 }}>{r.time}</span>
                            <span style={{ fontSize:10, color:'var(--jade)', fontFamily:"'Noto Serif TC',serif", lineHeight:1, marginTop:2, opacity:0.7 }}>{getEarthlyBranch(r.time)}</span>
                            {i < todayRecords.length - 1 && <div style={{ flex:1, width:1, background:'rgba(149,211,195,0.12)', margin:'6px 0' }} />}
                          </div>
                          {/* 卡片 */}
                          <div onClick={() => setExpandedRecordId(expandedRecordId === r.id ? null : r.id)}
                            style={{ flex:1, background:'rgba(149,211,195,0.04)', border:'1px solid rgba(149,211,195,0.1)', borderRadius:5, padding:'12px 14px', marginBottom: i < todayRecords.length - 1 ? 8 : 0, cursor:'pointer' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                              <span style={{ fontSize:15, color:'var(--cream)', fontWeight:900, fontFamily:"'Noto Serif TC',serif" }}>{getRecordFood(r)}</span>
                              <span style={{ fontSize:13, color:'var(--mist)', fontWeight:600 }}>· {r.mealType}</span>
                            </div>
                            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                              <span style={{ fontSize:12, color: moodColor[r.mood] || 'var(--sand)', background:'rgba(149,211,195,0.07)', border:'1px solid rgba(149,211,195,0.12)', borderRadius:20, padding:'2px 10px' }}>{r.mood}</span>
                              <span style={{ fontSize:12, color:'var(--sand)', background:'rgba(200,184,138,0.08)', border:'1px solid rgba(200,184,138,0.15)', borderRadius:20, padding:'2px 10px' }}>{r.bodyFeeling}</span>
                              {r.context && <span style={{ fontSize:12, color:'var(--mist)', background:'rgba(168,197,191,0.06)', border:'1px solid rgba(168,197,191,0.1)', borderRadius:20, padding:'2px 10px' }}>{r.context}</span>}
                            </div>
                            {expandedRecordId === r.id && <MBEIBars mbeiCode={r.mbeiCode} mbeiScores={r.mbeiScores || r.fortune?.mbei_scores} />}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* 詩簽收藏 */}
                <section style={card}>
                  <p style={{ fontSize:13, color:'var(--mist)', letterSpacing:'0.2em', marginBottom:20, fontWeight:500 }}>詩簽收藏</p>
                  {fortuneRecords.length === 0 ? (
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'20px 0', textAlign:'center' }}>
                      <span style={{ fontSize:28 }}>🧧</span>
                      <p style={{ fontSize:15, color:'var(--sand)', margin:0 }}>尚無詩簽</p>
                      <p style={{ fontSize:13, color:'var(--mist)', margin:0 }}>記錄後由 AI 為你解出食緒籤文</p>
                    </div>
                  ) : (
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      {fortuneRecords.map(r => (
                        <div key={r.id} style={{ display:'flex', gap:12, alignItems:'flex-start', background:'rgba(133,41,27,0.1)', border:'1px solid rgba(255,180,160,0.1)', borderRadius:5, padding:'12px 16px' }}>
                          <div style={{ width:3, alignSelf:'stretch', background:'rgba(192,74,59,0.5)', borderRadius:2, flexShrink:0 }} />
                          <div style={{ flex:1, minWidth:0 }}>
                            <p style={{ fontSize:13, color:'var(--blush)', fontWeight:700, margin:'0 0 4px', letterSpacing:'0.1em' }}>{r.fortune.main_title}</p>
                            <p style={{ fontSize:14, color:'var(--cream)', lineHeight:1.8, margin:'0 0 6px' }}>{(r.fortune.poem || '').split('\n')[0]}</p>
                            <p style={{ fontSize:11, color:'var(--mist)', margin:0 }}>{r.date} · {r.mealType} · {getRecordFood(r)}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>
              </div>
            );
          })()}

          {/* 靈光凝練中（未解鎖時置底） */}
          {!isUnlocked && (
            <section style={{ ...card, padding:'36px 24px 40px' }}>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center', gap:18 }}>
                <div style={{ width:80, height:80, borderRadius:'50%', border:'1px solid rgba(149,211,195,0.25)', display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(149,211,195,0.04)' }}>
                  <span style={{ fontSize:19, fontFamily:"'Noto Serif TC', serif", fontWeight:900, color:'var(--jade)' }}>{records.length}<span style={{ opacity:0.3 }}>/</span>10</span>
                </div>
                <div>
                  <h3 style={{ fontSize:18, fontFamily:"'Noto Serif TC', serif", fontWeight:900, color:'var(--jade)', letterSpacing:'0.1em', marginBottom:10 }}>靈光凝練中</h3>
                  <p style={{ fontSize:14, color:'var(--sand)', lineHeight:2, opacity:0.8 }}>尚需 {10 - records.length} 次食緒紀錄<br />即可照見你的食緒型格</p>
                </div>
              </div>
            </section>
          )}
        </div>
      );
    }

    function AlmanacView({ records }) {
      const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const today = new Date();
      const todayStr = toStr(today);
      const [expanded, setExpanded] = useState(false);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      const [weekOffset, setWeekOffset] = useState(0);
      const [expandedRecordId, setExpandedRecordId] = useState(null);
      const [viewMonth, setViewMonth] = useState(new Date(today.getFullYear(), today.getMonth(), 1));

      // date → records[] map
      const byDate = useMemo(() => {
        const m = {};
        records.forEach(r => { if (!m[r.date]) m[r.date] = []; m[r.date].push(r); });
        return m;
      }, [records]);

      // week days (Sun–Sat) offset from this week
      const weekDays = useMemo(() => {
        const base = new Date(today);
        base.setDate(today.getDate() - today.getDay() + weekOffset * 7);
        return Array.from({length:7}, (_,i) => { const d = new Date(base); d.setDate(base.getDate()+i); return d; });
      }, [weekOffset]);

      // month grid
      const monthData = useMemo(() => {
        const y = viewMonth.getFullYear(), mo = viewMonth.getMonth();
        return { y, mo, firstDay: new Date(y,mo,1).getDay(), total: new Date(y,mo+1,0).getDate() };
      }, [viewMonth]);

      const fmtDate = s => { const [y,m,d] = s.split('-'); return `${parseInt(m)}月${parseInt(d)}日`; };
      const dayNames = ['日','一','二','三','四','五','六'];
      const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

      const DayCell = ({ date, large }) => {
        const ds = toStr(date);
        const recs = byDate[ds] || [];
        const isToday = ds === todayStr;
        const isSel = ds === selectedDate;
        const dots = recs.slice(0,3).map(r => r.mbeiCode?.[1]==='N' ? 'bg-forest' : 'bg-clay');
        return (
          <button onClick={() => setSelectedDate(ds)}
            className={cn('relative flex flex-col items-center justify-center rounded-2xl transition-all',
              large ? 'py-5' : 'aspect-square',
              isSel ? 'bg-ink shadow-lg' : isToday ? 'ring-2 ring-inset ring-clay/40 hover:bg-parchment' : 'hover:bg-parchment')}>
            <span className={cn('font-black leading-none', large ? 'text-3xl' : 'text-sm', isSel ? 'text-white' : 'text-ink')}>
              {date.getDate()}
            </span>
            <div className={cn('flex gap-0.5 mt-1', large ? 'h-2' : 'h-1.5')}>
              {dots.map((c,i) => <div key={i} className={cn('rounded-full',c, large ? 'w-2 h-2' : 'w-1.5 h-1.5')} />)}
            </div>
          </button>
        );
      };

      const selectedRecords = byDate[selectedDate] || [];
      const isToday = selectedDate === todayStr;

      return (
        <div className="space-y-8 fade-in">
          <header className="flex justify-between items-center">
            <div className="space-y-1">
              <h2 className="text-4xl font-serif font-black text-jade tracking-tighter">食緒曆卡</h2>
            </div>
          </header>

          {/* ── Calendar card ── */}
          <div className="bg-white rounded-[5px] shadow-card border border-stroke overflow-hidden">
            {/* top bar */}
            <div className="flex items-center justify-between px-5 py-3 border-b border-parchment">
              <div className="flex items-center gap-1">
                {expanded ? (
                  <>
                    <button onClick={() => setViewMonth(new Date(monthData.y, monthData.mo-1, 1))}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronLeftIcon size={14} />
                    </button>
                    <span className="font-black text-ink font-serif text-sm px-1">
                      {monthData.y}年 {monthNames[monthData.mo]}
                    </span>
                    <button onClick={() => setViewMonth(new Date(monthData.y, monthData.mo+1, 1))}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronRightIcon size={14} />
                    </button>
                  </>
                ) : (
                  <>
                    <button onClick={() => setWeekOffset(w => w-1)}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronLeftIcon size={14} />
                    </button>
                    <span className="font-black text-ink font-serif text-sm px-1">
                      {today.getFullYear()}年 {monthNames[today.getMonth()]}
                    </span>
                    <button onClick={() => setWeekOffset(w => w+1)}
                      className="w-7 h-7 rounded-full hover:bg-parchment flex items-center justify-center text-muted transition-colors">
                      <ChevronRightIcon size={14} />
                    </button>
                  </>
                )}
              </div>
              <button onClick={() => setExpanded(e => !e)}
                className="text-[10px] font-black text-muted bg-parchment border border-stroke/60 px-3 py-1 rounded-full hover:border-ink/20 transition-colors tracking-widest">
                {expanded ? '收起' : '展開月曆'}
              </button>
            </div>

            {/* day name headers */}
            <div className="grid grid-cols-7 border-b border-parchment/60">
              {dayNames.map(d => <div key={d} className="text-[10px] text-muted font-black py-2 text-center tracking-widest">{d}</div>)}
            </div>

            {!expanded ? (
              /* ── Week view (enlarged) ── */
              <div className="grid grid-cols-7 px-3 py-4 gap-2">
                {weekDays.map(d => <DayCell key={toStr(d)} date={d} large={true} />)}
              </div>
            ) : (
              /* ── Month view ── */
              <div className="grid grid-cols-7 p-2 gap-1">
                {Array.from({length: monthData.firstDay}).map((_,i) => <div key={`e${i}`} />)}
                {Array.from({length: monthData.total}).map((_,i) => {
                  const d = new Date(monthData.y, monthData.mo, i+1);
                  return <DayCell key={i} date={d} large={false} />;
                })}
              </div>
            )}
          </div>

          {/* ── Selected day records ── */}
          <div className="space-y-4">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-black flex items-center gap-2 uppercase tracking-[0.2em] text-muted">
                <CalendarIcon size={16} className="text-amber" />
                {isToday ? '今日細節' : '選取細節'} · {fmtDate(selectedDate)}
              </h3>
              {!isToday && (
                <button onClick={() => setSelectedDate(todayStr)}
                  className="text-[10px] font-bold text-muted bg-stroke/60 px-2 py-0.5 rounded-full hover:bg-stroke transition-colors">
                  回今日
                </button>
              )}
            </div>
            {selectedRecords.length > 0 ? selectedRecords.map(r => (
              <div key={r.id} onClick={() => setExpandedRecordId(expandedRecordId === r.id ? null : r.id)}
                className="bg-white rounded-[5px] p-6 shadow-sm border border-stroke flex flex-col gap-4" style={{ cursor:'pointer' }}>
                <div className="space-y-1">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="font-black text-ink" style={{ fontFamily:"'Noto Serif TC',serif", fontSize:18, letterSpacing:'0.05em', marginBottom:2 }}>{getRecordFood(r)}</p>
                      <p className="font-bold text-sm text-muted">{r.mealType} · {r.time} <span style={{fontSize:11,color:'var(--jade)',fontFamily:"'Noto Serif TC',serif",fontWeight:400,opacity:0.8}}>{getEarthlyBranch(r.time)}時</span></p>
                    </div>
                    {getRecordMerit(r) > 0 && (
                      <span style={{ fontSize:11, fontWeight:900, color:'var(--amber)', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.05em' }}>
                        +{getRecordMerit(r)} 功德
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 text-xs font-bold text-muted">
                    <span className="text-forest">心情：{r.mood}</span>
                    <span className="text-stroke font-normal">|</span>
                    <span>{r.bodyFeeling}</span>
                  </div>
                  {r.fortune?.main_title && (
                    <p className="text-xs text-muted/70 font-serif pt-0.5">「{r.fortune.main_title}」</p>
                  )}
                </div>
                {(r.fortune?.do || r.fortune?.next_meal) && (
                  <div className="flex flex-col gap-1 pt-2 border-t border-parchment">
                    {r.fortune.do && <p className="text-[11px] text-forest/80 font-serif">{r.fortune.do}</p>}
                    {r.fortune.next_meal && <p className="text-[11px] text-amber font-serif">{r.fortune.next_meal}</p>}
                  </div>
                )}
                {expandedRecordId === r.id && <MBEIBars mbeiCode={r.mbeiCode} mbeiScores={r.mbeiScores || r.fortune?.mbei_scores} />}
              </div>
            )) : (
              <div className="bg-white rounded-[5px] p-10 text-center border-2 border-dashed border-stroke text-muted text-sm font-bold">
                {isToday ? '今日尚無食緒紀錄。' : '這天沒有紀錄。'}
              </div>
            )}
          </div>
        </div>
      );
    }

    function SpectrumTuner() {
      const DIMS = [
        { num:'01', title:'能量來源',
          left:  { code:'M', label:'魂', name:'以情入食，滋養神魂', desc:'你吃飯是為了「爽」，尋求情緒的補償。' },
          right: { code:'B', label:'魄', name:'以身入食，修煉肉體', desc:'你吃飯是為了「活」，補充生存機能。' } },
        { num:'02', title:'食源性',
          left:  { code:'N', label:'野', name:'吸收大地的原野食物', desc:'你吃的是「土裡長」的新鮮無添加物。' },
          right: { code:'P', label:'煉', name:'攝取人工的煉化之物', desc:'你吃的是「工廠出」的重組與精緻加工品。' } },
        { num:'03', title:'身體負荷',
          left:  { code:'L', label:'靈', name:'氣血通暢，輕盈羽化', desc:'飲食清爽好代謝，身體毫無殘留感。' },
          right: { code:'H', label:'煞', name:'痰濕淤塞，沉重濁氣', desc:'油膩重鹹帶來極端刺激，身體產生負擔感。' } },
        { num:'04', title:'規律節奏',
          left:  { code:'R', label:'曆', name:'順應十二時辰，循天時', desc:'你是準時吃飯的乖寶寶，定時定量。' },
          right: { code:'V', label:'幻', name:'暴飲暴食，飄忽無常', desc:'你是看心情、看壓力才進食的邊緣人。' } },
      ];
      const [hover, setHover] = React.useState(Array(4).fill(null));
      const set = (i, v) => setHover(h => h.map((x,j) => j===i ? v : x));

      return (
        <div style={{ background:'#1a150a', border:'1px solid rgba(149,211,195,0.12)', borderRadius:5, padding:'24px 20px', display:'flex', flexDirection:'column', gap:0 }}>
          <div style={{ marginBottom:24 }}>
            <p style={{ fontSize:9, color:'var(--jade)', fontFamily:"'JetBrains Mono',monospace", fontWeight:700, letterSpacing:'0.25em', margin:'0 0 6px', opacity:0.7 }}>MBEI SYSTEM · 四大維度</p>
            <h4 style={{ fontSize:16, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--cream)', margin:0, letterSpacing:'0.1em' }}>能量調頻儀</h4>
            <p style={{ fontSize:12, color:'var(--mist)', margin:'4px 0 0', opacity:0.6 }}>滑動光譜，解讀你的食緒靈魂維度</p>
          </div>
          {DIMS.map((dim, i) => {
            const side = hover[i];
            const active = side ? (side === 'left' ? dim.left : dim.right) : null;
            const jade = 'rgba(149,211,195,';
            const amber = 'rgba(200,184,138,';
            return (
              <div key={i} style={{ paddingBottom: i < 3 ? 20 : 0, marginBottom: i < 3 ? 20 : 0, borderBottom: i < 3 ? '1px solid rgba(149,211,195,0.06)' : 'none' }}>
                {/* 維度標題 */}
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                  <span style={{ fontSize:9, fontFamily:"'JetBrains Mono',monospace", color:'rgba(149,211,195,0.3)', letterSpacing:'0.15em' }}>{dim.num} /</span>
                  <span style={{ fontSize:12, fontFamily:"'Noto Serif TC',serif", fontWeight:700, color:'var(--sand)', letterSpacing:'0.15em' }}>{dim.title}</span>
                </div>
                {/* 光譜軌道 — 整列都是 hit area */}
                <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:12,
                  padding:'16px 0', margin:'-16px 0 12px', cursor:'pointer' }}
                  onMouseMove={e => { const r=e.currentTarget.getBoundingClientRect(); const pct=(e.clientX-r.left)/r.width; set(i, pct<0.15?'left':pct>0.85?'right':pct<0.5?'left':'right'); }}
                  onMouseLeave={() => set(i,null)}
                  onTouchStart={e => { const r=e.currentTarget.getBoundingClientRect(); set(i,(e.touches[0].clientX-r.left)/r.width<0.5?'left':'right'); }}
                  onTouchEnd={() => set(i,null)}>
                  {/* 左極端 */}
                  <div style={{ width:36, textAlign:'right', flexShrink:0, userSelect:'none' }}>
                    <span style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900, display:'block', lineHeight:1,
                      color: side==='left' ? 'var(--jade)' : jade+'0.25)', transition:'color 0.4s cubic-bezier(0.4,0,0.2,1)' }}>{dim.left.code}</span>
                    <span style={{ fontSize:10, display:'block', letterSpacing:'0.1em', marginTop:2,
                      color: side==='left' ? 'var(--jade)' : jade+'0.2)', transition:'color 0.4s cubic-bezier(0.4,0,0.2,1)' }}>{dim.left.label}</span>
                  </div>
                  {/* 軌道（視覺） */}
                  <div style={{ flex:1, position:'relative', height:6, borderRadius:3, background:'rgba(255,255,255,0.04)', backdropFilter:'blur(4px)', pointerEvents:'none' }}>
                    {/* 漸層光芒 */}
                    <div style={{ position:'absolute', inset:0, borderRadius:3, transition:'all 0.4s cubic-bezier(0.4,0,0.2,1)',
                      background: side==='left'  ? 'linear-gradient(90deg,rgba(149,211,195,0.65) 0%,rgba(149,211,195,0.08) 55%,transparent 100%)' :
                                  side==='right' ? 'linear-gradient(90deg,transparent 0%,rgba(200,184,138,0.08) 45%,rgba(200,184,138,0.65) 100%)' :
                                  'transparent' }} />
                    {/* 游標 */}
                    <div style={{ position:'absolute', top:'50%', transform:'translate(-50%,-50%)',
                      left: side==='left' ? '6%' : side==='right' ? '94%' : '50%',
                      width:14, height:14, borderRadius:'50%', transition:'all 0.4s cubic-bezier(0.4,0,0.2,1)',
                      background: side==='left' ? 'var(--jade)' : side==='right' ? 'var(--amber)' : 'rgba(149,211,195,0.3)',
                      boxShadow: side==='left'  ? '0 0 14px rgba(149,211,195,0.8), 0 0 4px rgba(149,211,195,1)' :
                                  side==='right' ? '0 0 14px rgba(200,184,138,0.8), 0 0 4px rgba(200,184,138,1)' : 'none' }} />
                  </div>
                  {/* 右極端 */}
                  <div style={{ width:36, textAlign:'left', flexShrink:0, userSelect:'none' }}>
                    <span style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900, display:'block', lineHeight:1,
                      color: side==='right' ? 'var(--amber)' : amber+'0.25)', transition:'color 0.4s cubic-bezier(0.4,0,0.2,1)' }}>{dim.right.code}</span>
                    <span style={{ fontSize:10, display:'block', letterSpacing:'0.1em', marginTop:2,
                      color: side==='right' ? 'var(--amber)' : amber+'0.2)', transition:'color 0.4s cubic-bezier(0.4,0,0.2,1)' }}>{dim.right.label}</span>
                  </div>
                </div>
                {/* 動態解說 */}
                <div style={{ minHeight:56 }}>
                  {active && (
                    <div key={side+i} className="shichen-content" style={{ padding:'10px 14px',
                      background: side==='left' ? 'rgba(149,211,195,0.05)' : 'rgba(200,184,138,0.05)',
                      border: `1px solid ${side==='left' ? 'rgba(149,211,195,0.15)' : 'rgba(200,184,138,0.15)'}`,
                      borderRadius:5, backdropFilter:'blur(8px)' }}>
                      <p style={{ fontSize:14, fontFamily:"'Noto Serif TC',serif", fontWeight:700, color:'var(--cream)', margin:'0 0 4px', letterSpacing:'0.04em' }}>{active.name}</p>
                      <p style={{ fontSize:12, color:'var(--mist)', margin:0, opacity:0.75, lineHeight:1.6 }}>{active.desc}</p>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function InsightView({ records = [] }) {
      const [tab, setTab] = useState('personal');
      const [showEncyclopedia, setShowEncyclopedia] = useState(false);
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [creatureNavEnabled, setCreatureNavEnabled] = useState(true);
      const touchStartX = React.useRef(null);
      const encCreatures = Object.values(MBEI_TYPES);
      const encIdx = selectedCreature ? encCreatures.findIndex(c => c.code === selectedCreature.code) : 0;
      const goCreature = dir => setSelectedCreature(encCreatures[(encIdx + dir + encCreatures.length) % encCreatures.length]);

      const hatch = useMemo(() => {
        if (!records.length) return { stage: 0, count: 0, unlockedCodes: new Set(), weekCode: null };
        const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
        const daysSinceFirst = Math.floor((new Date() - new Date(sorted[0].date)) / 86400000);
        const count = records.length;
        const freq = {};
        records.forEach(r => { freq[r.mbeiCode] = (freq[r.mbeiCode]||0)+1; });
        const topCode = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'MPLR';
        const dominantType = MBEI_TYPES[topCode] || MBEI_TYPES['MPLR'];
        const mCount = records.filter(r=>r.mbeiCode[0]==='M').length;
        const firstLetter = mCount > count/2 ? 'M' : 'B';
        const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
        const weekRecords = records.filter(r=>new Date(r.date)>=weekAgo);
        const stage = daysSinceFirst >= 7 ? 3 : count >= 5 ? 2 : 1;
        // 解鎖紀錄
        const unlockedCodes = new Set(records.map(r => r.mbeiCode));
        // 本週主型格
        const weekFreq = {};
        weekRecords.forEach(r => { weekFreq[r.mbeiCode] = (weekFreq[r.mbeiCode]||0)+1; });
        const weekCode = weekRecords.length > 0 ? (Object.entries(weekFreq).sort((a,b)=>b[1]-a[1])[0]?.[0] || null) : null;
        return { stage, dominantType, daysSinceFirst, count, firstLetter, weekRecords, unlockedCodes, weekCode };
      }, [records]);

      const latest = records[0];
      const stageClue = !latest ? '' : (()=>{
        const c = latest.mbeiCode;
        return (c[0]==='M' ? '魂動（情緒主導）' : '魄健（生理理性）') + '・' + (c[2]==='H' ? '煞氣（身體負荷重）' : '靈氣（身體輕盈）');
      })();

      const hatchProgress = useMemo(() => {
        const count = hatch.count || 0;
        const days = hatch.daysSinceFirst || 0;
        const recordPct = Math.min(count / 5, 1) * 50;
        const dayPct = hatch.stage >= 2 ? Math.min(days / 7, 1) * 50 : 0;
        const overall = hatch.stage === 0 ? 0 : hatch.stage >= 3 ? 100 : recordPct + dayPct;
        const phaseIdx = hatch.stage <= 1 ? 0 : hatch.stage === 2 ? 1 : 2;
        const nextMilestone = hatch.stage === 0
          ? '記下第一餐，啟動孵化'
          : hatch.stage === 1
            ? `破殼進度 ${count}/5 筆 · 再 ${Math.max(0, 5 - count)} 筆進入破殼期`
            : hatch.stage === 2
              ? `完全體進度 ${Math.min(days, 7)}/7 天 · 再 ${Math.max(0, 7 - days)} 天顯形`
              : '靈獸已完全降世';
        return { overall, recordPct, dayPct, count, days, phaseIdx, nextMilestone };
      }, [hatch]);

      const card = { background:'#252016', border:'1px solid #3a3020', borderRadius:5, boxShadow:'0 8px 30px rgba(135,123,115,0.08)' };
      const serif = "'Noto Serif TC',serif";

      return (
        <div className="space-y-10 fade-in"
          onTouchStart={e => { touchStartX.current = e.touches[0].clientX; }}
          onTouchEnd={e => { if (!selectedCreature||!creatureNavEnabled) return; const dx=touchStartX.current-e.changedTouches[0].clientX; if(Math.abs(dx)>50) goCreature(dx>0?1:-1); }}>
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div className="space-y-1">
              <h2 className="text-4xl font-serif font-black text-jade tracking-tighter">食緒靈獸</h2>
            </div>
            <div className="flex bg-parchment p-1.5 rounded-2xl border border-stroke/50 shadow-inner w-full md:w-auto">
              {[['personal','靈獸孵化'],['group','靈獸圖鑑']].map(([t,label]) => (
                <button key={t} onClick={() => setTab(t)} className={cn("flex-1 md:w-32 px-4 py-2.5 rounded-xl text-xs font-black transition-all uppercase tracking-widest", tab===t ? "bg-white text-ink shadow-md" : "text-muted hover:text-ink")}>{label}</button>
              ))}
            </div>
          </header>

          {tab === 'personal' ? (
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

              {/* ── 靈獸孵化卡 ── */}
              <div style={{ ...card, overflow:'hidden' }}>
                {/* 孵化進度長條 */}
                <div style={{ padding:'20px 24px 8px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
                    <span style={{ fontSize:11, color:'var(--jade)', letterSpacing:'0.2em', fontWeight:700, fontFamily:serif }}>孵化進度</span>
                    <span style={{ fontSize:22, fontWeight:900, color:'var(--cream)', fontFamily:serif, lineHeight:1 }}>
                      {Math.round(hatchProgress.overall)}<span style={{ fontSize:12, color:'var(--mist)', fontWeight:600 }}>%</span>
                    </span>
                  </div>
                  <div style={{ position:'relative', height:12, borderRadius:6, background:'rgba(149,211,195,0.08)', overflow:'hidden', border:'1px solid rgba(149,211,195,0.12)' }}>
                    <div style={{
                      height:'100%', width:`${hatchProgress.overall}%`, borderRadius:6, transition:'width 0.65s cubic-bezier(0.22,1,0.36,1)',
                      background: hatchProgress.overall >= 100
                        ? 'linear-gradient(90deg, #5a9e8a 0%, #95d3c3 50%, #d4a843 100%)'
                        : 'linear-gradient(90deg, rgba(74,130,110,0.9) 0%, rgba(149,211,195,0.95) 100%)',
                      boxShadow: hatchProgress.overall > 0 ? '0 0 14px rgba(149,211,195,0.35)' : 'none',
                    }} />
                    {[50, 100].map(pct => (
                      <div key={pct} style={{ position:'absolute', left:`${pct}%`, top:0, bottom:0, width:1, background:'rgba(0,0,0,0.25)', transform:'translateX(-50%)', pointerEvents:'none' }} />
                    ))}
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', marginTop:12, gap:4 }}>
                    {['混沌期','破殼期','完全體'].map((s, i) => {
                      const active = hatchProgress.phaseIdx === i;
                      const done = hatchProgress.phaseIdx > i;
                      return (
                        <div key={s} style={{ flex:1, textAlign: i === 0 ? 'left' : i === 2 ? 'right' : 'center' }}>
                          <span style={{
                            fontSize:11, fontFamily:serif, letterSpacing:'0.08em', display:'block',
                            color: active ? 'var(--jade)' : done ? 'rgba(149,211,195,0.55)' : 'rgba(149,211,195,0.2)',
                            fontWeight: active ? 800 : 500,
                          }}>{s}</span>
                          {active && <span style={{ fontSize:9, color:'var(--amber)', fontFamily:serif }}>進行中</span>}
                          {done && <span style={{ fontSize:9, color:'rgba(149,211,195,0.4)', fontFamily:serif }}>已達成</span>}
                        </div>
                      );
                    })}
                  </div>
                  <p style={{ fontSize:12, color:'var(--sand)', fontFamily:serif, textAlign:'center', margin:'14px 0 0', lineHeight:1.6 }}>{hatchProgress.nextMilestone}</p>
                  <div style={{ textAlign:'right', marginTop:10 }}>
                    <span style={{ fontSize:11, color:'var(--mist)', fontFamily:serif }}>累計 {hatch.count} 筆紀錄</span>
                  </div>
                </div>

                {/* 階段 0：尚無紀錄 */}
                {hatch.stage === 0 && (
                  <div style={{ padding:'48px 24px', textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
                    <span style={{ fontSize:64 }}>🥚</span>
                    <h3 style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--jade)', margin:0 }}>靈獸尚未降世</h3>
                    <p style={{ fontSize:15, color:'var(--sand)', lineHeight:1.8, margin:0 }}>記下第一餐，你的山海靈獸將從這裡開始孵化</p>
                  </div>
                )}

                {/* 階段 1：混沌期 */}
                {hatch.stage === 1 && (
                  <div style={{ padding:'32px 24px', display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
                    <div style={{ position:'relative', display:'inline-block' }}>
                      <span className="float-glow" style={{ fontSize:72, lineHeight:1.2, display:'block' }}>🥚</span>
                      <div style={{ position:'absolute', inset:-20, background:'radial-gradient(circle, rgba(149,211,195,0.07) 0%, transparent 70%)', borderRadius:'50%', pointerEvents:'none' }} />
                    </div>
                    <div style={{ textAlign:'center', maxWidth:280 }}>
                      <p style={{ fontSize:11, color:'var(--jade)', letterSpacing:'0.2em', fontWeight:700, fontFamily:"'Noto Serif TC',serif", margin:'0 0 10px' }}>混沌期 · 靈氣凝聚中</p>
                      <p style={{ fontSize:15, color:'var(--cream)', lineHeight:1.9, fontFamily:"'Noto Serif TC',serif", margin:'0 0 18px' }}>
                        牠在迷霧中漸漸成形，<br />已感知到你的{stageClue}
                      </p>
                      <div style={{ width:'100%', maxWidth:260 }}>
                        <div style={{ height:8, borderRadius:4, background:'rgba(149,211,195,0.1)', overflow:'hidden', marginBottom:8 }}>
                          <div style={{ height:'100%', width:`${Math.min(hatch.count/5,1)*100}%`, background:'linear-gradient(90deg, var(--jade), #b8e8dc)', borderRadius:4, transition:'width 0.5s', boxShadow:'0 0 10px rgba(149,211,195,0.3)' }} />
                        </div>
                        <p style={{ fontSize:13, color:'var(--jade)', margin:0, fontFamily:serif, fontWeight:700 }}>{hatch.count}/5 筆 · 距離破殼</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* 階段 2：破殼期 */}
                {hatch.stage === 2 && hatch.dominantType && (
                  <div style={{ padding:'32px 24px', display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
                    <div style={{ position:'relative', width:120, height:150, flexShrink:0 }}>
                      <img src={CREATURE_IMG[hatch.dominantType.code]} alt="?"
                        style={{ width:'100%', height:'100%', objectFit:'contain', filter:'blur(16px) brightness(0.45)', display:'block' }} />
                      <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        <span style={{ fontSize:36, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--jade)', textShadow:'0 0 16px rgba(149,211,195,0.6)' }}>?</span>
                      </div>
                    </div>
                    <div style={{ textAlign:'center', maxWidth:300 }}>
                      <p style={{ fontSize:11, color:'var(--amber)', letterSpacing:'0.2em', fontWeight:700, fontFamily:"'Noto Serif TC',serif", margin:'0 0 12px' }}>破殼期 · 型態漸顯</p>
                      <div style={{ padding:'14px 20px', background:'rgba(149,211,195,0.05)', border:'1px solid rgba(149,211,195,0.12)', borderRadius:5, marginBottom:12 }}>
                        <p style={{ fontSize:12, color:'var(--mist)', letterSpacing:'0.1em', margin:'0 0 6px', fontFamily:"'Noto Serif TC',serif" }}>第一維度已顯影</p>
                        <p style={{ fontSize:22, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--jade)', margin:'0 0 8px' }}>
                          {hatch.firstLetter === 'M' ? 'M・魂系' : 'B・魄系'}
                          <span style={{ color:'rgba(149,211,195,0.2)', fontSize:16 }}> ??</span>
                        </p>
                        <p style={{ fontSize:13, color:'var(--sand)', lineHeight:1.7, fontFamily:"'Noto Serif TC',serif", margin:0 }}>
                          {hatch.firstLetter === 'M' ? '你以情入食——飲食常受心緒牽引' : '你以身入食——理性管理飲食節奏'}
                        </p>
                      </div>
                      <p style={{ fontSize:12, color:'var(--mist)', fontFamily:"'Noto Serif TC',serif" }}>再 {Math.max(0, 7-hatch.daysSinceFirst)} 天解鎖完全體</p>
                    </div>
                  </div>
                )}

                {/* 階段 3：完全體 */}
                {hatch.stage >= 3 && hatch.dominantType && (
                  <div style={{ padding:'28px 24px' }}>
                    <div style={{ display:'flex', gap:20, alignItems:'flex-start', marginBottom:16 }}>
                      <div style={{ flexShrink:0 }}>
                        <div style={{ width:100, height:125, borderRadius:5, overflow:'hidden', border:'2px solid rgba(149,211,195,0.2)', boxShadow:'0 8px 32px rgba(0,0,0,0.4)' }}>
                          <img src={CREATURE_IMG[hatch.dominantType.code]} alt={hatch.dominantType.creature} style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }} />
                        </div>
                        <div style={{ textAlign:'center', marginTop:6 }}>
                          <span style={{ fontSize:10, color:'var(--jade)', fontFamily:"'JetBrains Mono',monospace", fontWeight:700, background:'rgba(149,211,195,0.1)', padding:'2px 8px', borderRadius:4 }}>{hatch.dominantType.code}</span>
                        </div>
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <p style={{ fontSize:11, color:'var(--jade)', letterSpacing:'0.2em', fontWeight:700, fontFamily:"'Noto Serif TC',serif", margin:'0 0 8px' }}>完全體 · 靈獸降世</p>
                        <h3 style={{ fontSize:22, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--cream)', margin:'0 0 8px' }}>{hatch.dominantType.name}</h3>
                        <span style={{ fontSize:12, color:'var(--sand)', background:'rgba(200,184,138,0.08)', border:'1px solid rgba(200,184,138,0.15)', borderRadius:20, padding:'3px 12px', fontFamily:"'Noto Serif TC',serif" }}>{hatch.dominantType.creature}</span>
                        <p style={{ fontSize:14, color:'var(--sand)', lineHeight:1.8, marginTop:12, borderLeft:'3px solid rgba(217,138,91,0.5)', paddingLeft:12, fontFamily:"'Noto Serif TC',serif" }}>「{hatch.dominantType.insight}」</p>
                      </div>
                    </div>
                    <div style={{ padding:'14px 16px', background:'rgba(149,211,195,0.04)', border:'1px solid rgba(149,211,195,0.08)', borderRadius:5 }}>
                      {hatch.weekRecords.length > 0 ? (
                        <>
                          <p style={{ fontSize:11, color:'var(--jade)', letterSpacing:'0.15em', margin:'0 0 8px', fontFamily:"'Noto Serif TC',serif", fontWeight:700 }}>本週食緒摘要</p>
                          <p style={{ fontSize:14, color:'var(--sand)', lineHeight:1.9, fontFamily:"'Noto Serif TC',serif", margin:0 }}>
                            本週 {hatch.weekRecords.length} 次紀錄，主要型格為 {hatch.dominantType.code}。
                            {hatch.weekRecords.filter(r=>r.mbeiCode[0]==='M').length > hatch.weekRecords.length/2
                              ? ' 情緒主導你的飲食選擇，留意心情與食欲的連動。'
                              : ' 飲食相對理性規律，繼續保持。'}
                          </p>
                        </>
                      ) : (
                        <p style={{ fontSize:13, color:'var(--mist)', fontFamily:"'Noto Serif TC',serif", margin:0 }}>近 7 天尚無紀錄，持續記錄才能看見本週食緒。</p>
                      )}
                    </div>
                  </div>
                )}
              </div>

              {/* 能量調頻儀 */}
              <SpectrumTuner />

            </div>
          ) : (
            /* ── 靈獸圖鑑 tab ── */
            <div style={{ ...card, padding:'20px' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
                <h4 style={{ fontSize:14, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--jade)', letterSpacing:'0.15em', margin:0 }}>十六型山海經圖鑑</h4>
                <span style={{ fontSize:10, color:'var(--mist)', letterSpacing:'0.1em' }}>點擊已解鎖型格查看詳情</span>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:8 }}>
                {Object.values(MBEI_TYPES).map(type => {
                  const isUnlocked = hatch.unlockedCodes?.has(type.code);
                  const isWeek = type.code === hatch.weekCode;
                  return (
                    <div key={type.code}
                      onClick={() => isUnlocked && (setSelectedCreature(type), setCreatureNavEnabled(true))}
                      style={{ background: isWeek ? 'rgba(149,211,195,0.07)' : 'rgba(21,13,0,0.6)',
                        border: isWeek ? '1px solid rgba(149,211,195,0.4)' : isUnlocked ? '1px solid rgba(149,211,195,0.15)' : '1px solid rgba(149,211,195,0.06)',
                        borderRadius:5, padding:'10px', display:'flex', gap:10, alignItems:'flex-start',
                        cursor: isUnlocked ? 'pointer' : 'default', position:'relative',
                        opacity: isUnlocked ? 1 : 0.35, transition:'border-color 0.2s, opacity 0.2s' }}>
                      {isWeek && (
                        <div style={{ position:'absolute', top:5, right:5, fontSize:8, fontWeight:900, color:'var(--jade)', background:'rgba(149,211,195,0.15)', border:'1px solid rgba(149,211,195,0.3)', borderRadius:3, padding:'1px 4px', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>本週</div>

    function ProfileView({ records, loginProfile, onLogout }) {
      const latestType = records[0] ? MBEI_TYPES[records[0].mbeiCode] : MBEI_TYPES['MPLR'];
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [creatureNavEnabled, setCreatureNavEnabled] = useState(true);
      const touchStartX = React.useRef(null);
      const encCreatures = Object.values(MBEI_TYPES);
      const encIdx = selectedCreature ? encCreatures.findIndex(c => c.code === selectedCreature.code) : 0;
      const goCreature = dir => setSelectedCreature(encCreatures[(encIdx + dir + encCreatures.length) % encCreatures.length]);
      const [rankTab, setRankTab] = useState('personal');

      const personalLeaderboard = useMemo(() => {
        const seed = LEADERBOARD_DATA.slice(0,5).map((u,i) => ({...u, points: Math.max(5, 28-i*5), scoreLabel:'累積功德'}));
        const userRow = { rank:0, name:loginProfile.nickname, points:calcMeritTotal(records), code:latestType.code, isUser:true, scoreLabel:'累積功德' };
        return [...seed, userRow].sort((a,b)=>b.points-a.points).map((u,idx)=>({...u,rank:idx+1}));
      }, [loginProfile.nickname, records, latestType.code]);

      const mbeiLeaderboard = useMemo(() => {
        return Object.values(MBEI_TYPES).map((type,idx)=>({
          name:`${type.creature}`, points:Math.max(15,96-idx*3), emoji:type.emoji, code:type.code, scoreLabel:'群體分'
        })).sort((a,b)=>b.points-a.points).map((u,idx)=>({...u,rank:idx+1}));
      }, []);

      const board = rankTab === 'personal' ? personalLeaderboard : mbeiLeaderboard;

      return (
        <div className="space-y-12 fade-in">
          <div className="grid gap-10">
            <div className="space-y-10">
              <section className="space-y-6">
                <div className="flex items-center justify-between px-2">
                  <div className="flex items-center gap-3"><AwardIcon size={22} className="text-clay" /><h3 className="text-2xl font-serif font-black tracking-tighter text-ink">食修功德排行榜</h3></div>
                  <span className="text-[10px] font-black text-muted uppercase tracking-widest opacity-60">更新於 5 分鐘前</span>
                </div>
                <div className="px-2">
                  <div className="inline-flex gap-2 w-full md:w-auto">
                    <button onClick={() => setRankTab('personal')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='personal' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>個人榜單</button>
                    <button onClick={() => setRankTab('mbei')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='mbei' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>16型種類榜單</button>
                  </div>
                </div>
                <div className="bg-white rounded-[5px] border-4 border-ink overflow-hidden shadow-2xl relative">
                  <div className="paper-texture" style={{opacity:0.02}} />
                  {board.map(user => (
                    <div key={user.rank} onClick={() => { setSelectedCreature(MBEI_TYPES[user.code]); setCreatureNavEnabled(false); }} style={{ cursor:'pointer' }} className={cn("flex items-center justify-between p-6 md:p-8 border-b border-parchment last:border-0 transition-colors", user.isUser ? "bg-clay/10 hover:bg-clay/15" : "hover:bg-parchment/30")}>
                      <div className="flex items-center gap-6">
                        <span className={cn("w-8 text-center font-serif font-black text-lg md:text-xl", user.rank===1?"text-amber":user.rank===2?"text-muted":user.rank===3?"text-clay":"text-stroke")}>{user.rank}</span>
                        <div style={{ width:44, height:55, borderRadius:5, overflow:'hidden', flexShrink:0, border:'1px solid rgba(234,228,217,0.5)', background:'var(--paper)' }}>
                          <img src={CREATURE_IMG[user.code]} alt={user.name} style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }} />
                        </div>
                        <div>
                          <p className="text-lg font-black text-ink flex items-center gap-2">{user.name}{rankTab==='personal'&&user.isUser&&<span className="text-[10px] bg-ink text-white px-3 py-0.5 rounded-full uppercase tracking-tighter font-black">這是你</span>}</p>
                          <p className="text-xs text-muted font-bold uppercase tracking-widest">{rankTab==='personal'?'依暱稱統計 · 紀錄總次數':`${MBEI_TYPES[user.code]?.code || ''} 型格`}</p>
                        </div>
                      </div>
                      <div className="text-right"><p className="text-xl font-serif font-black text-ink">{user.points}</p><p className="text-[10px] font-black text-muted uppercase tracking-widest">{user.scoreLabel}</p></div>
                    </div>
                  ))}
                </div>
              </section>
            </div>
          </div>
          {selectedCreature && (
            <div
              onClick={() => setSelectedCreature(null)}
              onTouchStart={e => { if (creatureNavEnabled) touchStartX.current = e.touches[0].clientX; }}
              onTouchEnd={e => { if (!creatureNavEnabled) return; const dx = e.changedTouches[0].clientX - touchStartX.current; if (Math.abs(dx) > 50) goCreature(dx < 0 ? 1 : -1); }}
              style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(0,0,0,0.92)',
                backdropFilter:'blur(12px)', display:'flex', alignItems:'center', justifyContent:'center',
                animation:'onboardFadeIn 0.25s ease-out' }}>
              <div onClick={e => e.stopPropagation()}
                style={{ position:'relative', width:'min(400px, 90vw)' }}>
                {/* close */}
                <button onClick={() => setSelectedCreature(null)}
                  style={{ position:'absolute', top:-14, right:-14, zIndex:10,
                    width:36, height:36, borderRadius:'50%', background:'rgba(149,211,195,0.12)',
                    border:'1px solid rgba(149,211,195,0.3)', color:'var(--jade)',
                    fontSize:16, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
                {/* prev */}
                {creatureNavEnabled && <button onClick={e => { e.stopPropagation(); goCreature(-1); }}
                  style={{ position:'absolute', left:-44, top:'35%', zIndex:10,
                    width:36, height:36, borderRadius:'50%', background:'rgba(149,211,195,0.10)',
                    border:'1px solid rgba(149,211,195,0.25)', color:'var(--jade)',
                    fontSize:20, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>}
                {/* next */}
                {creatureNavEnabled && <button onClick={e => { e.stopPropagation(); goCreature(1); }}
                  style={{ position:'absolute', right:-44, top:'35%', zIndex:10,
                    width:36, height:36, borderRadius:'50%', background:'rgba(149,211,195,0.10)',
                    border:'1px solid rgba(149,211,195,0.25)', color:'var(--jade)',
                    fontSize:20, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>}
                <div style={{ borderRadius:'2rem', overflow:'hidden', border:'1px solid rgba(149,211,195,0.2)',
                  boxShadow:'0 32px 80px rgba(0,0,0,0.85)', marginBottom:20 }}>
                  <img src={CREATURE_IMG[selectedCreature.code]} alt={selectedCreature.creature}
                    style={{ width:'100%', display:'block', objectFit:'contain' }} />
                </div>
                <div style={{ textAlign:'center', padding:'0 4px' }}>
                  <span style={{ fontSize:11, fontWeight:700, color:'var(--jade)',
                    background:'rgba(149,211,195,0.12)', border:'1px solid rgba(149,211,195,0.2)',
                    borderRadius:5, padding:'2px 10px', fontFamily:"'Noto Serif TC',serif",
                    letterSpacing:'0.1em' }}>{selectedCreature.code}</span>
                  <h3 style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900,
                    color:'var(--cream)', margin:'12px 0 6px' }}>{selectedCreature.name}</h3>
                  <p style={{ fontSize:13, color:'var(--sand)', lineHeight:1.7,
                    fontFamily:"'Noto Serif TC',serif", marginBottom:10 }}>{selectedCreature.description}</p>
                  <p style={{ fontSize:13, color:'var(--mist)', lineHeight:1.8,
                    fontFamily:"'Noto Serif TC',serif", fontStyle:'italic' }}>「{selectedCreature.insight}」</p>
                  {creatureNavEnabled && <p style={{ fontSize:11, color:'rgba(149,211,195,0.35)', marginTop:14,
                    fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.15em' }}>{encIdx + 1} / {encCreatures.length}</p>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SpectralSlider({ value, onChange, leftLabel, rightLabel, leftColor, rightColor, trackLeft, trackRight, statusLabels }) {
      const pct = value;
      const trackStyle = { background: `linear-gradient(to right, ${trackLeft} 0%, ${trackLeft} ${pct}%, ${trackRight} ${pct}%, ${trackRight} 100%)` };
      const status = pct < 30 ? statusLabels[0] : pct < 70 ? statusLabels[1] : statusLabels[2];
      return (
        <div style={{ borderRadius:10, padding:'18px 20px 14px', position:'relative', overflow:'hidden', background:'rgba(0,0,0,0.55)', border:'1px solid rgba(255,255,255,0.06)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12, alignItems:'center' }}>
            <span style={{ fontSize:11, color:leftColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{leftLabel}</span>
            <span style={{ fontSize:10, color:'rgba(255,255,255,0.35)', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.15em' }}>{status}</span>
            <span style={{ fontSize:11, color:rightColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{rightLabel}</span>
          </div>
          <input type="range" min="0" max="100" value={value} onChange={e => onChange(parseInt(e.target.value))}
            className="spectral-slider" style={trackStyle} />
        </div>
      );
    }

    function RecordModal({ onClose, onSubmit, formData, setFormData, isLoading, onSchedulePrefetch, onClearPrefetch, prefetchStatus, recordMode, initialPhase, onSaveDraft, initialPhotoPreview }) {

      const [photoSizeKB, setPhotoSizeKB] = React.useState(null);

      const [recognizeError, setRecognizeError] = React.useState('');
      const [confirmDraft, setConfirmDraft] = React.useState('');
      const [foodConfirmed, setFoodConfirmed] = React.useState(() => !!formData.whatFood?.trim());

      const showFoodSection = phase === 'food' || phase === 'all';
      const showFeelingsSection = phase === 'feelings' || phase === 'all';
      const isEarlyFoodStep = recordMode === 'early' && phase === 'food';
      const moodSelected = typeof formData.mood === 'number' && formData.mood >= 1 && formData.mood <= 5;
      const feelingsComplete = isFeelingsComplete(formData);
      const serif = "'Noto Serif TC',serif";

      const modalSubtitle = recordMode === 'early'
        ? (phase === 'food' ? '先記食物' : '補上飯後感受')
        : recordMode === 'continue' ? '補上飯後食緒' : '飯後一次記完';

      React.useEffect(() => {
        if (!showFeelingsSection || !foodConfirmed || !formData.whatFood?.trim() || !isFeelingsComplete(formData)) return;
        const t = setTimeout(() => onSchedulePrefetch?.(formData), 1500);
        return () => clearTimeout(t);
      }, [showFeelingsSection, foodConfirmed, formData.whatFood, formData.mealType, formData.mood, formData.bodyFeeling, formData.mealTime, formData.context]);

      React.useEffect(() => () => onClearPrefetch?.(), []);

      React.useEffect(() => {
        if (initialPhotoPreview) setPhotoPreview(initialPhotoPreview);
      }, [initialPhotoPreview]);

      React.useEffect(() => {
        if (recordMode === 'continue' && formData.whatFood?.trim()) setFoodConfirmed(true);
      }, [recordMode, formData.whatFood]);

      const applyPhotoMealTime = (file) => {
        const t = file.lastModified > 0 ? new Date(file.lastModified) : new Date();
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        setField('mealTime', `${hh}:${mm}`);
      };

      const handlePhotoFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        applyPhotoMealTime(file);
        setRecognizeError('');
        setRecognizePhase('compressing');
        try {
          const compressed = await compressImageFile(file);
          setPhotoPreview(compressed.previewUrl);
          setPhotoSizeKB(compressed.sizeKB);
          setRecognizePhase('recognizing');
          const name = await recognizeFoodFromImage(compressed.base64, compressed.mimeType);
          setConfirmDraft(name);
          setRecognizePhase('confirm');
        } catch (err) {
          setRecognizeError(err.message || '辨識失敗');
          setRecognizePhase('error');
        }
      };

      const confirmRecognition = () => {
        const name = confirmDraft.trim();
        if (!name) return;
        setField('whatFood', name);
        setFoodConfirmed(true);
        setRecognizePhase('idle');
        onSchedulePrefetch?.({ ...formData, whatFood: name });
      };

      const cancelRecognition = () => {
        setRecognizePhase('idle');
        setConfirmDraft('');
        setPhotoPreview(null);
        setPhotoSizeKB(null);
      };

      const onWhatFoodChange = (e) => {
        const v = e.target.value;
        setField('whatFood', v);
        if (!v.trim()) setFoodConfirmed(false);
      };

      const onWhatFoodBlur = () => {
        if (formData.whatFood?.trim() && recognizePhase === 'idle') setFoodConfirmed(true);
      };

      const isRecognizing = recognizePhase === 'compressing' || recognizePhase === 'recognizing';

      return (
        <div className="fixed inset-0 z-[100] flex items-end md:items-center justify-center overflow-hidden p-0 md:p-12">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
          <div className="w-full md:max-w-5xl h-[94vh] md:h-auto md:max-h-[90vh] bg-paper rounded-t-[5px] md:rounded-[5px] relative z-10 flex flex-col shadow-2xl overflow-hidden sheet-up cn-red-frame-modal">
            <span className="cn-corner cn-corner-tl" aria-hidden="true" />
            <span className="cn-corner cn-corner-tr" aria-hidden="true" />
            <span className="cn-corner cn-corner-bl" aria-hidden="true" />
            <span className="cn-corner cn-corner-br" aria-hidden="true" />
            <div className="paper-texture" style={{opacity:0.03}} />
            <div className="p-8 md:p-12 flex justify-between items-center border-b border-stroke shrink-0 bg-parchment/80 backdrop-blur-md relative z-10">
              <div className="space-y-1">
                <h3 className="text-3xl font-serif font-black tracking-tighter text-ink">凝練食緒</h3>
                <p className="text-[10px] font-black text-muted uppercase tracking-[0.3em]">CRAFTING DIETARY SPIRIT</p>
                <p className="text-xs font-semibold text-jade/90" style={{ fontFamily:serif, letterSpacing:'0.05em' }}>{modalSubtitle}</p>
              </div>
              <button onClick={onClose} className="w-12 h-12 flex items-center justify-center bg-ink text-white rounded-full hover:scale-110 active:scale-90 transition-all shadow-lg"><XIcon size={24} /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-8 md:p-16 space-y-12 pb-44 md:pb-40 scrollbar-hide relative z-10">
              {phase === 'feelings' && formData.whatFood?.trim() && (
                <div className="p-4 rounded-[1.5rem] border border-jade/30 bg-parchment/40 flex items-center gap-3 flex-wrap">
                  {photoPreview && <img src={photoPreview} alt="" className="w-14 h-14 rounded-xl object-cover border border-stroke shrink-0" />}

                    <p style={{ fontSize:11, color:'var(--mist)', margin:'0 0 4px' }}>本餐食物</p>

                    <p style={{ fontSize:12, color:'var(--muted)', margin:'4px 0 0' }}>{formData.mealType} · {formData.mealTime}</p>
                  </div>
                  {(recordMode === 'early' || recordMode === 'continue') && (
                    <button type="button" onClick={() => setPhase('food')} className="text-xs font-bold text-muted underline shrink-0">修改食物</button>
                  )}
                </div>
              )}
              {showFoodSection && (
              <>
              <RecordSection title={recordMode === 'after' ? '這一餐吃了什麼？（拍照或選照片）' : '這一餐吃了什麼？'}>
                <input ref={photoInputRef} type="file" accept="image/*" className="hidden" onChange={handlePhotoFile} />
                <div className="flex gap-2 flex-wrap">
                  <input type="text" className="flex-1 min-w-[140px] rounded-[1.5rem] border-2 border-stroke bg-white px-6 py-4 text-lg font-semibold text-ink placeholder:text-[#B0A7A1] focus:outline-none focus:border-ink/30" placeholder="手動輸入食物名稱" value={formData.whatFood || ''} onChange={onWhatFoodChange} onBlur={onWhatFoodBlur} required={phase === 'food' || phase === 'all'} disabled={isRecognizing || phase === 'feelings'} />

                    {isRecognizing ? <span className="spin-loading text-xl">☯</span> : <CameraIcon size={22} />}
                  </button>
                </div>
                {(photoPreview || photoSizeKB) && (
                  <div className="mt-3 flex items-center gap-3">
                    {photoPreview && <img src={photoPreview} alt="預覽" className="w-16 h-16 rounded-xl object-cover border border-stroke" />}

                {recognizePhase === 'confirm' && (

                    <input type="text" value={confirmDraft} onChange={e => setConfirmDraft(e.target.value)}

                    <div className="flex gap-2">
                      <button type="button" onClick={confirmRecognition}

                      <button type="button" onClick={cancelRecognition}
                        className="px-4 py-2.5 rounded-xl border border-stroke text-sm font-bold text-muted hover:bg-parchment">重拍</button>
                    </div>
                  </div>
                )}
                {isRecognizing && (
                  <p className="mt-2 text-xs text-muted font-semibold" style={{ fontFamily:"'Noto Serif TC',serif" }}>

                    rows={2}
                    className="w-full rounded-[1.5rem] border-2 border-stroke bg-white px-6 py-4 text-base font-semibold text-ink placeholder:text-[#B0A7A1] focus:outline-none focus:border-ink/30 resize-none"
                  />
                  {formData.context?.trim() && (
                    <span style={{ position:'absolute', right:16, bottom:14, fontSize:11, color:'var(--forest)', fontWeight:700, fontFamily:"'Noto Serif TC',serif" }}>+{calcMeritFromContext(formData.context)} 功德 ✦</span>
                  )}
                </div>
              </RecordSection>
              )}
              {showFeelingsSection && (
              <>
              {recordMode === 'after' && phase === 'all' && (
                <p className="text-sm text-muted font-semibold -mt-4 mb-2" style={{ fontFamily:serif }}>請在吃完後填寫以下感受</p>
              )}
              <div className="py-10 bg-parchment/30 rounded-[5px] px-8 md:px-12 border border-stroke/50 shadow-inner">
                <RecordSection title="吃完這一餐，爽度如何？">
                  <div style={{ padding:'8px 4px 0' }}>
                    {!moodSelected && (
                      <p style={{ fontSize:12, color:'var(--mist)', margin:'0 0 10px', fontFamily:serif }}>請點選表情或拖動滑桿（必選）</p>
                    )}
                    <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12 }}>
                      {[1,2,3,4,5].map(n => (
                        <span key={n} role="button" tabIndex={0} onClick={() => setField('mood', n)}
                          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') setField('mood', n); }}
                          style={{ fontSize: moodSelected && formData.mood === n ? 32 : 22, transition:'font-size 0.15s, opacity 0.15s',
                            opacity: moodSelected && formData.mood === n ? 1 : 0.35, cursor:'pointer', userSelect:'none' }}>
                          {MOOD_SCORE_EMOJIS[n]}
                        </span>
                      ))}
                    </div>
                    <input type="range" min="1" max="5" step="1" value={moodSelected ? formData.mood : 3}
                      onChange={e => setField('mood', parseInt(e.target.value, 10))}
                      style={{ width:'100%', accentColor: moodSelected ? 'var(--jade)' : 'var(--stroke)', cursor:'pointer', height:6, opacity: moodSelected ? 1 : 0.55 }} />
                    <div style={{ display:'flex', justifyContent:'space-between', marginTop:8 }}>
                      {[1,2,3,4,5].map(n => (
                        <span key={n} style={{ flex:1, textAlign:'center', fontSize:11,
                          color: moodSelected && formData.mood === n ? 'var(--forest)' : '#B0A7A1',
                          fontWeight: moodSelected && formData.mood === n ? 700 : 400, transition:'color 0.15s', fontFamily:serif }}>
                          {MOOD_SCORE_LABELS[n]}
                        </span>
                      ))}
                    </div>
                  </div>
                </RecordSection>
              </div>
              <RecordSection title="吃完身體的感受？">
                {!formData.bodyFeeling && (
                  <p style={{ fontSize:12, color:'var(--mist)', margin:'0 0 8px', fontFamily:serif }}>請點選一項（必選）</p>
                )}
                <IconGrid options={BODY_FEELING_OPTIONS} value={formData.bodyFeeling} onChange={v => setField('bodyFeeling', v)} />
              </RecordSection>
              {foodConfirmed && prefetchStatus === 'loading' && (
                <p className="mt-2 text-xs text-jade font-semibold" style={{ fontFamily:serif }}>靈籤預熱中…</p>
              )}
              {foodConfirmed && prefetchStatus === 'ready' && (
                <p className="mt-2 text-xs text-forest font-semibold" style={{ fontFamily:serif }}>靈籤已備妥，送出可更快顯示</p>
              )}
              {foodConfirmed && prefetchStatus === 'error' && (
                <p className="mt-2 text-xs text-clay font-semibold" style={{ fontFamily:serif }}>AI 暫不可用，送出將使用離線示範籤（請檢查 Vercel 的 OPENAI_API_KEY）</p>
              )}
              </>
              )}
            </div>
            <div className="p-4 md:p-6 bg-parchment/90 backdrop-blur-xl absolute bottom-0 left-0 right-0 border-t border-stroke z-20 flex justify-center">
              <div className="max-w-md w-full space-y-2">
                {isEarlyFoodStep ? (
                  <>
                    <button type="button" onClick={() => { if (!formData.whatFood?.trim()) return; onSaveDraft?.({ formData, photoPreview }); }}
                      disabled={!formData.whatFood?.trim() || recognizePhase === 'confirm' || isRecognizing}
                      className="w-full py-2.5 rounded-[5px] border border-stroke text-ink font-semibold text-sm hover:bg-parchment/50 disabled:opacity-50"
                      style={{ fontFamily:serif }}>稍後再填食緒</button>
                    <button type="button" onClick={() => {
                      if (!formData.whatFood?.trim()) return;
                      setFoodConfirmed(true);
                      setPhase('feelings');
                    }} disabled={!formData.whatFood?.trim() || recognizePhase === 'confirm' || isRecognizing}
                      className="inject-btn w-full text-white py-3 rounded-[5px] font-bold text-sm shadow-md disabled:opacity-50"
                      style={{ background:'linear-gradient(135deg,#1a1208 0%,#2d2010 50%,#1a1208 100%)', border:'1px solid rgba(212,168,67,0.35)', fontFamily:serif }}>
                      現在繼續填感受
                    </button>
                  </>
                ) : (
                <button onClick={onSubmit} disabled={isLoading || !formData.whatFood?.trim() || !feelingsComplete || recognizePhase === 'confirm'}
                  className="inject-btn w-full text-white py-3.5 rounded-[5px] font-bold text-base shadow-md flex items-center justify-center gap-2 relative overflow-hidden disabled:opacity-50"
                  style={{ background:'linear-gradient(135deg,#1a1208 0%,#2d2010 50%,#1a1208 100%)', border:'1px solid rgba(212,168,67,0.35)' }}>
                  <div className="absolute inset-0 paper-texture" style={{opacity:0.15}} />
                  {isLoading ? <span className="spin-loading text-xl">☯</span> : <span className="tracking-[0.25em] text-sm" style={{fontFamily:"'Noto Serif TC',serif"}}>注入孵化池</span>}
                </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const GeminiSourceNotice = ({ fortune, variant = 'dark' }) => {
      const src = fortune?._aiSource ?? fortune?._geminiSource;
      if (!fortune || src !== 'mock') return null;
      const serif = "'Noto Serif TC',serif";
      const isLight = variant === 'light';
      return (
        <p style={{
          fontSize:12, textAlign:'center', margin:'0 0 12px', padding:'8px 12px', borderRadius:8, fontFamily:serif, lineHeight:1.5,
          color: isLight ? '#9e2a2b' : 'rgba(255,200,120,0.95)',
          background: isLight ? 'rgba(212,168,67,0.12)' : 'rgba(0,0,0,0.25)',
          border: isLight ? '1px solid rgba(158,42,43,0.2)' : 'none',
        }}>
          ⚠ {fortune._aiError || fortune._geminiError || '目前為離線示範籤文'}
        </p>
      );
    };
