              </h3>
              {!isToday && (
                <button onClick={() => setSelectedDate(todayStr)}
                  className="text-[10px] font-bold text-muted bg-stroke/60 px-2 py-0.5 rounded-full hover:bg-stroke transition-colors">
                  回今日
                </button>
              )}
            </div>
            {selectedRecords.length > 0 ? selectedRecords.map(r => (
              <div key={r.id} onClick={() => setExpandedRecordId(expandedRecordId === r.id ? null : r.id)}
                className="bg-white rounded-[5px] p-6 shadow-sm border border-stroke flex flex-col gap-4" style={{ cursor:'pointer' }}>
                <div className="space-y-1">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="font-black text-ink" style={{ fontFamily:"'Noto Serif TC',serif", fontSize:18, letterSpacing:'0.05em', marginBottom:2 }}>{getRecordFood(r)}</p>
                      <p className="font-bold text-sm text-muted">{r.mealType} · {r.time} <span style={{fontSize:11,color:'var(--jade)',fontFamily:"'Noto Serif TC',serif",fontWeight:400,opacity:0.8}}>{getEarthlyBranch(r.time)}時</span></p>
                    </div>
                    {getRecordMerit(r) > 0 && (
                      <span style={{ fontSize:11, fontWeight:900, color:'var(--amber)', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.05em' }}>
                        +{getRecordMerit(r)} 功德
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 text-xs font-bold text-muted">
                    <span className="text-forest">心情：{r.mood}</span>
                    <span className="text-stroke font-normal">|</span>
                    <span>身體：{formatRecordBodyFeeling(r)}</span>
                  </div>
                  {r.fortune?.main_title && (
                    <p className="text-xs text-muted/70 font-serif pt-0.5">「{r.fortune.main_title}」</p>
                  )}
                </div>
                {(r.fortune?.do || r.fortune?.next_meal) && (
                  <div className="flex flex-col gap-1 pt-2 border-t border-parchment">
                    {r.fortune.do && <p className="text-[11px] text-forest/80 font-serif">{r.fortune.do}</p>}
                    {r.fortune.next_meal && <p className="text-[11px] text-amber font-serif">{r.fortune.next_meal}</p>}
                  </div>
                )}
                {expandedRecordId === r.id && <MBEIBars mbeiCode={r.mbeiCode} mbeiScores={r.mbeiScores || r.fortune?.mbei_scores} />}
              </div>
            )) : (
              <div className="bg-white rounded-[5px] p-10 text-center border-2 border-dashed border-stroke text-muted text-sm font-bold">
                {isToday ? '今日尚無食緒紀錄。' : '這天沒有紀錄。'}
              </div>
            )}
          </div>
        </div>
      );
    }

    /** 軸向分數 -50～+50 → 滑桿位置 8%～92%（與 MBEIBars 一致：正分靠左極、負分靠右極） */
    function mbeiScoreToThumbPct(score) {
      const s = clampMbeiScore(score);
      return Math.round(8 + ((50 - s) / 100) * 84);
    }

    function aggregateMbeiProfileFromRecords(records) {
      const scored = (records || []).filter((r) => r.mbeiScores || r.mbeiCode);
      if (!scored.length) return null;
      const sums = { MB: 0, NP: 0, HL: 0, RV: 0 };
      for (const r of scored) {
        const s = normalizeMbeiScores(r.mbeiScores || scoresFromMbeiCode(r.mbeiCode));
        MBEI_AXES.forEach(({ key }) => { sums[key] += s[key]; });
      }
      const n = scored.length;
      const scores = {};
      MBEI_AXES.forEach(({ key }) => { scores[key] = clampMbeiScore(Math.round(sums[key] / n)); });
      return { scores, count: n, code: mbeiCodeFromScores(scores) };
    }

    function aggregateMbeiProfileForCode(records, code) {
      const matched = (records || []).filter((r) => {
        const c = r.mbeiCode || mbeiCodeFromScores(r.mbeiScores);
        return c === code;
      });
      if (!matched.length) return null;
      return aggregateMbeiProfileFromRecords(matched);
    }

    function SpectrumTuner({ profileScores = null, profileMeta = null }) {
      const DIMS = [
        { num:'01', title:'能量來源',
          left:  { code:'M', label:'魂', name:'以情入食，滋養心緒', desc:'這一餐連著心情——開心、想念，或需要一點安慰，都是你此刻真實的動機。' },
          right: { code:'B', label:'魄', name:'以身入食，照顧凡軀', desc:'這一餐為身體服務——補充能量、維持日常，讓肉身繼續穩穩走下去。' } },
        { num:'02', title:'食源性',
          left:  { code:'N', label:'野', name:'親近土地與當令之味', desc:'多半來自食材本身——當令、少加工，帶著季節與原野的氣息。' },
          right: { code:'P', label:'煉', name:'精緻煉化，現代滋味', desc:'經人工調配與加工——便利、穩定，也常有精心設計的口感與質地。' } },
        { num:'03', title:'身體負荷',
          left:  { code:'L', label:'靈', name:'輕盈通透，氣息順流', desc:'吃完少有滯重感，身體像被輕輕托住，仍保有餘裕與清醒。' },
          right: { code:'H', label:'煞', name:'濃香厚實，全身都在', desc:'口味或份量較足，身體會明顯感到飽足與踏實，這一餐很有「存在感」。' } },
        { num:'04', title:'規律節奏',
          left:  { code:'R', label:'曆', name:'順時而食，作息分明', desc:'用餐時間相對固定，像在守自己的小曆法，讓一日有清楚的錨點。' },
          right: { code:'V', label:'幻', name:'隨心而食，節奏流動', desc:'何時吃、吃多少，常隨當天狀態調整——靈活，也帶著一點不可預測的詩意。' } },
      ];
      const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
      const [thumbPcts, setThumbPcts] = React.useState(() => [50, 50, 50, 50]);
      const [previewPct, setPreviewPct] = React.useState(() => Array(4).fill(null));
      const isCoarse = typeof window !== 'undefined' && window.matchMedia('(pointer: coarse)').matches;

      React.useEffect(() => {
        if (!profileScores) {
          setThumbPcts([50, 50, 50, 50]);
          setPreviewPct(Array(4).fill(null));
          return;
        }
        setThumbPcts(MBEI_AXES.map(({ key }) => mbeiScoreToThumbPct(profileScores[key])));
        setPreviewPct(Array(4).fill(null));
      }, [profileScores]);

      const pctFromX = (el, clientX) => {
        const r = el.getBoundingClientRect();
        const raw = ((clientX - r.left) / r.width) * 100;
        return Math.max(8, Math.min(92, Math.round(raw)));
      };
      const getThumbPct = (i) => previewPct[i] ?? thumbPcts[i] ?? 50;
      const pickPct = (i, pct) => setThumbPcts((p) => p.map((x, j) => (j === i ? pct : x)));
      const setPreviewPctAt = (i, v) => setPreviewPct((s) => s.map((x, j) => (j === i ? v : x)));

      const meta = profileMeta || {};
      const subtitle = (() => {
        if (!profileScores) return '記下餐食後，這裡會顯示你的平均食緒偏向';
        if (meta.source === 'creature-records' && meta.count > 0) {
          return (
            <>
              依你 <span style={{ color:'var(--amber)' }}>{meta.count}</span> 筆「{meta.label}」型紀錄的平均偏向
              {meta.code && <> · <span style={{ color:'var(--jade)' }}>{meta.code}</span></>}
            </>
          );
        }
        if (meta.source === 'creature-archetype') {
          return (
            <>
              <span style={{ color:'var(--amber)' }}>{meta.label}</span> 型格參考（你尚無同型紀錄，顯示典型四象限）
              {meta.code && <> · {meta.code}</>}
            </>
          );
        }
        if (meta.count > 0) {
          return (
            <>
              依你 <span style={{ color:'var(--amber)' }}>{meta.count}</span> 筆紀錄的平均食緒偏向
              {meta.code && <> · 綜合 <span style={{ color:'var(--jade)' }}>{meta.code}</span></>}
            </>
          );
        }
        return '點擊滑桿或上方靈獸，對照四維度偏向';
      })();

      return (
        <div id="spectrum-tuner" style={{ background:'#1a150a', border:'1px solid rgba(149,211,195,0.12)', borderRadius:5, padding:'24px 20px', display:'flex', flexDirection:'column', gap:0 }}>
          <div style={{ marginBottom:24 }}>
            <p style={{ fontSize:9, color:'var(--jade)', fontFamily:"'Noto Serif TC',serif", fontWeight:700, letterSpacing:'0.2em', margin:'0 0 6px', opacity:0.7 }}>四大維度 · 食緒型格</p>
            <h4 style={{ fontSize:16, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--cream)', margin:0, letterSpacing:'0.1em' }}>能量調頻儀</h4>
            <p style={{ fontSize:12, color:'var(--mist)', margin:'4px 0 0', opacity:0.6, lineHeight:1.65 }}>{subtitle}</p>
          </div>
          {DIMS.map((dim, i) => {
            const thumbLeft = getThumbPct(i);
            const axisKey = MBEI_AXES[i].key;
            const axisScore = profileScores ? clampMbeiScore(profileScores[axisKey]) : null;
            const leanSide = thumbLeft < 50 ? 'left' : thumbLeft > 50 ? 'right' : null;
            const active = leanSide ? (leanSide === 'left' ? dim.left : dim.right) : null;
            const leanPct = Math.round(Math.abs(thumbLeft - 50) * 2);
            const jade = 'rgba(149,211,195,';
            const amber = 'rgba(200,184,138,';
            const trackHandlers = isCoarse
              ? {
                  onClick: (e) => {
                    e.preventDefault();
                    pickPct(i, pctFromX(e.currentTarget, e.clientX));
                  },
                }
              : {
                  onClick: (e) => pickPct(i, pctFromX(e.currentTarget, e.clientX)),
                  onMouseMove: (e) => setPreviewPctAt(i, pctFromX(e.currentTarget, e.clientX)),
                  onMouseLeave: () => setPreviewPctAt(i, null),
                };
            const poleChar = { fontSize:18, fontWeight:900, lineHeight:1, transition:`color 0.35s ${EASE}` };
            const leftActive = thumbLeft <= 50;
            const rightActive = thumbLeft >= 50;
            const leftColor = leftActive ? 'var(--jade)' : jade + '0.28)';
            const rightColor = rightActive ? 'var(--amber)' : amber + '0.28)';
            const leftHint = MBEI_LETTER_CN[dim.left.code]?.hint || '';
            const rightHint = MBEI_LETTER_CN[dim.right.code]?.hint || '';
            const boxAccent = leanSide === 'left'
              ? { bg: 'rgba(149,211,195,0.07)', border: 'rgba(149,211,195,0.22)', badge: 'rgba(149,211,195,0.14)', text: 'var(--jade)' }
              : leanSide === 'right'
                ? { bg: 'rgba(200,184,138,0.07)', border: 'rgba(200,184,138,0.22)', badge: 'rgba(200,184,138,0.14)', text: 'var(--amber)' }
                : null;
            return (
              <div key={i} style={{ paddingBottom: i < 3 ? 18 : 0, marginBottom: i < 3 ? 18 : 0, borderBottom: i < 3 ? '1px solid rgba(149,211,195,0.06)' : 'none' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                  <span style={{ fontSize:9, fontFamily:"'JetBrains Mono',monospace", color:'rgba(149,211,195,0.3)', letterSpacing:'0.15em' }}>{dim.num} /</span>
                  <span style={{ fontSize:12, fontFamily:"'Noto Serif TC',serif", fontWeight:700, color:'var(--sand)', letterSpacing:'0.15em' }}>{dim.title}</span>
                </div>
                <div
                  role="button"
                  tabIndex={0}
                  aria-label={`${dim.title}：點擊左或右象限`}
                  style={{
                    display:'flex', alignItems:'center', gap:14, marginBottom:12,
                    padding:'16px 0', margin:'-16px 0 12px', cursor:'pointer',
                    touchAction:'manipulation', WebkitTapHighlightColor:'transparent', userSelect:'none',
                  }}
                  onKeyDown={(e) => {
                    if (e.key === 'ArrowLeft') pickPct(i, 8);
                    if (e.key === 'ArrowRight') pickPct(i, 92);
                  }}
                  {...trackHandlers}
                >
                  <div style={{ width:62, flexShrink:0, pointerEvents:'none', display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
                    <div style={{ display:'flex', alignItems:'baseline', gap:4 }}>
                      <span style={{ ...poleChar, fontFamily:"'Noto Serif TC',serif", color: leftColor }}>{dim.left.label}</span>
                      <span style={{ ...poleChar, fontFamily:"'JetBrains Mono',monospace", color: leftColor, letterSpacing:'0.04em' }}>{dim.left.code}</span>
                    </div>
                    {leftHint && (
                      <span style={{ fontSize:10, fontFamily:"'Noto Serif TC',serif", color: leftColor, opacity: leftActive ? 0.75 : 0.45, lineHeight:1.3, textAlign:'right' }}>{leftHint}</span>
                    )}
                  </div>
                  <div style={{ flex:1, position:'relative', height:6, borderRadius:3, background:'rgba(255,255,255,0.04)', pointerEvents:'none', contain:'layout style paint' }}>
                    <div style={{
                      position:'absolute', inset:0, borderRadius:3, pointerEvents:'none',
                      opacity: profileScores ? 1 : 0.35,
                      transition:`opacity 0.35s ${EASE}`,
                      background: thumbLeft <= 50
                        ? `linear-gradient(90deg,rgba(149,211,195,0.55) 0%,rgba(149,211,195,0.12) ${thumbLeft}%,transparent ${Math.min(thumbLeft + 8, 100)}%)`
                        : `linear-gradient(90deg,transparent ${Math.max(thumbLeft - 8, 0)}%,rgba(200,184,138,0.12) ${thumbLeft}%,rgba(200,184,138,0.55) 100%)`,
                    }} />
                    <div style={{
                      position:'absolute', top:'50%', left:`${thumbLeft}%`,
                      width:14, height:14, borderRadius:'50%', pointerEvents:'none',
                      transform:'translate3d(-50%,-50%,0)',
                      transition:`left 0.38s ${EASE}, background 0.38s ${EASE}, box-shadow 0.38s ${EASE}`,
                      willChange: 'left',
                      background: thumbLeft < 50 ? 'var(--jade)' : thumbLeft > 50 ? 'var(--amber)' : 'rgba(149,211,195,0.45)',
                      boxShadow: thumbLeft < 50
                        ? '0 0 14px rgba(149,211,195,0.8), 0 0 4px rgba(149,211,195,1)'
                        : thumbLeft > 50
                          ? '0 0 14px rgba(200,184,138,0.8), 0 0 4px rgba(200,184,138,1)'
                          : '0 0 8px rgba(149,211,195,0.4)',
                    }} />
                    {axisScore != null && (
                      <span style={{ position:'absolute', right:0, top:-14, fontSize:9, color:'rgba(149,211,195,0.5)', fontFamily:"'JetBrains Mono',monospace" }}>
                        {axisScore > 0 ? '+' : ''}{axisScore}
                      </span>
                    )}
                  </div>
                  <div style={{ width:62, flexShrink:0, pointerEvents:'none', display:'flex', flexDirection:'column', alignItems:'flex-start', gap:4 }}>
                    <div style={{ display:'flex', alignItems:'baseline', gap:4 }}>
                      <span style={{ ...poleChar, fontFamily:"'JetBrains Mono',monospace", color: rightColor, letterSpacing:'0.04em' }}>{dim.right.code}</span>
                      <span style={{ ...poleChar, fontFamily:"'Noto Serif TC',serif", color: rightColor }}>{dim.right.label}</span>
                    </div>
                    {rightHint && (
                      <span style={{ fontSize:10, fontFamily:"'Noto Serif TC',serif", color: rightColor, opacity: rightActive ? 0.75 : 0.45, lineHeight:1.3 }}>{rightHint}</span>
                    )}
                  </div>
                </div>
                <div style={{
                  overflow: 'hidden',
                  maxHeight: active ? 140 : 0,
                  opacity: active ? 1 : 0,
                  marginTop: active ? 10 : 0,
                  transition: `max-height 0.38s ${EASE}, opacity 0.32s ${EASE}, margin-top 0.32s ${EASE}`,
                  pointerEvents: active ? 'auto' : 'none',
                }}>
                  <div style={{
                    width: '100%',
                    padding: '12px 14px',
                    borderRadius: 8,
                    boxSizing: 'border-box',
                    background: boxAccent?.bg || 'transparent',
                    border: `1px solid ${boxAccent?.border || 'transparent'}`,
                    boxShadow: active ? 'inset 0 1px 0 rgba(255,255,255,0.04)' : 'none',
                  }}>
                    {active && (
                      <>
                        <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '6px 10px', marginBottom: 8 }}>
                          <span style={{ fontSize: 14, fontFamily: "'Noto Serif TC',serif", fontWeight: 900, color: 'var(--cream)', letterSpacing: '0.04em', lineHeight: 1.4 }}>
                            {active.name}
                          </span>
                          {leanPct > 8 && boxAccent && (
                            <span style={{
                              fontSize: 11, fontFamily: "'Noto Serif TC',serif", fontWeight: 700,
                              padding: '3px 9px', borderRadius: 20, letterSpacing: '0.06em',
                              background: boxAccent.badge, color: boxAccent.text,
                              border: `1px solid ${boxAccent.border}`,
                            }}>
                              偏向 {active.label} {leanPct}%
                            </span>
                          )}
                        </div>
                        <p style={{ fontSize: 12, color: 'var(--sand)', margin: 0, lineHeight: 1.7, opacity: 0.9 }}>
                          {active.desc}
                        </p>
                      </>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /** 水墨雲霧上的朱印小鎖（size: sm | md | lg） */
    function CreatureMistLock({ size = 'md' }) {
      const box = size === 'sm' ? 28 : size === 'lg' ? 52 : 38;
      const iconSize = size === 'sm' ? 14 : size === 'lg' ? 26 : 20;
      return (
        <div
          className="creature-mist-lock"
          aria-hidden="true"
          style={{
            position: 'absolute', left: '50%', top: '50%',
            transform: 'translate(-50%, -50%)', zIndex: 8, pointerEvents: 'none',
          }}
        >
          <div
            className="creature-mist-lock-seal"
            style={{
              width: box, height: box, borderRadius: 5,
              background: 'linear-gradient(155deg, rgba(62,32,24,0.88) 0%, rgba(26,16,10,0.94) 100%)',
              border: '2px solid rgba(160,68,52,0.7)',
              boxShadow: '0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,210,170,0.12)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              transform: 'rotate(-4deg)',
              color: 'rgba(228,195,150,0.96)',
            }}
          >
            <LockIcon size={iconSize} />
          </div>
        </div>
      );
    }

    /** 圖鑑列表小圖：一律清晰；雲霧模糊僅在點開後的彈窗大圖 */
    function CreaturePortraitThumb({ code, creature, pending, width = 38, height = 48 }) {
      return (
        <div style={{
          width, height, flexShrink: 0, borderRadius: 4, overflow: 'hidden',
          border: pending ? '1px dashed rgba(149,211,195,0.2)' : '1px solid rgba(149,211,195,0.12)',
          position: 'relative', background: 'rgba(21,13,0,0.35)',
        }}>
          <img
            src={CREATURE_IMG[code]}
            alt={creature}
            style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }}
          />
        </div>
      );
    }

    function InsightView({ records = [], loginProfile, onSharePoster, shareBusy }) {
      const [tab, setTab] = useState('personal');
      const [showEncyclopedia, setShowEncyclopedia] = useState(false);
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [notionProfile, setNotionProfile] = useState(null);
      const [tunerMode, setTunerMode] = React.useState('user');
      const [tunerMbeiCode, setTunerMbeiCode] = React.useState(null);

      const userMbeiProfile = useMemo(() => aggregateMbeiProfileFromRecords(records), [records]);

      const tunerProfile = useMemo(() => {
        if (tunerMode === 'creature' && tunerMbeiCode) {
          const byCode = aggregateMbeiProfileForCode(records, tunerMbeiCode);
          const type = MBEI_TYPES[tunerMbeiCode];
          return {
            scores: byCode?.scores || scoresFromMbeiCode(tunerMbeiCode),
            count: byCode?.count || 0,
            code: tunerMbeiCode,
            label: type?.creature || tunerMbeiCode,
            source: byCode?.count ? 'creature-records' : 'creature-archetype',
          };
        }
        return {
          scores: userMbeiProfile?.scores || null,
          count: userMbeiProfile?.count || 0,
          code: userMbeiProfile?.code || null,
          label: loginProfile?.nickname || '修行者',
          source: 'user',
        };
      }, [tunerMode, tunerMbeiCode, records, userMbeiProfile, loginProfile?.nickname]);

      const pickCreatureForTuner = (type) => {
        if (!type?.code) return;
        setTunerMode('creature');
        setTunerMbeiCode(type.code);
        requestAnimationFrame(() => {
          document.getElementById('spectrum-tuner')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      };

      const resetTunerToUser = () => {
        setTunerMode('user');
        setTunerMbeiCode(null);
      };
      const tunerPortraitBorder = (code) => (
        tunerMbeiCode === code
          ? '2px solid rgba(217, 138, 91, 0.75)'
          : '2px solid rgba(149,211,195,0.25)'
      );

      React.useEffect(() => {
        if (!loginProfile?.email) { setNotionProfile(null); return; }
        let cancelled = false;
        fetchNotionLeaderboard(loginProfile.email).then((res) => {
          if (!cancelled && res.ok) setNotionProfile(res.userProfile);
        });
        return () => { cancelled = true; };
      }, [loginProfile?.email]);

      const hatch = useMemo(
        () => mergeHatchWithNotion(getHatchState(records), notionProfile),
        [records, notionProfile],
      );
      const unlockedCount = hatch.unlockedCodes?.size || 0;

      const latest = records[0];
      const stageClue = !latest ? '' : (()=>{
        const c = latest.mbeiCode;
        return (c[0]==='M' ? '魂動（情緒主導）' : '魄健（生理理性）') + '・' + (c[2]==='H' ? '煞氣（身體負荷重）' : '靈氣（身體輕盈）');
      })();

      const hatchProgress = useMemo(() => {
        const nextMilestone = hatch.stage === 0
          ? '記下第一餐，啟動孵化'
          : hatch.stage === 1
            ? `本輪孵化 ${hatch.progressInCycle}/${HATCH_RECORDS_REQUIRED} 筆 · 再 ${hatch.recordsToNext} 筆顯形`
            : hatch.stage === 2
              ? `已孵化 ${hatch.completedCycles} 輪 · 下一隻進度 ${hatch.progressInCycle}/${HATCH_RECORDS_REQUIRED}（再 ${hatch.recordsToNext} 筆）`
              : `第 ${hatch.completedCycles} 輪靈獸已顯形 · 再記 ${HATCH_RECORDS_REQUIRED} 次孵化下一隻`;
        return {
          overall: hatch.progressPct,
          phaseIdx: hatch.stage <= 1 ? 0 : hatch.stage === 2 ? 1 : 2,
          nextMilestone,
          count: hatch.total,
        };
      }, [hatch]);

      const card = { background:'#252016', border:'1px solid #3a3020', borderRadius:5, boxShadow:'0 8px 30px rgba(135,123,115,0.08)' };
      const serif = "'Noto Serif TC',serif";

      return (
        <div className="space-y-10 fade-in">
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div className="space-y-1">
              <h2 className="text-4xl font-serif font-black text-jade tracking-tighter">食緒靈獸</h2>
            </div>
            <div className="flex bg-parchment p-1.5 rounded-2xl border border-stroke/50 shadow-inner w-full md:w-auto">
              {[['personal','靈獸孵化'],['group','靈獸圖鑑']].map(([t,label]) => (
                <button key={t} onClick={() => setTab(t)} className={cn("flex-1 md:w-32 px-4 py-2.5 rounded-xl text-xs font-black transition-all uppercase tracking-widest", tab===t ? "bg-white text-ink shadow-md" : "text-muted hover:text-ink")}>{label}</button>
              ))}
            </div>
          </header>

          {tab === 'personal' ? (
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

              {/* ── 靈獸孵化卡 ── */}
              <div style={{ ...card, overflow:'hidden' }}>
                {/* 孵化進度長條 */}
                <div style={{ padding:'20px 24px 8px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10 }}>
                    <span style={{ fontSize:11, color:'var(--jade)', letterSpacing:'0.2em', fontWeight:700, fontFamily:serif }}>孵化進度</span>
                    <span style={{ fontSize:22, fontWeight:900, color:'var(--cream)', fontFamily:serif, lineHeight:1 }}>
                      {Math.round(hatchProgress.overall)}<span style={{ fontSize:12, color:'var(--mist)', fontWeight:600 }}>%</span>
                    </span>
                  </div>
                  <div style={{ position:'relative', height:12, borderRadius:6, background:'rgba(149,211,195,0.08)', overflow:'hidden', border:'1px solid rgba(149,211,195,0.12)' }}>
                    <div style={{
                      height:'100%', width:`${hatchProgress.overall}%`, borderRadius:6, transition:'width 0.65s cubic-bezier(0.22,1,0.36,1)',
                      background: hatchProgress.overall >= 100
                        ? 'linear-gradient(90deg, #5a9e8a 0%, #95d3c3 50%, #d4a843 100%)'
                        : 'linear-gradient(90deg, rgba(74,130,110,0.9) 0%, rgba(149,211,195,0.95) 100%)',
                      boxShadow: hatchProgress.overall > 0 ? '0 0 14px rgba(149,211,195,0.35)' : 'none',
                    }} />
                    {[100].map(pct => (
                      <div key={pct} style={{ position:'absolute', left:`${pct}%`, top:0, bottom:0, width:1, background:'rgba(0,0,0,0.25)', transform:'translateX(-50%)', pointerEvents:'none' }} />
                    ))}
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', marginTop:12, gap:4 }}>
                    {['凝聚中','靈獸顯形','下一輪'].map((s, i) => {
                      const active = hatchProgress.phaseIdx === i;
                      const done = hatchProgress.phaseIdx > i;
                      return (
                        <div key={s} style={{ flex:1, textAlign: i === 0 ? 'left' : i === 2 ? 'right' : 'center' }}>
                          <span style={{
                            fontSize:11, fontFamily:serif, letterSpacing:'0.08em', display:'block',
                            color: active ? 'var(--jade)' : done ? 'rgba(149,211,195,0.55)' : 'rgba(149,211,195,0.2)',
                            fontWeight: active ? 800 : 500,
                          }}>{s}</span>
                          {active && <span style={{ fontSize:9, color:'var(--amber)', fontFamily:serif }}>進行中</span>}
                          {done && <span style={{ fontSize:9, color:'rgba(149,211,195,0.4)', fontFamily:serif }}>已達成</span>}
                        </div>
                      );
                    })}
                  </div>
                  <p style={{ fontSize:12, color:'var(--sand)', fontFamily:serif, textAlign:'center', margin:'14px 0 0', lineHeight:1.6 }}>{hatchProgress.nextMilestone}</p>
                  <div style={{ textAlign:'right', marginTop:10 }}>
                    <span style={{ fontSize:11, color:'var(--mist)', fontFamily:serif }}>累計 {hatch.count} 筆紀錄</span>
                  </div>
                </div>

                {/* 階段 0：尚無紀錄 */}
                {hatch.stage === 0 && (
                  <div style={{ padding:'48px 24px', textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
                    <div style={{ width:120, height:150 }}>
                      <HatchPortrait hatchState={hatch} />
                    </div>
                    <h3 style={{ fontSize:20, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'var(--jade)', margin:0 }}>靈獸尚未降世</h3>
                    <p style={{ fontSize:15, color:'var(--sand)', lineHeight:1.8, margin:0 }}>記下第一餐，你的山海靈獸將從這裡開始孵化</p>
                  </div>
                )}

                {/* 階段 1：凝聚中 */}
                {hatch.stage === 1 && (
                  <div style={{ padding:'32px 24px', display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
                    <div
                      role="button"
                      tabIndex={0}
                      onClick={() => pickCreatureForTuner(hatch.formingType)}

    function ProfileView({ records, loginProfile, onLogout }) {
      const hatch = useMemo(() => getHatchState(records), [records]);
      const latestType = hatch.avatarType || hatch.formingType || (records[0] ? MBEI_TYPES[records[0].mbeiCode] : MBEI_TYPES['MPLR']);
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [rankTab, setRankTab] = useState('personal');
      const [lbLoading, setLbLoading] = useState(true);
      const [lbError, setLbError] = useState('');
      const [lbFetchedAt, setLbFetchedAt] = useState(null);
      const [notionPersonal, setNotionPersonal] = useState([]);
      const [notionMbei, setNotionMbei] = useState([]);

      React.useEffect(() => {
        let cancelled = false;
        setLbLoading(true);
        setLbError('');
        fetchNotionLeaderboard(loginProfile?.email).then((res) => {
          if (cancelled) return;
          if (res.ok) {
            setNotionPersonal(res.personal);
            setNotionMbei(res.mbei);
            setLbFetchedAt(res.fetchedAt);
          } else {
            setLbError(res.error || '無法載入排行榜');
            setNotionPersonal([]);
            setNotionMbei([]);
          }
          setLbLoading(false);
        });
        return () => { cancelled = true; };
      }, [loginProfile?.email]);

      const personalLeaderboard = useMemo(() => {
        const rows = [...notionPersonal];
        const key = normalizeEmail(loginProfile?.email || '');
        const localPts = calcMeritTotal(records);
        const code = hatch.avatarType?.code || latestType.code;
        const idx = rows.findIndex((r) => normalizeEmail(r.email || '') === key);
        if (idx >= 0) {
          rows[idx] = {
            ...rows[idx],
            isUser: true,
            name: rows[idx].name || loginProfile?.nickname || '修行者',
            points: Math.max(rows[idx].points || 0, localPts),
            recordCount: Math.max(rows[idx].recordCount || 0, records.length),
            hatched: hatch.hasHatched || !!rows[idx].hatched,
            code: hatch.hasHatched ? code : null,
            scoreLabel: '累積功德',
          };
        } else if (loginProfile?.nickname || localPts > 0) {
          rows.push({
            name: loginProfile?.nickname || '修行者',
            email: key,
            points: localPts,
            recordCount: records.length,
            hatched: hatch.hasHatched,
            code: hatch.hasHatched ? code : null,
            isUser: true,
            scoreLabel: '累積功德',
          });
        }
        return rows
          .sort((a, b) => (b.points || 0) - (a.points || 0))
          .map((u, i) => ({ ...u, rank: i + 1, scoreLabel: u.scoreLabel || '累積功德' }));
      }, [notionPersonal, loginProfile, records, hatch, latestType.code]);

      const mbeiLeaderboard = useMemo(() => {
        const rows = [...notionMbei];
        const localCode = hatch.hasHatched ? hatch.avatarType?.code : null;
        if (localCode && !rows.some((u) => u.code === localCode)) {
          rows.push({
            code: localCode,
            name: MBEI_TYPES[localCode]?.creature || localCode,
            userCount: 1,
            points: calcMeritTotal(records),
            scoreLabel: '修行者人數',
            isUser: true,
          });
        }
        return rows
          .filter((u) => (u.userCount || u.points || 0) > 0)
          .sort((a, b) => (b.userCount || 0) - (a.userCount || 0) || (b.points || 0) - (a.points || 0))
          .map((u, i) => ({
            ...u,
            rank: i + 1,
            name: MBEI_TYPES[u.code]?.creature || u.name,
            scoreLabel: u.scoreLabel || '修行者人數',
          }));
      }, [notionMbei, hatch.hasHatched, hatch.avatarType?.code, records]);

      const board = rankTab === 'personal' ? personalLeaderboard : mbeiLeaderboard;

      return (
        <div className="space-y-12 fade-in">
          <div className="grid gap-10">
            <div className="space-y-10">
              <section className="space-y-6">
                <div className="flex items-center justify-between px-2">
                  <div className="flex items-center gap-3"><AwardIcon size={22} className="text-clay" /><h3 className="text-2xl font-serif font-black tracking-tighter text-ink">食修功德排行榜</h3></div>
                  <span className="text-[10px] font-black text-muted uppercase tracking-widest opacity-60">
                    {lbLoading ? '載入中…' : lbFetchedAt ? `更新於 ${formatLeaderboardTime(lbFetchedAt)}` : ''}
                  </span>
                </div>
                <div className="px-2">
                  <div className="inline-flex gap-2 w-full md:w-auto">
                    <button onClick={() => setRankTab('personal')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='personal' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>個人榜單</button>
                    <button onClick={() => setRankTab('mbei')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='mbei' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>角色排行榜</button>
                  </div>
                </div>
                {lbError && (
                  <p className="px-2 text-sm text-clay font-semibold" style={{ fontFamily: "'Noto Serif TC', serif" }}>{lbError}</p>
                )}
                <div className="bg-white rounded-[5px] border-4 border-ink overflow-hidden shadow-2xl relative">
                  <div className="paper-texture" style={{opacity:0.02}} />
                  {lbLoading && (
                    <div className="p-12 text-center text-muted font-bold text-sm" style={{ fontFamily: "'Noto Serif TC', serif" }}>正在從 Notion 讀取功德榜…</div>
                  )}
                  {!lbLoading && board.length === 0 && (
                    <div className="p-12 text-center text-muted font-bold text-sm" style={{ fontFamily: "'Noto Serif TC', serif" }}>尚無排行資料，送出紀錄後會出現在榜上</div>
                  )}
                  {!lbLoading && board.map(user => {
                    const portraitSrc = rankTab === 'personal' && !user.hatched
                      ? BEGIN_AVATAR_IMG
                      : (CREATURE_IMG[user.code] || BEGIN_AVATAR_IMG);
                    const canOpenCreature = rankTab === 'mbei'
                      ? !!MBEI_TYPES[user.code]
                      : !!(user.hatched && user.code && MBEI_TYPES[user.code]);
                    return (
                    <div key={`${rankTab}-${user.rank}-${user.name}-${user.code || 'pending'}`} onClick={() => { if (canOpenCreature) setSelectedCreature(MBEI_TYPES[user.code]); }} style={{ cursor: canOpenCreature ? 'pointer' : 'default' }} className={cn("flex items-center justify-between p-6 md:p-8 border-b border-parchment last:border-0 transition-colors", user.isUser ? "bg-clay/10 hover:bg-clay/15" : "hover:bg-parchment/30")}>
                      <div className="flex items-center gap-6">
                        <span className={cn("w-8 text-center font-serif font-black text-lg md:text-xl", user.rank===1?"text-amber":user.rank===2?"text-muted":user.rank===3?"text-clay":"text-stroke")}>{user.rank}</span>
                        <div style={{ width:44, height:55, borderRadius:5, overflow:'hidden', flexShrink:0, border:'1px solid rgba(234,228,217,0.5)', background:'var(--paper)' }}>
                          <img src={portraitSrc} alt={user.name} style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }} />
                        </div>
                        <div>
                          <div>
                          <p className="text-lg font-black text-ink flex items-center gap-2">
                            {user.name}
                            {rankTab==='personal'&&user.isUser&&<span className="text-[10px] bg-ink text-white px-3 py-0.5 rounded-full uppercase tracking-tighter font-black">這是你</span>}
                          </p>
                          {rankTab==='personal' && user.hatched && user.code && MBEI_TYPES[user.code] && (
                            <p className="text-xs text-muted font-semibold mt-1" style={{ fontFamily: "'Noto Serif TC', serif" }}>
                              孵化靈獸 · {MBEI_TYPES[user.code].creature}
                            </p>
                          )}
                          {rankTab==='personal' && !user.hatched && (
                            <p className="text-xs text-muted font-semibold mt-1" style={{ fontFamily: "'Noto Serif TC', serif" }}>
                              待孵化 · {Math.min(user.recordCount || 0, HATCH_RECORDS_REQUIRED)}/{HATCH_RECORDS_REQUIRED}
                            </p>
                          )}
                          </div>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="text-xl font-serif font-black text-ink">{rankTab === 'mbei' ? (user.userCount ?? user.points) : user.points}</p>
                        <p className="text-[10px] font-black text-muted uppercase tracking-widest">{user.scoreLabel || '累積功德'}</p>
                      </div>
                    </div>
                    );
                  })}
                </div>
              </section>
            </div>
          </div>
          {selectedCreature && (
            <CreatureDetailModal
              creature={selectedCreature}
              onClose={() => setSelectedCreature(null)}
            />
          )}
        </div>
      );
    }

    function SpectralSlider({ value, onChange, leftLabel, rightLabel, leftColor, rightColor, trackLeft, trackRight, statusLabels }) {
      const pct = value;
      const trackStyle = { background: `linear-gradient(to right, ${trackLeft} 0%, ${trackLeft} ${pct}%, ${trackRight} ${pct}%, ${trackRight} 100%)` };
      const status = pct < 30 ? statusLabels[0] : pct < 70 ? statusLabels[1] : statusLabels[2];
      return (
        <div style={{ borderRadius:10, padding:'18px 20px 14px', position:'relative', overflow:'hidden', background:'rgba(0,0,0,0.55)', border:'1px solid rgba(255,255,255,0.06)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12, alignItems:'center' }}>
            <span style={{ fontSize:11, color:leftColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{leftLabel}</span>
            <span style={{ fontSize:10, color:'rgba(255,255,255,0.35)', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.15em' }}>{status}</span>
            <span style={{ fontSize:11, color:rightColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{rightLabel}</span>
          </div>
          <input type="range" min="0" max="100" value={value} onChange={e => onChange(parseInt(e.target.value))}
            className="spectral-slider" style={trackStyle} />
        </div>
      );
    }

          <div

            style={{ background:'#252016', border:'1px solid rgba(149,211,195,0.12)', maxHeight:'none' }}

            <div className="flex justify-between items-start">
              <div>
                <h3 style={{ fontSize:28, fontFamily:serif, fontWeight:900, color:'var(--cream)', margin:0 }}>記錄這一餐</h3>

              </div>

            <button type="button" onClick={() => onPickTrack('early')} style={trackCard}
              onMouseEnter={e => { e.currentTarget.style.background = 'rgba(149,211,195,0.1)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = trackCard.background; }}>
              <p style={{ fontSize:20, fontWeight:900, color:'var(--jade)', margin:'0 0 4px', fontFamily:serif }}>🌿 先記食物</p>
              <p style={{ fontSize:14, color:'var(--sand)', margin:0, lineHeight:1.5 }}>拍照存食物，吃完再補感受</p>

              <p style={{ fontSize:20, fontWeight:900, color:'var(--amber)', margin:'0 0 4px', fontFamily:serif }}>🍽 吃完再記</p>

                  <div key={d.id} className="flex items-center gap-2 p-3 rounded-xl border border-jade/25 bg-parchment/30">

                    <div className="flex-1 min-w-0">

                      <p style={{ fontSize:11, color:'var(--mist)', margin:'2px 0 0' }}>{d.mealType} · {d.mealTime}</p>
                    </div>
                    <button type="button" onClick={() => onContinueDraft(d.id)}
                      style={{ padding:'8px 12px', borderRadius:8, background:'var(--ink)', color:'white', fontSize:12, fontWeight:700, border:'none', cursor:'pointer' }}>繼續</button>

    function RecordModal({ onClose, onSubmit, formData, setFormData, isLoading, submitError, onSchedulePrefetch, onClearPrefetch, prefetchStatus, recordMode, initialPhase, onSaveDraft, initialPhotoPreview, onPhotoChange }) {
      const setField = (field, value) => setFormData(prev => ({...prev, [field]: value}));
      const photoInputRef = React.useRef(null);
      const [phase, setPhase] = React.useState(initialPhase || (recordMode === 'after' ? 'all' : 'food'));
      const [photoPreview, setPhotoPreview] = React.useState(initialPhotoPreview || null);
      const [photoSizeKB, setPhotoSizeKB] = React.useState(null);
      const [recognizePhase, setRecognizePhase] = React.useState('idle');
      const [recognizeError, setRecognizeError] = React.useState('');
      const [confirmDraft, setConfirmDraft] = React.useState('');
      const [foodConfirmed, setFoodConfirmed] = React.useState(() => !!formData.whatFood?.trim());

      const showFoodSection = phase === 'food' || phase === 'all';
      const showFeelingsSection = phase === 'feelings' || phase === 'all';
      const isEarlyFoodStep = recordMode === 'early' && phase === 'food';
      const moodSliderReady = typeof formData.moodSlider === 'number';
      const bodySliderReady = typeof formData.bodyComfort === 'number';
      const feelingsComplete = isFeelingsComplete(formData);
      const feelingsPreview = feelingsFromForm(formData);
      const serif = "'Noto Serif TC',serif";

      const modalSubtitle = recordMode === 'early'
        ? (phase === 'food' ? '先記食物' : '補上飯後感受')
        : recordMode === 'continue' ? '補上飯後食緒' : '飯後一次記完';

      React.useEffect(() => {
        if (!showFeelingsSection || !foodConfirmed || !formData.whatFood?.trim() || !isFeelingsComplete(formData)) return;
        const t = setTimeout(() => onSchedulePrefetch?.(formData), 1500);
        return () => clearTimeout(t);
      }, [showFeelingsSection, foodConfirmed, formData.whatFood, formData.mealType, formData.moodSlider, formData.bodyComfort, formData.mealTime, formData.context]);

      React.useEffect(() => () => onClearPrefetch?.(), []);

      React.useEffect(() => {
        if (initialPhotoPreview) setPhotoPreview(initialPhotoPreview);
      }, [initialPhotoPreview]);

      React.useEffect(() => {
        onPhotoChange?.(photoPreview || null);
      }, [photoPreview, onPhotoChange]);

      React.useEffect(() => {
        if (recordMode === 'continue' && formData.whatFood?.trim()) setFoodConfirmed(true);
      }, [recordMode, formData.whatFood]);

      const applyPhotoMealTime = (file) => {
        const t = file.lastModified > 0 ? new Date(file.lastModified) : new Date();
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        setField('mealTime', `${hh}:${mm}`);
      };

      const handlePhotoFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        applyPhotoMealTime(file);
        setRecognizeError('');
        setRecognizePhase('compressing');
        try {
          const compressed = await compressImageFile(file);
          setPhotoPreview(compressed.previewUrl);
          setPhotoSizeKB(compressed.sizeKB);
          setRecognizePhase('recognizing');
          const name = await recognizeFoodFromImage(compressed.base64, compressed.mimeType);
          setConfirmDraft(name);
          setRecognizePhase('confirm');
        } catch (err) {
          setRecognizeError(err.message || '辨識失敗');
          setRecognizePhase('error');
        }
      };

      const confirmRecognition = () => {
        const name = confirmDraft.trim();
        if (!name) return;
        setField('whatFood', name);
        setFoodConfirmed(true);
        setRecognizePhase('idle');
        onSchedulePrefetch?.({ ...formData, whatFood: name });
      };

      const cancelRecognition = () => {
        setRecognizePhase('idle');
        setConfirmDraft('');
        setPhotoPreview(null);
        setPhotoSizeKB(null);
      };

      const onWhatFoodChange = (e) => {
        const v = e.target.value;
        setField('whatFood', v);
        if (!v.trim()) setFoodConfirmed(false);
      };

      const onWhatFoodBlur = () => {
        if (formData.whatFood?.trim() && recognizePhase === 'idle') setFoodConfirmed(true);
      };

      const isRecognizing = recognizePhase === 'compressing' || recognizePhase === 'recognizing';

      const scrollRef = React.useRef(null);
      const feelingsSectionRef = React.useRef(null);
      const [scrolledToEnd, setScrolledToEnd] = React.useState(false);

      const updateScrollEnd = React.useCallback(() => {
        const el = scrollRef.current;
        if (!el) return;
        const threshold = 96;
        const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
        setScrolledToEnd(atEnd);
      }, []);

      React.useEffect(() => {
        setScrolledToEnd(false);
        requestAnimationFrame(() => updateScrollEnd());
      }, [phase, updateScrollEnd]);

      React.useEffect(() => {
        if (phase !== 'feelings') return undefined;
        const t = setTimeout(() => {
          feelingsSectionRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
        return () => clearTimeout(t);
      }, [phase]);

      React.useEffect(() => {
        updateScrollEnd();
        const el = scrollRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => updateScrollEnd());
        ro.observe(el);
        return () => ro.disconnect();
      }, [updateScrollEnd, phase, showFoodSection, showFeelingsSection, formData.whatFood, formData.moodSlider, formData.bodyComfort, formData.context, recognizePhase, photoPreview]);

      const foodReady = !!formData.whatFood?.trim() && recognizePhase !== 'confirm' && !isRecognizing;
      const canSaveDraft = scrolledToEnd && foodReady;
      const canContinueFeelings = scrolledToEnd && foodReady;
      const canSubmit = scrolledToEnd && foodReady && feelingsComplete && !isLoading;

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center overflow-hidden p-2 md:p-12">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm record-overlay-veil" onClick={onClose} />
          <div className="w-full max-w-lg md:max-w-3xl h-[88vh] md:h-auto md:max-h-[85vh] bg-paper rounded-t-[5px] md:rounded-[5px] relative z-10 flex flex-col shadow-2xl overflow-hidden record-modal-sacred cn-red-frame-modal min-w-0">
            <div className="record-sacred-flash" aria-hidden="true" />
            <div className="record-sacred-glow" aria-hidden="true" />
            <span className="cn-corner cn-corner-tl" aria-hidden="true" />
            <span className="cn-corner cn-corner-tr" aria-hidden="true" />
            <span className="cn-corner cn-corner-bl" aria-hidden="true" />
            <span className="cn-corner cn-corner-br" aria-hidden="true" />
            <div className="paper-texture" style={{opacity:0.03}} />
            <div className="p-4 md:p-8 flex justify-between items-start gap-3 border-b border-stroke shrink-0 bg-parchment/80 backdrop-blur-md relative z-10 min-w-0">
              <div className="space-y-0.5 min-w-0 flex-1">
                <h3 className="text-2xl md:text-3xl font-serif font-black tracking-tighter text-ink">凝練食緒</h3>
                <p className="hidden sm:block text-[10px] font-black text-muted uppercase tracking-[0.2em] truncate">CRAFTING DIETARY SPIRIT</p>
                <p className="text-xs font-semibold text-jade/90 truncate" style={{ fontFamily:serif, letterSpacing:'0.05em' }}>{modalSubtitle}</p>
              </div>
              <button onClick={onClose} className="w-10 h-10 md:w-12 md:h-12 shrink-0 flex items-center justify-center bg-ink text-white rounded-full hover:opacity-90 active:opacity-75 transition-opacity shadow-lg"><XIcon size={22} /></button>
            </div>
            <div
              ref={scrollRef}
              onScroll={updateScrollEnd}
              className="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-10 space-y-8 md:space-y-10 pb-6 scrollbar-hide relative z-10 min-w-0"
            >
              {phase === 'feelings' && formData.whatFood?.trim() && (
                <div
                  className="flex items-center gap-3 flex-wrap"
                  style={{
                    padding:'14px 16px', borderRadius:16,
                    border:'1px solid rgba(149,211,195,0.28)',
                    background:'rgba(0,0,0,0.35)',
                    boxShadow:'inset 0 1px 0 rgba(255,255,255,0.04)',
                  }}
                >
                  {photoPreview && <img src={photoPreview} alt="" className="w-14 h-14 rounded-xl object-cover border border-jade/30 shrink-0" />}
                  <div className="flex-1 min-w-0">
                    <p style={{ fontSize:10, color:'var(--jade)', margin:'0 0 5px', letterSpacing:'0.14em', fontWeight:700, opacity:0.9 }}>本餐食物</p>
                    <p style={{ fontSize:20, fontWeight:900, color:'var(--cream)', margin:0, fontFamily:serif, lineHeight:1.35, letterSpacing:'0.03em' }}>{formData.whatFood}</p>
                    <p style={{ fontSize:12, color:'var(--sand)', margin:'5px 0 0', opacity:0.88 }}>{formData.mealType} · {formData.mealTime}</p>
                  </div>
                  {(recordMode === 'early' || recordMode === 'continue') && (
                    <button type="button" onClick={() => setPhase('food')} className="text-xs font-bold text-jade/80 underline shrink-0 hover:text-jade">修改食物</button>
                  )}
                </div>
              )}
              {showFoodSection && (
              <>
              <RecordSection title={recordMode === 'after' ? '這一餐吃了什麼？（拍照或選照片）' : '這一餐吃了什麼？'}>
                <input ref={photoInputRef} type="file" accept="image/*" className="hidden" onChange={handlePhotoFile} />
                <div className="flex gap-2 flex-wrap min-w-0">
                  <input type="text" className="flex-1 min-w-0 w-full rounded-[1.5rem] border-2 border-stroke bg-white px-4 md:px-6 py-3 md:py-4 text-base md:text-lg font-semibold text-ink placeholder:text-[#B0A7A1] focus:outline-none focus:border-ink/30" placeholder="手動輸入食物名稱" value={formData.whatFood || ''} onChange={onWhatFoodChange} onBlur={onWhatFoodBlur} required={phase === 'food' || phase === 'all'} disabled={isRecognizing || phase === 'feelings'} />
                  <button type="button" onClick={() => photoInputRef.current?.click()} disabled={isRecognizing || phase === 'feelings'}
                    className="shrink-0 w-14 h-14 rounded-[1.5rem] border-2 border-stroke bg-white flex items-center justify-center text-ink hover:border-jade/50 disabled:opacity-50"
                    title="拍照或選照片"
                    aria-label="拍照或選照片">
                    {isRecognizing ? <span className="spin-loading text-xl">☯</span> : <CameraIcon size={22} />}
                  </button>
                </div>
                {(photoPreview || photoSizeKB) && (
                  <div className="mt-3 flex items-center gap-3">
                    {photoPreview && <img src={photoPreview} alt="預覽" className="w-16 h-16 rounded-xl object-cover border border-stroke" />}
                    {photoSizeKB != null && <span className="text-[11px] text-muted font-mono">已壓縮約 {photoSizeKB} KB</span>}
                  </div>

    /** 詩籤揭曉（送出後第二段儀式：金光凝聚 → 詩籤浮現） */
    function FortuneDecreeModal({ record, onClose }) {
      const fortune = useMemo(() => record.fortune || getMockFortune(record), [record]);
      const [ready, setReady] = React.useState(false);
      const reduceFx = typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape' && ready) onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose, ready]);

      React.useEffect(() => {
        playOneShotAudio(BELL_AUDIO_SRC, 0.78);
        if (reduceFx) {
          setReady(true);
          return undefined;

        const t = setTimeout(() => setReady(true), DECREE_REVEAL_MS);
        return () => clearTimeout(t);
      }, [reduceFx]);

      return (
        <div
          className="decree-reveal-root fixed inset-0 z-[110] flex items-center justify-center p-3 sm:p-4 md:p-8"
          role="dialog"

    // ── Main App ──
    function App() {
      const [loginProfile, setLoginProfile] = useState(() => {
        const profiles = loadProfiles();
        const activeEmail = localStorage.getItem(ACTIVE_USER_KEY);
        if (!activeEmail) return null;

      const [splashDone, setSplashDone] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [showProfilePopup, setShowProfilePopup] = useState(false);
      const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
      const [showRecordPicker, setShowRecordPicker] = useState(false);
      const [isRecordOpen, setIsRecordOpen] = useState(false);
      const [recordMode, setRecordMode] = useState(null);
