    function ProfileView({ records, loginProfile, onLogout }) {
      const hatch = useMemo(() => getHatchState(records), [records]);
      const latestType = hatch.avatarType || hatch.formingType || (records[0] ? MBEI_TYPES[records[0].mbeiCode] : MBEI_TYPES['MPLR']);
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [creatureNavEnabled, setCreatureNavEnabled] = useState(true);
      const encCreatures = Object.values(MBEI_TYPES);
      const encIdx = selectedCreature ? encCreatures.findIndex(c => c.code === selectedCreature.code) : 0;
      const goCreature = dir => setSelectedCreature(encCreatures[(encIdx + dir + encCreatures.length) % encCreatures.length]);
      const [rankTab, setRankTab] = useState('personal');
      const [lbLoading, setLbLoading] = useState(true);
      const [lbError, setLbError] = useState('');
      const [lbFetchedAt, setLbFetchedAt] = useState(null);
      const [notionPersonal, setNotionPersonal] = useState([]);
      const [notionMbei, setNotionMbei] = useState([]);

      React.useEffect(() => {
        let cancelled = false;
        setLbLoading(true);
        setLbError('');
        fetchNotionLeaderboard(loginProfile?.email).then((res) => {
          if (cancelled) return;
          if (res.ok) {
            setNotionPersonal(res.personal);
            setNotionMbei(res.mbei);
            setLbFetchedAt(res.fetchedAt);
          } else {
            setLbError(res.error || '無法載入排行榜');
            setNotionPersonal([]);
            setNotionMbei([]);
          }
          setLbLoading(false);
        });
        return () => { cancelled = true; };
      }, [loginProfile?.email]);

      const personalLeaderboard = useMemo(() => {
        const rows = [...notionPersonal];
        const key = normalizeEmail(loginProfile?.email || '');
        const localPts = calcMeritTotal(records);
        const code = hatch.avatarType?.code || latestType.code;
        const idx = rows.findIndex((r) => normalizeEmail(r.email || '') === key);
        if (idx >= 0) {
          rows[idx] = {
            ...rows[idx],
            isUser: true,
            name: rows[idx].name || loginProfile?.nickname || '修行者',
            points: Math.max(rows[idx].points || 0, localPts),
            recordCount: Math.max(rows[idx].recordCount || 0, records.length),
            hatched: hatch.hasHatched || !!rows[idx].hatched,
            code: hatch.hasHatched ? code : null,
            scoreLabel: '累積功德',
          };
        } else if (loginProfile?.nickname || localPts > 0) {
          rows.push({
            name: loginProfile?.nickname || '修行者',
            email: key,
            points: localPts,
            recordCount: records.length,
            hatched: hatch.hasHatched,
            code: hatch.hasHatched ? code : null,
            isUser: true,
            scoreLabel: '累積功德',
          });
        }
        return rows
          .sort((a, b) => (b.points || 0) - (a.points || 0))
          .map((u, i) => ({ ...u, rank: i + 1, scoreLabel: u.scoreLabel || '累積功德' }));
      }, [notionPersonal, loginProfile, records, hatch, latestType.code]);

      const mbeiLeaderboard = useMemo(() => {
        return notionMbei
          .filter((u) => (u.userCount || u.points || 0) > 0)
          .map((u, i) => ({
            ...u,
            rank: i + 1,
            name: MBEI_TYPES[u.code]?.creature || u.name,
            scoreLabel: u.scoreLabel || '修行者人數',
          }));
      }, [notionMbei]);

      const board = rankTab === 'personal' ? personalLeaderboard : mbeiLeaderboard;

      return (
        <div className="space-y-12 fade-in">
          <div className="grid gap-10">
            <div className="space-y-10">
              <section className="space-y-6">
                <div className="flex items-center justify-between px-2">
                  <div className="flex items-center gap-3"><AwardIcon size={22} className="text-clay" /><h3 className="text-2xl font-serif font-black tracking-tighter text-ink">食修功德排行榜</h3></div>
                  <span className="text-[10px] font-black text-muted uppercase tracking-widest opacity-60">
                    {lbLoading ? '載入中…' : lbFetchedAt ? `更新於 ${formatLeaderboardTime(lbFetchedAt)}` : ''}
                  </span>
                </div>
                <div className="px-2">
                  <div className="inline-flex gap-2 w-full md:w-auto">
                    <button onClick={() => setRankTab('personal')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='personal' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>個人榜單</button>
                    <button onClick={() => setRankTab('mbei')} className={cn("flex-1 px-5 py-2.5 rounded-xl text-xs font-black tracking-widest border-2 transition-all", rankTab==='mbei' ? "border-jade text-jade bg-jade/10" : "border-stroke text-muted bg-transparent")}>角色排行榜</button>
                  </div>
                </div>
                {lbError && (
                  <p className="px-2 text-sm text-clay font-semibold" style={{ fontFamily: "'Noto Serif TC', serif" }}>{lbError}</p>
                )}
                <div className="bg-white rounded-[5px] border-4 border-ink overflow-hidden shadow-2xl relative">
                  <div className="paper-texture" style={{opacity:0.02}} />
                  {lbLoading && (
                    <div className="p-12 text-center text-muted font-bold text-sm" style={{ fontFamily: "'Noto Serif TC', serif" }}>正在從 Notion 讀取功德榜…</div>
                  )}
                  {!lbLoading && board.length === 0 && (
                    <div className="p-12 text-center text-muted font-bold text-sm" style={{ fontFamily: "'Noto Serif TC', serif" }}>尚無排行資料，送出紀錄後會出現在榜上</div>
                  )}
                  {!lbLoading && board.map(user => {
                    const portraitSrc = rankTab === 'personal' && !user.hatched
                      ? BEGIN_AVATAR_IMG
                      : (CREATURE_IMG[user.code] || BEGIN_AVATAR_IMG);
                    const canOpenCreature = rankTab === 'mbei'
                      ? !!MBEI_TYPES[user.code]
                      : !!(user.hatched && user.code && MBEI_TYPES[user.code]);
                    return (
                    <div key={`${rankTab}-${user.rank}-${user.name}-${user.code || 'pending'}`} onClick={() => { if (canOpenCreature) { setSelectedCreature(MBEI_TYPES[user.code]); setCreatureNavEnabled(rankTab === 'mbei'); } }} style={{ cursor: canOpenCreature ? 'pointer' : 'default' }} className={cn("flex items-center justify-between p-6 md:p-8 border-b border-parchment last:border-0 transition-colors", user.isUser ? "bg-clay/10 hover:bg-clay/15" : "hover:bg-parchment/30")}>
                      <div className="flex items-center gap-6">
                        <span className={cn("w-8 text-center font-serif font-black text-lg md:text-xl", user.rank===1?"text-amber":user.rank===2?"text-muted":user.rank===3?"text-clay":"text-stroke")}>{user.rank}</span>
                        <div style={{ width:44, height:55, borderRadius:5, overflow:'hidden', flexShrink:0, border:'1px solid rgba(234,228,217,0.5)', background:'var(--paper)' }}>
                          <img src={portraitSrc} alt={user.name} style={{ width:'100%', height:'100%', objectFit:'contain', display:'block' }} />
                        </div>
                        <div>
                          <div>
                          <p className="text-lg font-black text-ink flex items-center gap-2">
                            {user.name}
                            {rankTab==='personal'&&user.isUser&&<span className="text-[10px] bg-ink text-white px-3 py-0.5 rounded-full uppercase tracking-tighter font-black">這是你</span>}
                          </p>
                          {rankTab==='personal' && user.hatched && user.code && MBEI_TYPES[user.code] && (
                            <p className="text-xs text-muted font-semibold mt-1" style={{ fontFamily: "'Noto Serif TC', serif" }}>
                              孵化靈獸 · {MBEI_TYPES[user.code].creature}
                            </p>
                          )}
                          {rankTab==='personal' && !user.hatched && (
                            <p className="text-xs text-muted font-semibold mt-1" style={{ fontFamily: "'Noto Serif TC', serif" }}>
                              待孵化 · {Math.min(user.recordCount || 0, HATCH_RECORDS_REQUIRED)}/{HATCH_RECORDS_REQUIRED}
                            </p>
                          )}
                          </div>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="text-xl font-serif font-black text-ink">{rankTab === 'mbei' ? (user.userCount ?? user.points) : user.points}</p>
                        <p className="text-[10px] font-black text-muted uppercase tracking-widest">{user.scoreLabel || '累積功德'}</p>
                      </div>
                    </div>
                    );
                  })}
                </div>
              </section>
            </div>
          </div>
          {selectedCreature && (
            <CreatureDetailModal
              creature={selectedCreature}
              onClose={() => setSelectedCreature(null)}
              showNav={creatureNavEnabled}
              navIndex={encIdx}
              navTotal={encCreatures.length}
              onPrev={() => goCreature(-1)}
              onNext={() => goCreature(1)}
            />
          )}
        </div>
      );
    }

    function SpectralSlider({ value, onChange, leftLabel, rightLabel, leftColor, rightColor, trackLeft, trackRight, statusLabels }) {
      const pct = value;
      const trackStyle = { background: `linear-gradient(to right, ${trackLeft} 0%, ${trackLeft} ${pct}%, ${trackRight} ${pct}%, ${trackRight} 100%)` };
      const status = pct < 30 ? statusLabels[0] : pct < 70 ? statusLabels[1] : statusLabels[2];
      return (
        <div style={{ borderRadius:10, padding:'18px 20px 14px', position:'relative', overflow:'hidden', background:'rgba(0,0,0,0.55)', border:'1px solid rgba(255,255,255,0.06)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12, alignItems:'center' }}>
            <span style={{ fontSize:11, color:leftColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{leftLabel}</span>
            <span style={{ fontSize:10, color:'rgba(255,255,255,0.35)', fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.15em' }}>{status}</span>
            <span style={{ fontSize:11, color:rightColor, fontFamily:"'Noto Serif TC',serif", letterSpacing:'0.1em' }}>{rightLabel}</span>
          </div>
          <input type="range" min="0" max="100" value={value} onChange={e => onChange(parseInt(e.target.value))}
            className="spectral-slider" style={trackStyle} />
        </div>
      );
    }

    function RecordTrackPicker({ onClose, drafts, onPickTrack, onContinueDraft, onDeleteDraft }) {

      const trackCard = {
        textAlign:'left', padding:'16px 18px', borderRadius:10, cursor:'pointer', width:'100%',

      return (

          <div
            className="w-full max-w-lg relative z-10 rounded-t-[16px] md:rounded-[5px] shadow-2xl p-6 md:p-8 space-y-4 result-modal-sheet"
            style={{ background:'#252016', border:'1px solid rgba(149,211,195,0.12)', maxHeight:'none' }}
            onClick={e => e.stopPropagation()}
          >
            <div className="md:hidden flex justify-center -mt-1 mb-1">
              <div style={{ width:40, height:4, borderRadius:2, background:'rgba(149,211,195,0.2)' }} />
            </div>
            <div className="flex justify-between items-start">
              <div>
                <h3 style={{ fontSize:28, fontFamily:serif, fontWeight:900, color:'var(--cream)', margin:0 }}>記錄這一餐</h3>
                <p style={{ fontSize:15, color:'var(--mist)', margin:'6px 0 0' }}>選擇時機</p>
              </div>
              <button onClick={onClose} className="w-10 h-10 rounded-full bg-ink text-white flex items-center justify-center"><XIcon size={20} /></button>
            </div>
            <button type="button" onClick={() => onPickTrack('early')} style={trackCard}
              onMouseEnter={e => { e.currentTarget.style.background = 'rgba(149,211,195,0.1)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = trackCard.background; }}>
              <p style={{ fontSize:20, fontWeight:900, color:'var(--jade)', margin:'0 0 4px', fontFamily:serif }}>🌿 先記食物</p>
              <p style={{ fontSize:14, color:'var(--sand)', margin:0, lineHeight:1.5 }}>拍照存食物，吃完再補感受</p>
            </button>
            <button type="button" onClick={() => onPickTrack('after')} style={trackCard}
              onMouseEnter={e => { e.currentTarget.style.background = 'rgba(149,211,195,0.1)'; }}
              onMouseLeave={e => { e.currentTarget.style.background = trackCard.background; }}>
              <p style={{ fontSize:20, fontWeight:900, color:'var(--amber)', margin:'0 0 4px', fontFamily:serif }}>🍽 吃完再記</p>
              <p style={{ fontSize:14, color:'var(--sand)', margin:0, lineHeight:1.5 }}>飯後一次記完</p>
            </button>
            {drafts.length > 0 && (
              <div className="pt-2 border-t border-stroke/60 space-y-3">
                <p style={{ fontSize:11, color:'var(--mist)', letterSpacing:'0.2em', margin:0, fontWeight:700 }}>待補食緒</p>
                {drafts.map(d => (
                  <div key={d.id} className="flex items-center gap-2 p-3 rounded-xl border border-jade/25 bg-parchment/30">
                    {d.photoPreviewUrl && <img src={d.photoPreviewUrl} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0" />}
                    <div className="flex-1 min-w-0">
                      <p style={{ fontSize:14, fontWeight:700, color:'var(--cream)', margin:0, fontFamily:serif }}>{d.whatFood || '未命名餐點'}</p>
                      <p style={{ fontSize:11, color:'var(--mist)', margin:'2px 0 0' }}>{d.mealType} · {d.mealTime}</p>
                    </div>
                    <button type="button" onClick={() => onContinueDraft(d.id)}
                      style={{ padding:'8px 12px', borderRadius:8, background:'var(--ink)', color:'white', fontSize:12, fontWeight:700, border:'none', cursor:'pointer' }}>繼續</button>
                    <button type="button" onClick={() => onDeleteDraft(d.id)} aria-label="刪除草稿"
                      style={{ padding:'8px', background:'transparent', border:'none', color:'var(--clay)', cursor:'pointer', fontSize:18 }}>×</button>
                  </div>
                ))}

            )}

        </div>
      );

    function RecordModal({ onClose, onSubmit, formData, setFormData, isLoading, submitError, onSchedulePrefetch, onClearPrefetch, prefetchStatus, recordMode, initialPhase, onSaveDraft, initialPhotoPreview, onPhotoChange }) {
      const setField = (field, value) => setFormData(prev => ({...prev, [field]: value}));
      const photoInputRef = React.useRef(null);
      const [phase, setPhase] = React.useState(initialPhase || (recordMode === 'after' ? 'all' : 'food'));
      const [photoPreview, setPhotoPreview] = React.useState(initialPhotoPreview || null);
      const [photoSizeKB, setPhotoSizeKB] = React.useState(null);
      const [recognizePhase, setRecognizePhase] = React.useState('idle');
      const [recognizeError, setRecognizeError] = React.useState('');
      const [confirmDraft, setConfirmDraft] = React.useState('');
      const [foodConfirmed, setFoodConfirmed] = React.useState(() => !!formData.whatFood?.trim());

      const showFoodSection = phase === 'food' || phase === 'all';
      const showFeelingsSection = phase === 'feelings' || phase === 'all';
      const isEarlyFoodStep = recordMode === 'early' && phase === 'food';
      const moodSelected = typeof formData.mood === 'number' && formData.mood >= 1 && formData.mood <= 5;
      const feelingsComplete = isFeelingsComplete(formData);
      const serif = "'Noto Serif TC',serif";

      const modalSubtitle = recordMode === 'early'
        ? (phase === 'food' ? '先記食物' : '補上飯後感受')
        : recordMode === 'continue' ? '補上飯後食緒' : '飯後一次記完';

      React.useEffect(() => {
        if (!showFeelingsSection || !foodConfirmed || !formData.whatFood?.trim() || !isFeelingsComplete(formData)) return;
        const t = setTimeout(() => onSchedulePrefetch?.(formData), 1500);
        return () => clearTimeout(t);
      }, [showFeelingsSection, foodConfirmed, formData.whatFood, formData.mealType, formData.mood, formData.bodyFeeling, formData.mealTime, formData.context]);

      React.useEffect(() => () => onClearPrefetch?.(), []);

      React.useEffect(() => {
        if (initialPhotoPreview) setPhotoPreview(initialPhotoPreview);
      }, [initialPhotoPreview]);

      React.useEffect(() => {
        onPhotoChange?.(photoPreview || null);
      }, [photoPreview, onPhotoChange]);

      React.useEffect(() => {
        if (recordMode === 'continue' && formData.whatFood?.trim()) setFoodConfirmed(true);
      }, [recordMode, formData.whatFood]);

      const applyPhotoMealTime = (file) => {
        const t = file.lastModified > 0 ? new Date(file.lastModified) : new Date();
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        setField('mealTime', `${hh}:${mm}`);
      };

      const handlePhotoFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        applyPhotoMealTime(file);
        setRecognizeError('');
        setRecognizePhase('compressing');
        try {
          const compressed = await compressImageFile(file);
          setPhotoPreview(compressed.previewUrl);
          setPhotoSizeKB(compressed.sizeKB);
          setRecognizePhase('recognizing');
          const name = await recognizeFoodFromImage(compressed.base64, compressed.mimeType);
          setConfirmDraft(name);
          setRecognizePhase('confirm');
        } catch (err) {
          setRecognizeError(err.message || '辨識失敗');
          setRecognizePhase('error');
        }
      };

      const confirmRecognition = () => {
        const name = confirmDraft.trim();
        if (!name) return;
        setField('whatFood', name);
        setFoodConfirmed(true);
        setRecognizePhase('idle');
        onSchedulePrefetch?.({ ...formData, whatFood: name });
      };

      const cancelRecognition = () => {
        setRecognizePhase('idle');
        setConfirmDraft('');
        setPhotoPreview(null);
        setPhotoSizeKB(null);
      };

      const onWhatFoodChange = (e) => {
        const v = e.target.value;
        setField('whatFood', v);
        if (!v.trim()) setFoodConfirmed(false);
      };

      const onWhatFoodBlur = () => {
        if (formData.whatFood?.trim() && recognizePhase === 'idle') setFoodConfirmed(true);
      };

      const isRecognizing = recognizePhase === 'compressing' || recognizePhase === 'recognizing';

      const scrollRef = React.useRef(null);
      const [scrolledToEnd, setScrolledToEnd] = React.useState(false);

      const updateScrollEnd = React.useCallback(() => {
        const el = scrollRef.current;
        if (!el) return;
        const threshold = 96;
        const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
        setScrolledToEnd(atEnd);
      }, []);

      React.useEffect(() => {
        setScrolledToEnd(false);
        requestAnimationFrame(() => updateScrollEnd());
      }, [phase, updateScrollEnd]);

      React.useEffect(() => {
        updateScrollEnd();
        const el = scrollRef.current;
        if (!el) return;
        const ro = new ResizeObserver(() => updateScrollEnd());
        ro.observe(el);
        return () => ro.disconnect();
      }, [updateScrollEnd, phase, showFoodSection, showFeelingsSection, formData.whatFood, formData.mood, formData.bodyFeeling, recognizePhase, photoPreview]);

      const foodReady = !!formData.whatFood?.trim() && recognizePhase !== 'confirm' && !isRecognizing;
      const canSaveDraft = scrolledToEnd && foodReady;
      const canContinueFeelings = scrolledToEnd && foodReady;
      const canSubmit = scrolledToEnd && foodReady && feelingsComplete && !isLoading;

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center overflow-hidden p-2 md:p-12">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-sm record-overlay-veil" onClick={onClose} />
          <div className="w-full max-w-lg md:max-w-3xl h-[88vh] md:h-auto md:max-h-[85vh] bg-paper rounded-t-[5px] md:rounded-[5px] relative z-10 flex flex-col shadow-2xl overflow-hidden record-modal-sacred cn-red-frame-modal min-w-0">
            <div className="record-sacred-flash" aria-hidden="true" />
            <div className="record-sacred-glow" aria-hidden="true" />
            <span className="cn-corner cn-corner-tl" aria-hidden="true" />
            <span className="cn-corner cn-corner-tr" aria-hidden="true" />
            <span className="cn-corner cn-corner-bl" aria-hidden="true" />
            <span className="cn-corner cn-corner-br" aria-hidden="true" />
            <div className="paper-texture" style={{opacity:0.03}} />
            <div className="p-4 md:p-8 flex justify-between items-start gap-3 border-b border-stroke shrink-0 bg-parchment/80 backdrop-blur-md relative z-10 min-w-0">
              <div className="space-y-0.5 min-w-0 flex-1">
                <h3 className="text-2xl md:text-3xl font-serif font-black tracking-tighter text-ink">凝練食緒</h3>
                <p className="hidden sm:block text-[10px] font-black text-muted uppercase tracking-[0.2em] truncate">CRAFTING DIETARY SPIRIT</p>
                <p className="text-xs font-semibold text-jade/90 truncate" style={{ fontFamily:serif, letterSpacing:'0.05em' }}>{modalSubtitle}</p>
              </div>
              <button onClick={onClose} className="w-10 h-10 md:w-12 md:h-12 shrink-0 flex items-center justify-center bg-ink text-white rounded-full hover:opacity-90 active:opacity-75 transition-opacity shadow-lg"><XIcon size={22} /></button>
            </div>
            <div
              ref={scrollRef}
              onScroll={updateScrollEnd}
              className="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-10 space-y-8 md:space-y-10 pb-6 scrollbar-hide relative z-10 min-w-0"
            >
              {phase === 'feelings' && formData.whatFood?.trim() && (
                <div className="p-4 rounded-[1.5rem] border border-jade/30 bg-parchment/40 flex items-center gap-3 flex-wrap">
                  {photoPreview && <img src={photoPreview} alt="" className="w-14 h-14 rounded-xl object-cover border border-stroke shrink-0" />}
                  <div className="flex-1 min-w-0">
                    <p style={{ fontSize:11, color:'var(--mist)', margin:'0 0 4px' }}>本餐食物</p>
                    <p style={{ fontSize:18, fontWeight:900, color:'var(--ink)', margin:0, fontFamily:serif }}>{formData.whatFood}</p>
                    <p style={{ fontSize:12, color:'var(--muted)', margin:'4px 0 0' }}>{formData.mealType} · {formData.mealTime}</p>
                  </div>
                  {(recordMode === 'early' || recordMode === 'continue') && (
                    <button type="button" onClick={() => setPhase('food')} className="text-xs font-bold text-muted underline shrink-0">修改食物</button>
                  )}
                </div>
              )}
              {showFoodSection && (
              <>
              <RecordSection title={recordMode === 'after' ? '這一餐吃了什麼？（拍照或選照片）' : '這一餐吃了什麼？'}>
                <input ref={photoInputRef} type="file" accept="image/*" className="hidden" onChange={handlePhotoFile} />
                <div className="flex gap-2 flex-wrap min-w-0">
                  <input type="text" className="flex-1 min-w-0 w-full rounded-[1.5rem] border-2 border-stroke bg-white px-4 md:px-6 py-3 md:py-4 text-base md:text-lg font-semibold text-ink placeholder:text-[#B0A7A1] focus:outline-none focus:border-ink/30" placeholder="手動輸入食物名稱" value={formData.whatFood || ''} onChange={onWhatFoodChange} onBlur={onWhatFoodBlur} required={phase === 'food' || phase === 'all'} disabled={isRecognizing || phase === 'feelings'} />
                  <button type="button" onClick={() => photoInputRef.current?.click()} disabled={isRecognizing || phase === 'feelings'}
                    className="shrink-0 w-14 h-14 rounded-[1.5rem] border-2 border-stroke bg-white flex items-center justify-center text-ink hover:border-jade/50 disabled:opacity-50"
                    title="拍照或選照片"
                    aria-label="拍照或選照片">
                    {isRecognizing ? <span className="spin-loading text-xl">☯</span> : <CameraIcon size={22} />}
                  </button>
                </div>
                {(photoPreview || photoSizeKB) && (
                  <div className="mt-3 flex items-center gap-3">
                    {photoPreview && <img src={photoPreview} alt="預覽" className="w-16 h-16 rounded-xl object-cover border border-stroke" />}
                    {photoSizeKB != null && <span className="text-[11px] text-muted font-mono">已壓縮約 {photoSizeKB} KB</span>}
                  </div>
                )}

    const GeminiSourceNotice = ({ fortune, variant = 'dark' }) => {
      const src = fortune?._aiSource ?? fortune?._geminiSource;

          border: isLight ? '1px solid rgba(158,42,43,0.2)' : 'none',
        }}>

        </p>

    };

    function normalizeFortuneForDisplay(fortune, recordData) {
      const base = fortune && typeof fortune === 'object' ? fortune : {};
      const fallback = getMockFortune(recordData || {});
      return {
        ...fallback,
        ...base,
        main_title: base.main_title || fallback.main_title || '食緒已入卷',
        poem: base.poem || fallback.poem || '',
        explanation: base.explanation || fallback.explanation || '',
        mythical_food_name: base.mythical_food_name || fallback.mythical_food_name || '',
        original_food_name: base.original_food_name || fallback.original_food_name || '',
        calculated_mbei: base.calculated_mbei || fallback.calculated_mbei || 'MPLR',
        mbei_scores: base.mbei_scores || fallback.mbei_scores,
        meritEarned: base.meritEarned ?? fallback.meritEarned ?? 1,
        merit_point: base.merit_point || meritPointLabel(base.meritEarned ?? fallback.meritEarned ?? 1),
      };
    }

    function FortuneSlip({ fortune, onClose, recordData }) {

      const poemLines = (safe.poem || '').split('\n').filter(Boolean);

      const hasMerit = meritN >= 1;
      const serif = "'Noto Serif TC',serif";

        <div className="fortune-card">

              position:'absolute', top:-14, right:-6, zIndex:10,
              background:'linear-gradient(135deg,#1e1600,#4a3200)',
              border:'1px solid rgba(255,215,0,0.55)',
              borderRadius:20, padding:'4px 12px',
              fontSize:11, fontWeight:700,
              color:'rgba(255,215,0,0.95)',
              fontFamily:serif,
              boxShadow:'0 0 14px rgba(255,215,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08)',
            }}>
              {safe.merit_point || meritPointLabel(meritN)}
            </div>
          )}

          {/* ── 雲霧效果（手機／減少動態時略過，避免黑屏） ── */}
          {!reduceFx && (
          <div style={{
            position:'absolute', inset:-50, borderRadius:40,
            background:'radial-gradient(ellipse at 50% 45%, rgba(255,252,230,0.98) 0%, rgba(230,210,160,0.75) 30%, rgba(180,140,80,0.35) 58%, transparent 78%)',
            animation:'mist-dissipate 1.1s cubic-bezier(0.15,0,0.8,1) forwards',
            zIndex:20, pointerEvents:'none',
          }} />

          {/* ── 卡片主體 ── */}

            maxHeight:'88vh', display:'flex', flexDirection:'column',

<div className="absolute inset-0 paper-texture" style={{opacity:0.22,mixBlendMode:'overlay',pointerEvents:'none'}} />

            <div style={{

              {/* ── 御膳賜名 + 原名 + MBEI（橫排小字）── */}
              {safe.mythical_food_name && (
                <div style={{ textAlign:'center', marginBottom:18 }}>

                    {safe.original_food_name && (

                    )}
                    {safe.calculated_mbei && (
                      <span style={{ fontSize:9, color:'rgba(255,215,100,0.5)', fontFamily:'monospace', letterSpacing:'0.12em', border:'1px solid rgba(255,215,100,0.2)', borderRadius:2, padding:'1px 5px' }}>{safe.calculated_mbei}</span>

              <div style={{ width:'55%', height:1, background:'rgba(255,255,255,0.12)', margin:'8px 0 8px' }} />

                onMouseEnter={e => e.target.style.color='rgba(255,255,255,0.85)'}

    function ResultModal({ record, onClose }) {
      const fortune = useMemo(() => record.fortune || getMockFortune(record), [record]);
      return (
        <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center p-3 sm:p-4 md:p-8">
          <div className="absolute inset-0 result-modal-backdrop" onClick={onClose} aria-hidden="true" />
          <div className="relative z-10 w-full flex justify-center pointer-events-none" style={{ maxWidth:320 }}>
            <div className="pointer-events-auto w-full">
              <FortuneSlip fortune={fortune} recordData={record} onClose={onClose} />
            </div>

    // ── Main App ──
    function App() {
      const [loginProfile, setLoginProfile] = useState(() => {
        const profiles = loadProfiles();
        const activeEmail = localStorage.getItem(ACTIVE_USER_KEY);
        if (!activeEmail) return null;
        return profiles[normalizeEmail(activeEmail)] || null;
      });
      const [splashDone, setSplashDone] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [showProfilePopup, setShowProfilePopup] = useState(false);
      const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
      const [showRecordPicker, setShowRecordPicker] = useState(false);
      const [isRecordOpen, setIsRecordOpen] = useState(false);
      const [recordMode, setRecordMode] = useState(null);
      const [editingDraftId, setEditingDraftId] = useState(null);
      const [initialPhotoPreview, setInitialPhotoPreview] = useState(null);
      const [mealDrafts, setMealDrafts] = useState(() => loadMealDrafts());
      const [isLoading, setIsLoading] = useState(false);
      const [prefetchStatus, setPrefetchStatus] = useState('idle');
      const [showResult, setShowResult] = useState(false);
      const [hatchCelebration, setHatchCelebration] = useState(null);
      const [latestRecord, setLatestRecord] = useState(null);
      const [records, setRecords] = useState(() => {
        const activeEmail = localStorage.getItem(ACTIVE_USER_KEY);
        return activeEmail ? loadUserRecords(activeEmail) : [];
      });
      const fortunePrefetchRef = React.useRef({ key: null, promise: null, result: null });
      const prefetchInFlightKeyRef = React.useRef(null);
      const recordPhotoRef = React.useRef(null);
      const submitGuardRef = React.useRef(false);
      const [submitError, setSubmitError] = useState('');
      const [formData, setFormData] = useState(makeDefaultFormData);

      React.useEffect(() => {
        if (!splashDone || !loginProfile?.email) return;
        saveUserRecords(loginProfile.email, records);
      }, [records, loginProfile?.email, splashDone]);

      const clearFortunePrefetch = () => {
        fortunePrefetchRef.current = { key: null, promise: null, result: null };
        prefetchInFlightKeyRef.current = null;
        setPrefetchStatus('idle');
      };

      const scheduleFortunePrefetch = (data) => {
        if (!data.whatFood?.trim() || !isFeelingsComplete(data)) return;
        const moodText = MOOD_SCORE_LABELS[data.mood];
        const payload = { ...data, whatFood: data.whatFood.trim(), mood: moodText };
        const key = buildFortuneKey(payload);
        const pf = fortunePrefetchRef.current;
        if (pf.key === key && (pf.result || pf.promise)) return;
        if (prefetchInFlightKeyRef.current === key) return;
        prefetchInFlightKeyRef.current = key;
        setPrefetchStatus('loading');
        const entry = { key, promise: generateAIFortune(payload), result: null };
        fortunePrefetchRef.current = entry;
        entry.promise.then(r => {
          if (prefetchInFlightKeyRef.current === key) prefetchInFlightKeyRef.current = null;
          if (fortunePrefetchRef.current.key === key) {
            fortunePrefetchRef.current.result = r;
            setPrefetchStatus('ready');
          }
        }).catch(() => {
          if (prefetchInFlightKeyRef.current === key) prefetchInFlightKeyRef.current = null;
          if (fortunePrefetchRef.current.key === key) setPrefetchStatus('error');
        });
      };

      const resolveFortune = async (data) => {
        if (!isFeelingsComplete(data)) return getMockFortune(data);
        const moodText = MOOD_SCORE_LABELS[data.mood];
        const payload = { ...data, whatFood: data.whatFood.trim(), mood: moodText };
        const key = buildFortuneKey(payload);
        const pf = fortunePrefetchRef.current;
        if (pf.key === key) {
          if (pf.result) return pf.result;
          if (pf.promise) {
            try {
              const r = await pf.promise;
              if (fortunePrefetchRef.current.key === key) return r;
            } catch { /* fall through */ }
          }
        }
        return generateAIFortune(payload);
      };

      const openRecordModal = () => {
        setMealDrafts(loadMealDrafts());
        setShowRecordPicker(true);
        setEditingDraftId(null);
        setRecordMode(null);
        setInitialPhotoPreview(null);
        recordPhotoRef.current = null;
      };

      const closeRecordModal = () => {
        clearFortunePrefetch();
        setIsRecordOpen(false);
        setShowRecordPicker(false);
        setEditingDraftId(null);
        setRecordMode(null);
        setInitialPhotoPreview(null);
        recordPhotoRef.current = null;
      };

      const pickRecordTrack = (track) => {
        clearFortunePrefetch();
        setRecordMode(track);
        setFormData(makeDefaultFormData());
        setInitialPhotoPreview(null);
        recordPhotoRef.current = null;
        setEditingDraftId(null);
        setShowRecordPicker(false);
        setIsRecordOpen(true);
      };

      const continueDraft = (id) => {
        const d = loadMealDrafts().find(x => x.id === id);
        if (!d) return;
        clearFortunePrefetch();
        setEditingDraftId(id);
        setRecordMode('continue');
        setFormData({
          mealType: d.mealType || '午餐',
          mood: typeof d.mood === 'number' ? d.mood : null,
          bodyFeeling: d.bodyFeeling || null,
          whatFood: d.whatFood || '',
          mealTime: d.mealTime || makeDefaultFormData().mealTime,
          context: d.context || '',
        });
        const draftPhoto = d.photoPreviewUrl || null;
        setInitialPhotoPreview(draftPhoto);
        recordPhotoRef.current = draftPhoto;
        setShowRecordPicker(false);
        setIsRecordOpen(true);
      };

      const deleteDraft = (id) => {
        const list = loadMealDrafts().filter(d => d.id !== id);
        saveMealDrafts(list);
        setMealDrafts(list);
      };

      const handleSaveDraft = ({ formData: fd, photoPreview }) => {
        if (!fd.whatFood?.trim()) return;
        const id = editingDraftId || String(Date.now());
        const draft = {
          id,
          whatFood: fd.whatFood.trim(),
          mealType: fd.mealType,
          mealTime: fd.mealTime,
          mood: fd.mood,
          bodyFeeling: fd.bodyFeeling,
          context: fd.context || '',
          photoPreviewUrl: photoPreview || null,
          createdAt: new Date().toISOString(),
          track: 'early',
        };
        const list = [draft, ...loadMealDrafts().filter(d => d.id !== id)];
        saveMealDrafts(list);
        setMealDrafts(list);
        closeRecordModal();
      };

      const handleLogin = (profile) => {
        const normalized = normalizeEmail(profile.email);
        const profiles = loadProfiles();
        const prev = profiles[normalized];
        profiles[normalized] = {
          ...profile,
          email: normalized,
          notionDemographicsSynced: prev?.notionDemographicsSynced || false,
        };
        saveProfiles(profiles);
        localStorage.setItem(ACTIVE_USER_KEY, normalized);
        setLoginProfile(profiles[normalized]);
        setRecords(loadUserRecords(normalized));
        setSplashDone(true);
      };

      const handleLogout = () => {
        localStorage.removeItem(ACTIVE_USER_KEY);
        setLoginProfile(null);
        setRecords([]);
        setSplashDone(false);
      };

      const handleRecord = async () => {
        if (!formData.whatFood?.trim() || !isFeelingsComplete(formData)) return;
        if (submitGuardRef.current) return;
        submitGuardRef.current = true;
        setSubmitError('');
        setIsLoading(true);
        try {
          const aiFortune = await resolveFortune(formData);
          const mbeiScores = aiFortune?.mbei_scores || scoresFromMbeiCode(aiFortune?.calculated_mbei || determineMBEI(formData));
          const mbeiCode = aiFortune?.calculated_mbei || mbeiCodeFromScores(mbeiScores) || determineMBEI(formData);
          const meritEarned = aiFortune?.meritEarned ?? calcMeritFromContext(formData.context);
          const moodText = MOOD_SCORE_LABELS[formData.mood];
          const now = new Date();
          const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
          const mealPhoto = recordPhotoRef.current;
          const newRecord = {
            id: Date.now().toString(),
            date: dateStr,
            time: formData.mealTime || new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
            whatFood: formData.whatFood.trim(),
            mealType: formData.mealType,
            mealTime: formData.mealTime,
            mood: moodText,
            bodyFeeling: formData.bodyFeeling,
            context: formData.context || '',
            meritEarned,
            mbeiCode,
            mbeiScores,
            fortune: aiFortune || undefined,
            photoPreviewUrl: mealPhoto || null,
            photoDataUrl: mealPhoto && String(mealPhoto).startsWith('data:') ? mealPhoto : null,
          };
          const nextRecords = [newRecord, ...records];
          setRecords(nextRecords);
          setLatestRecord(newRecord);
          const includeDemographics = !loginProfile?.notionDemographicsSynced;
          syncRecordToNotion(
            newRecord,
            loginProfile,
            calcMeritTotal(nextRecords),
            { includeDemographics },
          ).then(notionRes => {
            if (notionRes?.ok && includeDemographics && loginProfile?.email) {
              const key = normalizeEmail(loginProfile.email);
              const profiles = loadProfiles();
              const updated = { ...profiles[key], notionDemographicsSynced: true };
              profiles[key] = updated;
              saveProfiles(profiles);
              setLoginProfile(updated);
            }
            if (notionRes && !notionRes.ok) {
              console.warn('[Notion 未寫入]', notionRes.error);
            }
          });
          if (editingDraftId) {
            const list = loadMealDrafts().filter(d => d.id !== editingDraftId);
            saveMealDrafts(list);
            setMealDrafts(list);
            setEditingDraftId(null);
          }
          recordPhotoRef.current = null;
          clearFortunePrefetch();
          setIsRecordOpen(false);
          setShowRecordPicker(false);
          const hs = getHatchState(nextRecords);
          if (hs.justHatched && hs.avatarType) {
            setHatchCelebration({ type: hs.avatarType, cycle: hs.completedCycles });
            setShowResult(false);
          } else {
            setHatchCelebration(null);
            setShowResult(true);
          }
        } catch (err) {
          console.error('[handleRecord]', err);
          setSubmitError(err?.message || '解籤或儲存失敗，請稍後再試');
        } finally {
          setIsLoading(false);
          submitGuardRef.current = false;
        }
      };

      const recordInitialPhase = recordMode === 'continue' ? 'feelings' : recordMode === 'early' ? 'food' : 'all';

      if (!splashDone) return <LoginGate onLogin={handleLogin} existingProfile={loginProfile} />;

      return (
        <div style={{ minHeight:'100vh', background:'var(--night)', display:'flex', alignItems:'flex-start', position:'relative', fontFamily:"'Noto Serif TC', serif" }}>
          {/* 側欄（桌面） */}
          <aside style={{ display:'none', flexDirection:'column', width:280, height:'100vh', background:'rgba(15,9,0,0.92)',
            borderRight:'1px solid rgba(149,211,195,0.12)', zIndex:50, flexShrink:0, position:'sticky', top:0 }}
            className="md:flex">
            <div style={{ display:'flex', flexDirection:'column', height:'100%', padding:32, overflowY:'auto' }}>
              {/* Logo */}
              <div style={{ marginBottom:40 }}>
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                  <div style={{ width:4, height:24, background:'var(--jade)', borderRadius:2 }} />
                  <h1 style={{ fontSize:22, fontFamily:"'Noto Serif TC', serif", fontWeight:900, color:'var(--jade)', letterSpacing:'0.15em', margin:0 }}>食緒曆</h1>
                </div>
                <p style={{ fontSize:13, color:'var(--mist)', letterSpacing:'0.1em', marginLeft:12, fontWeight:500 }}>飲食覺察日誌</p>
              </div>
              {/* 導覽 */}
              <div style={{ flex:1, display:'flex', flexDirection:'column', gap:4 }}>
                {['今日日誌|home','食緒曆卡|almanac','食緒靈獸|insight','功德|profile'].map(item => {
                  const [label, tab] = item.split('|');
                  const active = activeTab === tab;
                  return (
                    <button key={tab} onClick={() => setActiveTab(tab)}
                      style={{ width:'100%', display:'flex', alignItems:'center', padding:'12px 16px', borderRadius:10,
                        background: active ? 'rgba(149,211,195,0.1)' : 'transparent',
                        border: active ? '1px solid rgba(149,211,195,0.2)' : '1px solid transparent',
                        color: active ? 'var(--jade)' : 'var(--sand)',
                        fontFamily:"'Noto Serif TC', serif", fontSize:15, fontWeight: active ? 700 : 400,
                        cursor:'pointer', letterSpacing:'0.05em', textAlign:'left' }}>
                      {label}
                    </button>
                  );
                })}
              </div>
              {/* 記錄按鈕 */}
              <button onClick={openRecordModal}
                style={{ width:'100%', background:'var(--crimson)', border:'2px solid rgba(255,180,160,0.2)', borderRadius:12,
                  padding:'14px 0', color:'var(--blush)', fontSize:14, fontWeight:800, fontFamily:"'Noto Serif TC', serif",
                  letterSpacing:'0.15em', cursor:'pointer',
                  boxShadow:'0 0 0 4px rgba(133,41,27,0.12), 0 8px 24px rgba(133,41,27,0.4)' }}
                className="record-fab-btn">
                ＋ 凝練食緒
              </button>
            </div>
          </aside>

          <div style={{ flex:1, display:'flex', flexDirection:'column', minHeight:'100vh' }}>
            {/* 手機頂欄 */}
            <header style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'16px 20px',
              background:'rgba(15,9,0,0.95)', borderBottom:'1px solid rgba(149,211,195,0.12)', zIndex:40 }}
              className="md:hidden">
              <h1 style={{ fontSize:18, fontFamily:"'Noto Serif TC', serif", fontWeight:900, color:'var(--jade)', letterSpacing:'0.2em', margin:0 }}>食緒曆</h1>
              <button onClick={() => setShowProfilePopup(true)}
                style={{ width:32, height:32, borderRadius:'50%', background:'rgba(149,211,195,0.08)',
                  border:'1px solid rgba(149,211,195,0.2)', display:'flex', alignItems:'center', justifyContent:'center',
                  color:'var(--jade)', cursor:'pointer' }}>
                <UserIcon size={16} />
              </button>
            </header>

            <main style={{ flex:1, position:'relative', zIndex:10, paddingBottom:120 }}
              className="scrollbar-hide md:pb-24">
              <div style={{ maxWidth:960, margin:'0 auto', padding:'32px 20px' }} className="md:p-12">
                {activeTab === 'home' && <HomeView records={records} loginProfile={loginProfile} mealDrafts={mealDrafts} onContinueDraft={continueDraft} />}
                {activeTab === 'almanac' && <AlmanacView records={records} />}
                {activeTab === 'insight' && <InsightView records={records} loginProfile={loginProfile} />}
                {activeTab === 'profile' && <ProfileView records={records} loginProfile={loginProfile} onLogout={handleLogout} />}
              </div>
            </main>

            {/* 手機底欄 */}
            <nav style={{ position:'fixed', bottom:0, left:0, right:0,
              background:'rgba(15,9,0,0.95)', borderRadius:'3px 3px 0 0', padding:'8px 12px 20px',
              display:'flex', alignItems:'center', justifyContent:'space-around',
              zIndex:40, borderTop:'1px solid rgba(149,211,195,0.15)',
              boxShadow:'0 -4px 24px rgba(0,0,0,0.4)' }}
              className="md:hidden">
              {['今日|home','曆卡|almanac', null, '食神|insight','功德|profile'].map((item, i) => {
                if (!item) return (
                  <button key="record" onClick={openRecordModal}
                    className="record-fab-btn"
                    style={{ width:52, height:40, background:'var(--crimson)', borderRadius:8,
                      border:'2px solid rgba(255,180,160,0.25)', display:'flex', alignItems:'center', justifyContent:'center',
                      color:'var(--blush)', fontSize:22, cursor:'pointer', flexShrink:0,
                      boxShadow:'0 4px 20px rgba(133,41,27,0.45)' }}>+</button>
                );
                const [label, tab] = item.split('|');
                return (
                  <button key={tab} onClick={() => setActiveTab(tab)}
                    style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, background:'none', border:'none', cursor:'pointer',
                      color: activeTab===tab ? 'var(--jade)' : 'var(--sand)', fontFamily:"'Noto Serif TC', serif", fontSize:13, fontWeight:600, flex:1 }}>
                    <span>{label}</span>
                  </button>
                );
              })}
            </nav>

            {showRecordPicker && !isRecordOpen && (
              <RecordTrackPicker
                drafts={mealDrafts}
                onClose={() => setShowRecordPicker(false)}
                onPickTrack={pickRecordTrack}
                onContinueDraft={continueDraft}
                onDeleteDraft={deleteDraft}
              />
            )}
            {isRecordOpen && recordMode && (
              <RecordModal
                onClose={closeRecordModal}
                onSubmit={handleRecord}
                formData={formData}
                setFormData={setFormData}
                isLoading={isLoading}
                submitError={submitError}
                onSchedulePrefetch={scheduleFortunePrefetch}
                onClearPrefetch={clearFortunePrefetch}
                prefetchStatus={prefetchStatus}
                recordMode={recordMode}
                initialPhase={recordInitialPhase}
                initialPhotoPreview={initialPhotoPreview}
                onSaveDraft={handleSaveDraft}
                onPhotoChange={(url) => { recordPhotoRef.current = url; }}
              />
            )}
            {hatchCelebration && (
              <HatchCelebrationModal
                hatchType={hatchCelebration.type}
                cycleNumber={hatchCelebration.cycle}
                onClose={() => {
                  setHatchCelebration(null);
                  if (latestRecord) setShowResult(true);
                }}
              />
            )}
            {showResult && latestRecord && !hatchCelebration && <ResultModal record={latestRecord} onClose={() => setShowResult(false)} />}

            {/* 個人資料彈跳popup（手機） */}
            {showProfilePopup && (() => {
              const hs = getHatchState(records);
              const latestType = hs.avatarType || hs.formingType || (records[0] ? MBEI_TYPES[records[0].mbeiCode] : MBEI_TYPES['MPLR']);
              return (
                <div className="md:hidden" style={{ position:'fixed', inset:0, zIndex:100, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
                  {/* 背景遮罩 */}
                  <div onClick={() => setShowProfilePopup(false)}
                    style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.55)', backdropFilter:'blur(4px)' }} />
                  {/* 彈跳卡片 */}
                  <div style={{
                    position:'relative', zIndex:1,
                    background:'linear-gradient(160deg,#1a1200 0%,#251900 60%,#1a1200 100%)',
                    borderRadius:'20px 20px 0 0',
                    border:'1px solid rgba(149,211,195,0.18)',
                    borderBottom:'none',
                    padding:'28px 24px 40px',
                    animation:'slide-up-fade 0.38s cubic-bezier(0.2,0.8,0.2,1) both',
                    boxShadow:'0 -8px 48px rgba(0,0,0,0.6)',
                  }}>
                    {/* 拖曳把手 */}
                    <div style={{ width:44, height:4, borderRadius:2, background:'rgba(149,211,195,0.25)', margin:'0 auto 24px' }} />

                    {/* 生物圖 + 基本資訊 */}
                    <div style={{ display:'flex', gap:20, alignItems:'center', marginBottom:24 }}>
                      <div style={{ width:80, height:100, borderRadius:8, overflow:'hidden', border:'3px solid rgba(149,211,195,0.25)', background:'var(--paper)', flexShrink:0, boxShadow:'0 4px 16px rgba(0,0,0,0.4)' }}>
                        <HatchPortrait hatchState={hs} />
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <p style={{ fontSize:10, fontWeight:900, color:'var(--jade)', letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:4 }}>{hs.avatarType ? '孵化靈獸' : '孵化進度'}</p>
                        <h3 style={{ fontSize:22, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'white', letterSpacing:'-0.02em', margin:'0 0 6px' }}>
                          {loginProfile?.nickname || '修行者'}
                        </h3>
                        <div style={{ display:'inline-flex', alignItems:'center', gap:6, background:'rgba(149,211,195,0.08)', border:'1px solid rgba(149,211,195,0.2)', borderRadius:20, padding:'3px 10px', marginBottom:8 }}>
                          <span style={{ fontSize:14 }}>{latestType.emoji}</span>
                          <span style={{ fontSize:11, fontWeight:700, color:'var(--sand)', letterSpacing:'0.05em' }}>{latestType.name}</span>
                        </div>
                        <p style={{ fontSize:11, color:'var(--sand)', opacity:0.7, margin:0 }}>
                          {loginProfile?.gender} · {loginProfile?.age} 歲
                          {!hs.avatarType && ` · ${hs.progressInCycle}/${HATCH_RECORDS_REQUIRED} 筆`}
                        </p>
                      </div>
                    </div>

                    {/* 功德 / 連續 數字 */}
                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:24 }}>
                      {[
                        { label:'累積功德', value: calcMeritTotal(records).toLocaleString(), unit:'' },
                        { label:'連續紀錄', value: calcStreak(records), unit:'天' },
                      ].map(({ label, value, unit }) => (
                        <div key={label} style={{ background:'rgba(255,255,255,0.04)', border:'1px solid rgba(149,211,195,0.12)', borderRadius:12, padding:'16px 12px', textAlign:'center' }}>
                          <p style={{ fontSize:9, fontWeight:900, color:'var(--jade)', letterSpacing:'0.18em', textTransform:'uppercase', marginBottom:6 }}>{label}</p>
                          <p style={{ fontSize:26, fontFamily:"'Noto Serif TC',serif", fontWeight:900, color:'white', margin:0 }}>
                            {value}<span style={{ fontSize:12, marginLeft:3, color:'var(--sand)' }}>{unit}</span>
                          </p>
                        </div>
                      ))}
                    </div>

                    {/* 操作按鈕 */}
                    {showLogoutConfirm ? (
                      <div style={{ marginBottom:10 }}>
                        <p style={{ textAlign:'center', fontSize:12, color:'var(--sand)', marginBottom:14, letterSpacing:'0.05em' }}>確定要切換使用者／登出嗎？</p>
                        <div style={{ display:'flex', gap:10 }}>
                          <button onClick={() => setShowLogoutConfirm(false)}
                            style={{ flex:1, padding:'13px', background:'transparent', border:'1px solid rgba(149,211,195,0.2)', borderRadius:12,
                              color:'rgba(200,184,138,0.6)', fontSize:13, fontWeight:700, cursor:'pointer' }}>
                            取消
                          </button>
                          <button onClick={() => { setShowProfilePopup(false); setShowLogoutConfirm(false); handleLogout(); }}
                            style={{ flex:1, padding:'13px', background:'rgba(255,80,80,0.12)', border:'1px solid rgba(255,80,80,0.3)', borderRadius:12,
                              color:'#ff6b6b', fontSize:13, fontWeight:900, letterSpacing:'0.05em', cursor:'pointer' }}>
                            確認登出
                          </button>
                        </div>
                      </div>
                    ) : (
                      <button onClick={() => setShowLogoutConfirm(true)}
                        style={{ width:'100%', padding:'14px', background:'rgba(255,80,80,0.08)', border:'1px solid rgba(255,80,80,0.2)', borderRadius:12,
                          color:'#ff8080', fontSize:13, fontWeight:900, letterSpacing:'0.1em', cursor:'pointer', marginBottom:10 }}>
                        切換使用者／登出
                      </button>
                    )}
                    <button onClick={() => { setShowProfilePopup(false); setShowLogoutConfirm(false); }}
                      style={{ width:'100%', padding:'12px', background:'transparent', border:'none',
                        color:'rgba(200,184,138,0.5)', fontSize:12, fontWeight:600, cursor:'pointer' }}>
                      關閉
                    </button>
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
